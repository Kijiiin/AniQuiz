<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>AniList Opening Test</title>

<style>
body {
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:40px;
}

button {
    padding:15px 30px;
    font-size:18px;
    cursor:pointer;
}

iframe {
    width:900px;
    height:500px;
    margin-top:30px;
    border:0;
}
</style>

</head>

<body>

<h1>🎵 AniList Opening Test</h1>

<button onclick="openOpening(21)">
Apri Opening
</button>

<br>

<iframe id="player" allowfullscreen></iframe>


<script>

const YOUTUBE_API_KEY = "AIzaSyCeM7KVc9lZsdd8HM5b-PAfhx0usN8Aubo";


async function openOpening(anilistId){

    console.log("Avvio ricerca opening...");


    const query = `
    query($id:Int){
        Media(id:$id,type:ANIME){
            title{
                romaji
                english
                native
            }
        }
    }`;


    try {

        // PRENDO IL TITOLO DA ANILIST
        const aniRes = await fetch(
            "https://graphql.anilist.co",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "Accept":"application/json"
                },
                body:JSON.stringify({
                    query:query,
                    variables:{
                        id:anilistId
                    }
                })
            }
        );


        const aniData = await aniRes.json();

        console.log("AniList:", aniData);


        if(!aniData.data || !aniData.data.Media){
            alert("Anime non trovato");
            return;
        }


        const title =
            aniData.data.Media.title.english ||
            aniData.data.Media.title.romaji ||
            aniData.data.Media.title.native;


        console.log("Titolo trovato:", title);



        // CERCA OPENING SU YOUTUBE
        const searchQuery = `${title} opening 1`;

        console.log("Ricerca YouTube:", searchQuery);



        const ytUrl =
        "https://www.googleapis.com/youtube/v3/search?" +
        "part=snippet" +
        "&type=video" +
        "&videoEmbeddable=true" +
        "&maxResults=1" +
        "&q=" + encodeURIComponent(searchQuery) +
        "&key=" + YOUTUBE_API_KEY;



        const ytRes = await fetch(ytUrl);


        const ytData = await ytRes.json();


        console.log("YouTube status:", ytRes.status);
        console.log("YouTube risposta:", ytData);



        // MOSTRA ERRORE PRECISO
        if(ytData.error){

            alert(
                "Errore YouTube:\n\n" +
                ytData.error.message
            );

            return;
        }



        if(!ytData.items || ytData.items.length === 0){

            alert("Opening non trovata");
            return;

        }



        const videoId =
            ytData.items[0].id.videoId;


        console.log("Video trovato:", videoId);



        document.getElementById("player").src =
        `https://www.youtube.com/embed/${videoId}?autoplay=1`;


    }
    catch(error){

        console.error("Errore:", error);
        alert("Errore nello script");

    }

}

</script>


</body>
</html>
