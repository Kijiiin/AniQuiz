<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Anime Duel - Sfida tra Otaku</title>
  <style>
    /* ----- RESET & FONTS ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: linear-gradient(145deg, #0b0c1a 0%, #1a1e2f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #f0e6d0;
    }
    .game-container {
      max-width: 900px;
      width: 100%;
      background: rgba(26, 30, 47, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 48px;
      padding: 30px 30px 40px;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.7), 0 0 0 2px #ffb34733 inset;
      border: 1px solid #ffb34755;
      transition: all 0.3s;
    }

    /* ----- TITOLI & TESTI ----- */
    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      text-align: center;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px #f7971e55;
      margin-bottom: 10px;
    }
    .subtitle {
      text-align: center;
      color: #b9b3d6;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 25px;
      font-size: 1rem;
      border-bottom: 1px dashed #ffb34744;
      padding-bottom: 15px;
    }

    /* ----- SCHERMATE (hide/show) ----- */
    .screen {
      display: none;
      animation: fadeUp 0.4s ease;
    }
    .screen.active {
      display: block;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ----- HOME (setup) ----- */
    .setup-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin: 25px 0;
    }
    .player-input {
      background: #23273b;
      border-radius: 20px;
      padding: 15px 20px;
      flex: 1 1 180px;
      box-shadow: 0 4px 0 #0b0c1a;
      border: 1px solid #3d425b;
    }
    .player-input label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #b9b3d6;
      margin-bottom: 6px;
    }
    .player-input input {
      width: 100%;
      background: #10121f;
      border: none;
      border-bottom: 2px solid #ffb347;
      color: #f0e6d0;
      font-size: 1.1rem;
      padding: 6px 0;
      outline: none;
      font-weight: 600;
      transition: 0.2s;
    }
    .player-input input:focus {
      border-bottom-color: #ffd200;
      transform: scale(1.02);
    }
    .player-input input::placeholder {
      color: #5a5f7a;
      font-weight: 300;
      font-size: 0.9rem;
    }
    .remove-btn {
      background: none;
      border: none;
      color: #ff6b6b;
      font-size: 1.2rem;
      cursor: pointer;
      margin-top: 4px;
      opacity: 0.5;
      transition: 0.2s;
    }
    .remove-btn:hover { opacity: 1; transform: scale(1.2); }

    .setup-options {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      justify-content: center;
      align-items: center;
      margin: 25px 0 30px;
      background: #1e2338;
      border-radius: 30px;
      padding: 20px 30px;
    }
    .setup-options label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      color: #cbc3e6;
    }
    .setup-options input[type="number"] {
      width: 60px;
      background: #10121f;
      border: 1px solid #3d425b;
      border-radius: 12px;
      padding: 6px 8px;
      color: #f0e6d0;
      font-size: 1.1rem;
      text-align: center;
    }
    .setup-options input[type="number"]:focus {
      border-color: #ffb347;
      outline: none;
    }

    .btn {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      border: none;
      color: #1a1e2f;
      font-weight: 700;
      font-size: 1.2rem;
      padding: 14px 40px;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 8px 0 #b36200;
      text-transform: uppercase;
      letter-spacing: 2px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 0 #b36200;
    }
    .btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #b36200;
    }
    .btn-secondary {
      background: #3d425b;
      box-shadow: 0 8px 0 #1e2338;
      color: #f0e6d0;
    }
    .btn-secondary:hover {
      background: #4f5575;
      box-shadow: 0 10px 0 #1e2338;
    }
    .btn-center {
      display: flex;
      justify-content: center;
    }
    .btn:disabled {
      opacity: 0.4;
      transform: translateY(4px);
      box-shadow: 0 4px 0 #b36200;
      pointer-events: none;
    }

    /* ----- GAME SCREEN ----- */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .round-info {
      background: #1e2338;
      padding: 8px 22px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1.1rem;
      border: 1px solid #ffb34755;
    }
    .round-info span {
      color: #ffd200;
    }

    .player-turn-badge {
      background: #ffb347;
      color: #1a1e2f;
      padding: 8px 24px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1.1rem;
      box-shadow: 0 0 20px #ffb34755;
    }

    .scores {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 25px;
    }
    .score-chip {
      background: #1e2338;
      padding: 6px 18px 6px 14px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      border: 1px solid #3d425b;
      transition: 0.2s;
    }
    .score-chip.active-turn {
      border-color: #ffd200;
      box-shadow: 0 0 20px #ffd20033;
      transform: scale(1.05);
    }
    .score-chip .name {
      color: #b9b3d6;
    }
    .score-chip .pts {
      background: #ffb347;
      color: #1a1e2f;
      padding: 0 12px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 1rem;
    }
    .score-chip .combo {
      font-size: 0.7rem;
      background: #ff6b6b;
      padding: 0 8px;
      border-radius: 12px;
      color: #fff;
      font-weight: 700;
    }

    /* DOMANDA */
    .question-box {
      background: #23273b;
      border-radius: 30px;
      padding: 30px 30px 20px;
      margin: 15px 0 20px;
      border-left: 6px solid #ffb347;
      box-shadow: 0 8px 0 #10121f;
    }
    .question-category {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ffb347;
      font-weight: 600;
    }
    .question-text {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 12px 0 18px;
      line-height: 1.3;
    }
    .question-difficulty {
      display: inline-block;
      background: #3d425b;
      border-radius: 20px;
      padding: 2px 14px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #b9b3d6;
    }

    /* TIMER */
    .timer-bar {
      width: 100%;
      height: 8px;
      background: #10121f;
      border-radius: 10px;
      overflow: hidden;
      margin: 10px 0 20px;
    }
    .timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff6b6b, #ffb347);
      border-radius: 10px;
      transition: width 0.1s linear;
    }

    /* OPZIONI */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin: 18px 0 15px;
    }
    .option-btn {
      background: #1e2338;
      border: 2px solid #3d425b;
      border-radius: 20px;
      padding: 18px 12px;
      color: #f0e6d0;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 0 #0b0c1a;
    }
    .option-btn .letter {
      background: #3d425b;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #b9b3d6;
      flex-shrink: 0;
    }
    .option-btn:hover:not(:disabled) {
      border-color: #ffb347;
      transform: scale(1.02);
    }
    .option-btn:active:not(:disabled) {
      transform: scale(0.97);
    }
    .option-btn.correct {
      border-color: #2ecc71;
      background: #2ecc7133;
      box-shadow: 0 0 20px #2ecc7166;
    }
    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c33;
      box-shadow: 0 0 20px #e74c3c66;
    }
    .option-btn:disabled {
      opacity: 0.7;
      cursor: default;
      transform: none !important;
    }
    .option-btn.reveal-correct {
      border-color: #2ecc71;
      background: #2ecc7122;
    }

    /* POWER-UP */
    .powerup-area {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 20px 0 10px;
      flex-wrap: wrap;
    }
    .powerup-badge {
      background: #1e2338;
      border: 1px solid #ffd200;
      border-radius: 40px;
      padding: 6px 18px 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #ffd200;
      box-shadow: 0 0 12px #ffd20022;
    }
    .powerup-badge button {
      background: #ffd200;
      border: none;
      border-radius: 30px;
      padding: 4px 16px;
      font-weight: 700;
      color: #1a1e2f;
      cursor: pointer;
      transition: 0.15s;
    }
    .powerup-badge button:hover {
      transform: scale(1.05);
      background: #ffe066;
    }
    .powerup-badge button:disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    /* ----- FINE PARTITA ----- */
    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }
    .result-card {
      background: #1e2338;
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      border: 1px solid #3d425b;
      transition: 0.2s;
    }
    .result-card.winner {
      border-color: #ffd200;
      box-shadow: 0 0 30px #ffd20044;
      transform: scale(1.03);
    }
    .result-card .r-name {
      font-size: 1.3rem;
      font-weight: 700;
    }
    .result-card .r-pts {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffd200;
    }
    .result-card .r-stats {
      font-size: 0.8rem;
      color: #b9b3d6;
      margin-top: 6px;
    }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 600px) {
      .game-container { padding: 20px; }
      h1 { font-size: 2rem; }
      .options-grid { grid-template-columns: 1fr; }
      .question-text { font-size: 1.2rem; }
      .setup-options { flex-direction: column; align-items: stretch; }
      .player-input { flex: 1 1 100%; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="game-container" id="app">
    <!-- TITOLO -->
    <h1>⚡ ANIME DUEL</h1>
    <div class="subtitle">🏆 Sfida i tuoi amici con domande otaku!</div>

    <!-- SCHERMATA SETUP -->
    <div id="setupScreen" class="screen active">
      <div class="setup-grid" id="playerInputs">
        <!-- generato da JS -->
      </div>
      <div style="text-align:center; margin: 6px 0 10px;">
        <button class="btn btn-secondary" style="padding:8px 24px; font-size:0.9rem;" id="addPlayerBtn">➕ Aggiungi Giocatore</button>
      </div>

      <div class="setup-options">
        <label>🎯 Round <input type="number" id="roundCount" value="8" min="4" max="20"></label>
        <label>⏱️ Timer <input type="number" id="timerSeconds" value="12" min="6" max="20"></label>
      </div>

      <div class="btn-center">
        <button class="btn" id="startGameBtn">🚀 Inizia Duel</button>
      </div>
    </div>

    <!-- SCHERMATA GIOCO -->
    <div id="gameScreen" class="screen">
      <div class="game-header">
        <div class="round-info">Round <span id="currentRound">1</span>/<span id="totalRounds">8</span></div>
        <div class="player-turn-badge" id="turnBadge">🎯 Turno di: Nome</div>
      </div>

      <div class="scores" id="scoreBoard"></div>

      <div class="question-box">
        <div class="question-category" id="qCategory">Categoria</div>
        <div class="question-text" id="qText">Domanda?</div>
        <div class="question-difficulty" id="qDifficulty">⭐ Difficoltà</div>
        <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
      </div>

      <div class="options-grid" id="optionsContainer"></div>

      <div class="powerup-area" id="powerupArea">
        <!-- power-up mostrati qui -->
      </div>

      <div style="display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap;">
        <button class="btn btn-secondary" id="nextTurnBtn" style="padding:10px 32px; font-size:1rem;" disabled>⏩ Prossimo Turno</button>
      </div>
    </div>

    <!-- SCHERMATA RISULTATI -->
    <div id="resultScreen" class="screen">
      <h2 style="text-align:center; margin-bottom:10px;">🏁 Classifica Finale</h2>
      <div class="result-grid" id="resultGrid"></div>
      <div class="btn-center" style="margin-top:20px;">
        <button class="btn" id="restartBtn">🔄 Nuova Partita</button>
      </div>
    </div>
  </div>

      const powerupArea = $('powerupArea');
      const nextTurnBtn = $('nextTurnBtn');
      const resultGrid = $('resultGrid');
      const restartBtn = $('restartBtn');

      // ============================================================
      //  FUNZIONI DI UTILITY
      // ============================================================
      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function randomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      // ============================================================
      //  SETUP PLAYERS
      // ============================================================
      function renderPlayerInputs() {
        playerInputs.innerHTML = '';
        state.players.forEach((p, idx) => {
          const div = document.createElement('div');
          div.className = 'player-input';
          div.innerHTML = `
            <label>Giocatore ${idx+1}</label>
            <input type="text" value="${p.name}" data-idx="${idx}" placeholder="Nome...">
            <button class="remove-btn" data-idx="${idx}" ${state.players.length <= 2 ? 'disabled' : ''}>✕</button>
          `;
          playerInputs.appendChild(div);
        });
        // Eventi
        playerInputs.querySelectorAll('input').forEach(inp => {
          inp.addEventListener('input', (e) => {
            const idx = parseInt(e.target.dataset.idx);
            state.players[idx].name = e.target.value.trim() || `Giocatore ${idx+1}`;
          });
        });
        playerInputs.querySelectorAll('.remove-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idx = parseInt(e.target.dataset.idx);
            if (state.players.length > 2) {
              state.players.splice(idx, 1);
              renderPlayerInputs();
            }
          });
        });
      }

      function initSetup() {
        // default: 3 giocatori
        state.players = [
          { name: 'Naruto', points: 0, combo: 0, correct: 0, wrong: 0, powerups: [] },
          { name: 'Luffy', points: 0, combo: 0, correct: 0, wrong: 0, powerups: [] },
          { name: 'Goku', points: 0, combo: 0, correct: 0, wrong: 0, powerups: [] }
        ];
        renderPlayerInputs();
      }

      addPlayerBtn.addEventListener('click', () => {
        if (state.players.length < 6) {
          state.players.push({ name: `Giocatore ${state.players.length+1}`, points: 0, combo: 0, correct: 0, wrong: 0, powerups: [] });
          renderPlayerInputs();
        } else {
          alert('Massimo 6 giocatori!');
        }
      });

      // ============================================================
      //  AVVIO PARTITA
      // ============================================================
      startGameBtn.addEventListener('click', () => {
        // Leggi nomi
        const inputs = playerInputs.querySelectorAll('input');
        inputs.forEach((inp, i) => {
          if (i < state.players.length) {
            state.players[i].name = inp.value.trim() || `Giocatore ${i+1}`;
          }
        });
        // Numero round
        let rounds = parseInt(roundCount.value) || 8;
        if (rounds < 2) rounds = 2;
        if (rounds > 30) rounds = 30;
        state.totalRounds = rounds;
        state.timerSeconds = parseInt(timerSeconds.value) || 12;
        if (state.timerSeconds < 4) state.timerSeconds = 4;
        if (state.timerSeconds > 25) state.timerSeconds = 25;

        // Reset punteggi
        state.players.forEach(p => { p.points = 0; p.combo = 0; p.correct = 0; p.wrong = 0; p.powerups = []; });
        state.round = 0;
        state.currentPlayerIndex = 0;
        state.gameOver = false;
        state.answered = false;
        state.waitingForNext = false;
        state.powerupActive = null;

        // Prepara domande: mischia e prendi tante quante round * giocatori (ma se non bastano, riutilizza)
        let totalNeeded = state.totalRounds * state.players.length;
        let available = QUESTION_BANK.map((_, i) => i);
        shuffle(available);
        // Se non bastano, duplica fino a coprire
        while (available.length < totalNeeded) {
          available = available.concat(QUESTION_BANK.map((_, i) => i));
          shuffle(available);
        }
        state.availableQuestions = available.slice(0, totalNeeded);
        // Mescola per ogni round
        state.questionsForRound = [];
        for (let r = 0; r < state.totalRounds; r++) {
          let roundQs = [];
          for (let p = 0; p < state.players.length; p++) {
            roundQs.push(state.availableQuestions.pop());
          }
          state.questionsForRound.push(roundQs);
        }

        // Mostra game
        setupScreen.classList.remove('active');
        gameScreen.classList.add('active');
        resultScreen.classList.remove('active');

        // Avvia primo turno
        nextTurn();
      });

      // ============================================================
      //  GESTIONE TURNO
      // ============================================================
      function nextTurn() {
        if (state.gameOver) return;
        // Controlla se finiti i round
        if (state.round >= state.totalRounds) {
          endGame();
          return;
        }

        // Prendi il giocatore corrente
        const playerIdx = state.currentPlayerIndex;
        const player = state.players[playerIdx];
        // Prendi la domanda per questo giocatore in questo round
        const qIdx = state.questionsForRound[state.round][playerIdx];
        const question = QUESTION_BANK[qIdx];
        state.currentQuestion = question;
        state.answered = false;
        state.waitingForNext = false;
        state.powerupActive = null;

        // Aggiorna UI
        updateScoreBoard();
        updateTurnBadge(player);
        currentRound.textContent = state.round + 1;
        totalRounds.textContent = state.totalRounds;

        // Mostra domanda
        qCategory.textContent = `📂 ${question.category}`;
        qText.textContent = question.question;
        const stars = '⭐'.repeat(question.difficulty);
        qDifficulty.textContent = `${stars} Difficoltà ${question.difficulty}`;

        // Opzioni
        optionsContainer.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D'];
        question.options.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.dataset.idx = i;
          btn.innerHTML = `<span class="letter">${letters[i]}</span> ${opt}`;
          btn.addEventListener('click', () => handleAnswer(i));
          optionsContainer.appendChild(btn);
        });

        // Power-up: se il giocatore ne ha, mostrali
        renderPowerups(player);

        // Timer
        startTimer();

        // Abilita opzioni
        optionsContainer.querySelectorAll('.option-btn').forEach(b => b.disabled = false);
        nextTurnBtn.disabled = true;
      }

      function updateTurnBadge(player) {
        turnBadge.textContent = `🎯 Turno di: ${player.name}`;
      }

      function updateScoreBoard() {
        scoreBoard.innerHTML = '';
        state.players.forEach((p, idx) => {
          const chip = document.createElement('div');
          chip.className = 'score-chip' + (idx === state.currentPlayerIndex && !state.gameOver ? ' active-turn' : '');
          const comboText = p.combo > 1 ? `<span class="combo">🔥x${p.combo}</span>` : '';
          chip.innerHTML = `
            <span class="name">${p.name}</span>
            <span class="pts">${p.points}</span>
            ${comboText}
          `;
          scoreBoard.appendChild(chip);
        });
      }

      // ============================================================
      //  TIMER
      // ============================================================
      function startTimer() {
        clearInterval(state.timerInterval);
        state.timeLeft = state.timerSeconds;
        timerFill.style.width = '100%';
        state.timerInterval = setInterval(() => {
          state.timeLeft -= 0.1;
          const pct = Math.max(0, (state.timeLeft / state.timerSeconds) * 100);
          timerFill.style.width = pct + '%';
          if (state.timeLeft <= 0) {
            clearInterval(state.timerInterval);
            if (!state.answered) {
              // Tempo scaduto: risposta sbagliata automatica
              handleTimeout();
            }
          }
        }, 100);
      }

      function stopTimer() {
        clearInterval(state.timerInterval);
      }

      function handleTimeout() {
        if (state.answered) return;
        state.answered = true;
        const player = state.players[state.currentPlayerIndex];
        // Conta come errore
        player.wrong += 1;
        player.combo = 0;
        // Rivela risposta corretta
        const correctIdx = state.currentQuestion.answer;
        const btns = optionsContainer.querySelectorAll('.option-btn');
        btns.forEach((b, i) => {
          b.disabled = true;
          if (i === correctIdx) b.classList.add('reveal-correct');
        });
        // Nessun punto
        updateScoreBoard();
        showFeedback('⏰ Tempo scaduto!', 'wrong');
        enableNextTurn();
      }

      // ============================================================
      //  GESTIONE RISPOSTA
      // ============================================================
      function handleAnswer(selectedIdx) {
        if (state.answered) return;
        state.answered = true;
        stopTimer();

        const player = state.players[state.currentPlayerIndex];
        const question = state.currentQuestion;
        const correct = selectedIdx === question.answer;

        // Disabilita opzioni
        const btns = optionsContainer.querySelectorAll('.option-btn');
        btns.forEach((b, i) => {
          b.disabled = true;
          if (i === question.answer) b.classList.add('correct');
          if (i === selectedIdx && !correct) b.classList.add('wrong');
          if (i === selectedIdx && correct) b.classList.add('correct');
        });

        // Applica power-up attivo
        let multiplier = 1;
        if (state.powerupActive === '2x') {
          multiplier = 2;
          state.powerupActive = null;
          // rimuovi il powerup dalla lista del giocatore
          const idx2x = player.powerups.indexOf('2x');
          if (idx2x > -1) player.powerups.splice(idx2x, 1);
        }

        if (correct) {
          let points = 10 + (question.difficulty * 5);
          points = Math.floor(points * multiplier);
          player.points += points;
          player.correct += 1;
          player.combo += 1;
          // Bonus combo (se >=3)
          if (player.combo >= 3) {
            const bonus = player.combo * 2;
            player.points += bonus;
            showFeedback(`🔥 Combo x${player.combo}! +${bonus} bonus!`, 'good');
          } else {
            showFeedback(`✅ Corretto! +${points} punti`, 'good');
          }
          // Assegna power-up casuale ogni 3 risposte corrette consecutive?
          // Semplice: dopo ogni corretta, 30% di chance di ottenere un power-up
          if (Math.random() < 0.30 && player.powerups.length < 3) {
            const pu = randomItem(['2x', 'skip']);
            player.powerups.push(pu);
            showFeedback(`🎁 Ottieni Power-up: ${pu === '2x' ? 'x2 Punti' : 'Salta Domanda'}`, 'info');
          }
        } else {
          player.wrong += 1;
          player.combo = 0;
          showFeedback(`❌ Sbagliato!`, 'wrong');
        }

        updateScoreBoard();
        // Rimuovi eventuale powerup skip se attivo (ma non usato)
        if (state.powerupActive === 'skip') {
          const idxSkip = player.powerups.indexOf('skip');
          if (idxSkip > -1) player.powerups.splice(idxSkip, 1);
          state.powerupActive = null;
        }

        enableNextTurn();
      }

      function showFeedback(msg, type) {
        // Mostra un feedback temporaneo nella domanda
        const old = document.querySelector('.feedback-msg');
        if (old) old.remove();
        const div = document.createElement('div');
        div.className = 'feedback-msg';
        div.style.cssText = `
          font-weight: 700; font-size:1.2rem; padding:12px; border-radius:20px;
          margin-top:8px; text-align:center;
          background: ${type === 'good' ? '#2ecc7133' : type === 'wrong' ? '#e74c3c33' : '#3498db33'};
          border: 1px solid ${type === 'good' ? '#2ecc71' : type === 'wrong' ? '#e74c3c' : '#3498db'};
        `;
        div.textContent = msg;
        const box = document.querySelector('.question-box');
        box.appendChild(div);
        setTimeout(() => div.remove(), 2500);
      }

      function enableNextTurn() {
        state.waitingForNext = true;
        nextTurnBtn.disabled = false;
        // Rimuovi powerup area
        renderPowerups(null);
      }

      // ============================================================
      //  POWER-UP
      // ============================================================
      function renderPowerups(player) {
        powerupArea.innerHTML = '';
        if (!player || state.answered || state.gameOver) {
          powerupArea.innerHTML = '<div style="color:#5a5f7a; font-size:0.9rem;">⚡ Nessun power-up disponibile</div>';
          return;
        }
        if (player.powerups.length === 0) {
          powerupArea.innerHTML = '<div style="color:#5a5f7a; font-size:0.9rem;">⚡ Nessun power-up disponibile</div>';
          return;
        }
        player.powerups.forEach(pu => {
          const badge = document.createElement('div');
          badge.className = 'powerup-badge';
          const label = pu === '2x' ? 'x2 Punti' : 'Salta Domanda';
          badge.innerHTML = `
            <span>⚡ ${label}</span>
            <button data-pu="${pu}">Usa</button>
          `;
          badge.querySelector('button').addEventListener('click', (e) => {
            e.stopPropagation();
            if (state.answered || state.waitingForNext) return;
            if (pu === '2x') {
              state.powerupActive = '2x';
              showFeedback('💥 Power-up x2 attivato!', 'info');
            } else if (pu === 'skip') {
              // Salta: risposta automatica corretta (ma senza punti)
              state.powerupActive = 'skip';
              // Rimuovi il powerup
              const idx = player.powerups.indexOf('skip');
              if (idx > -1) player.powerups.splice(idx, 1);
              // Segna come risposto e dai 0 punti, ma conta come corretta per combo?
              state.answered = true;
              stopTimer();
              // Mostra risposta corretta
              const btns = optionsContainer.querySelectorAll('.option-btn');
              btns.forEach((b, i) => {
                b.disabled = true;
                if (i === state.currentQuestion.answer) b.classList.add('correct');
              });
              // Non dà punti, ma mantiene combo?
              player.combo += 1; // mantiene combo
              showFeedback('⏭️ Salta! Risposta corretta (0 punti)', 'info');
              updateScoreBoard();
              enableNextTurn();
              renderPowerups(player);
            }
            renderPowerups(player);
          });
          powerupArea.appendChild(badge);
        });
      }

      // ============================================================
      //  PROSSIMO TURNO / ROUND
      // ============================================================
      nextTurnBtn.addEventListener('click', () => {
        if (!state.waitingForNext) return;
        // Passa al prossimo giocatore
        state.currentPlayerIndex++;
        if (state.currentPlayerIndex >= state.players.length) {
          // Fine round
          state.currentPlayerIndex = 0;
          state.round++;
          if (state.round >= state.totalRounds) {
            endGame();
            return;
          }
        }
        // Avvia prossimo turno
        nextTurn();
      });

      // ============================================================
      //  FINE PARTITA
      // ============================================================
      function endGame() {
        state.gameOver = true;
        stopTimer();
        gameScreen.classList.remove('active');
        resultScreen.classList.add('active');

        // Ordina per punti
        const sorted = [...state.players].sort((a, b) => b.points - a.points);
        resultGrid.innerHTML = '';
        sorted.forEach((p, idx) => {
          const card = document.createElement('div');
          card.className = 'result-card' + (idx === 0 ? ' winner' : '');
          card.innerHTML = `
            <div class="r-name">${idx === 0 ? '🏆 ' : ''}${p.name}</div>
            <div class="r-pts">${p.points} pts</div>
            <div class="r-stats">✅ ${p.correct} corrette • ❌ ${p.wrong} sbagliate</div>
            ${p.combo > 2 ? `<div class="r-stats">🔥 Max combo: ${p.combo}</div>` : ''}
          `;
          resultGrid.appendChild(card);
        });
      }

      // ============================================================
      //  RIAVVIO
      // ============================================================
      restartBtn.addEventListener('click', () => {
        resultScreen.classList.remove('active');
        setupScreen.classList.add('active');
        initSetup();
        // Reset stato
        state.gameOver = false;
        state.round = 0;
        state.currentPlayerIndex = 0;
        state.answered = false;
        state.waitingForNext = false;
        state.powerupActive = null;
        stopTimer();
      });

      // ============================================================
      //  INIT
      // ============================================================
      initSetup();

      // Imposta valori default
      roundCount.value = 8;
      timerSeconds.value = 12;

    })();
  </script>
</body>
</html>
