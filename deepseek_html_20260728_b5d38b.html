<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniQuiz - Multiplayer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .h1-span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        input, select {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            width: 100%;
            margin-bottom: 10px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            margin: 5px 0;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .room-code {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 15px 0;
            font-size: 2em;
            font-weight: bold;
            letter-spacing: 5px;
            font-family: monospace;
            border: 2px dashed #667eea;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .players-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .player-badge {
            background: #f8f9fa;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .player-badge.active {
            background: #667eea;
            color: white;
        }

        .player-badge .score {
            background: rgba(0,0,0,0.1);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
        }

        .character-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            margin: 15px 0;
        }

        .character-card .emoji {
            font-size: 4em;
            display: block;
            margin-bottom: 10px;
        }

        .character-card .name {
            font-size: 1.8em;
            font-weight: bold;
            color: #2c3e50;
        }

        .character-card .details {
            color: #666;
            margin-top: 10px;
            font-size: 1.1em;
        }

        .chat-box {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            height: 200px;
            overflow-y: auto;
            padding: 15px;
            margin: 15px 0;
            background: #fafafa;
        }

        .chat-message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            animation: fadeIn 0.3s;
        }

        .chat-message .sender {
            font-weight: 600;
            color: #667eea;
        }

        .chat-message .time {
            font-size: 11px;
            color: #999;
            margin-left: 10px;
        }

        .chat-message.system {
            background: #f0f0f0;
            text-align: center;
            font-style: italic;
        }

        .chat-message.question {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
        }

        .chat-message.answer {
            background: #f3e5f5;
            border-left: 4px solid #9c27b0;
        }

        .chat-message.guess {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
        }

        .chat-message.success {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .controls .input-group {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 10px;
        }

        .controls .guess-group {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 10px;
        }

        .status-message {
            text-align: center;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            font-weight: 600;
            animation: fadeIn 0.3s;
        }

        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status-message.warning {
            background: #fff3cd;
            color: #856404;
        }

        .hidden {
            display: none !important;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .connection-status.connected {
            background: #d4edda;
            color: #155724;
        }

        .connection-status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .connection-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .connection-status.connected .dot {
            background: #28a745;
        }

        .connection-status.disconnected .dot {
            background: #dc3545;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            .grid-2 {
                grid-template-columns: 1fr;
            }
            
            .controls .input-group,
            .controls .guess-group {
                grid-template-columns: 1fr;
            }
            
            .game-header {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 <span class="h1-span">AniQuiz</span> Multiplayer</h1>
        
        <!-- Schermata: Lobby -->
        <div id="lobbyScreen" class="screen active">
            <div style="margin: 20px 0;">
                <label style="font-weight: 600; display: block; margin-bottom: 5px;">Il tuo nome:</label>
                <input type="text" id="playerName" placeholder="Inserisci il tuo nome" maxlength="20" value="Giocatore1">
            </div>
            
            <div class="grid-2">
                <button class="btn btn-primary" onclick="createGame()">🎯 Crea Partita</button>
                <button class="btn btn-secondary" onclick="showJoin()">🔗 Unisciti</button>
            </div>
            
            <div id="joinSection" class="hidden" style="margin-top: 15px;">
                <input type="text" id="peerIdInput" placeholder="Incolla l'ID del tuo amico">
                <button class="btn btn-success" onclick="joinGame()">📞 Connetti</button>
            </div>

            <div id="waitingSection" class="hidden" style="margin-top: 20px; text-align: center;">
                <p style="color: #666; margin-bottom: 10px;">📋 Condividi questo ID con il tuo amico:</p>
                <div class="room-code" id="myPeerId">Caricamento...</div>
                <button class="btn btn-secondary" onclick="copyPeerId()">📋 Copia ID</button>
                <div style="margin-top: 10px;">
                    <div class="status-message info">⏳ In attesa che un amico si connetta...</div>
                </div>
            </div>
        </div>

        <!-- Schermata: Gioco -->
        <div id="gameScreen" class="screen">
            <div class="game-header">
                <div class="players-list" id="playersList"></div>
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <span id="turnIndicator" class="player-badge" style="background: #667eea; color: white;">🎯 Turno: -</span>
                    <div id="connectionStatus" class="connection-status connected">
                        <span class="dot"></span> Connesso
                    </div>
                </div>
            </div>

            <div id="statusMessage" class="status-message hidden"></div>

            <div id="characterCard" class="character-card hidden">
                <span class="emoji">🎭</span>
                <div class="name" id="charName"></div>
                <div class="details" id="charDetails"></div>
            </div>

            <div class="chat-box" id="chatBox">
                <div class="chat-message system">🎮 Benvenuti in AniQuiz Multiplayer!</div>
                <div class="chat-message system">💡 Il giocatore di turno deve fare domande e indovinare</div>
            </div>

            <div class="controls" id="gameControls">
                <div class="input-group">
                    <input type="text" id="questionInput" placeholder="❓ Fai una domanda... (es. Ha i capelli neri?)">
                    <button class="btn btn-primary" onclick="askQuestion()">Chiedi</button>
                </div>
                <div class="guess-group">
                    <input type="text" id="guessInput" placeholder="🔍 Chi pensi che sia?">
                    <button class="btn btn-secondary" onclick="makeGuess()">Indovina!</button>
                </div>
            </div>

            <button class="btn btn-danger" onclick="disconnectGame()" style="margin-top: 10px; width: auto; padding: 10px 20px; font-size: 14px;">
                🚪 Esci
            </button>
        </div>
    </div>

    <!-- PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    
    <script>
        // ============================================
        // STATO DEL GIOCO
        // ============================================
        const GameState = {
            // Giocatori
            players: [],
            currentPlayerId: null,
            myId: null,
            
            // Personaggi
            characters: [
                { id: 1, name: 'Goku', anime: 'Dragon Ball', emoji: '🐉', trait: 'Saiyan' },
                { id: 2, name: 'Naruto', anime: 'Naruto', emoji: '🍥', trait: 'Rasengan' },
                { id: 3, name: 'Luffy', anime: 'One Piece', emoji: '🏴‍☠️', trait: 'Gom Gom' },
                { id: 4, name: 'Saitama', anime: 'One Punch Man', emoji: '👊', trait: 'One Punch' },
                { id: 5, name: 'Eren', anime: 'Attack on Titan', emoji: '⚔️', trait: 'Titan' },
                { id: 6, name: 'Ichigo', anime: 'Bleach', emoji: '⚡', trait: 'Bankai' },
                { id: 7, name: 'Tanjiro', anime: 'Demon Slayer', emoji: '🔥', trait: 'Water Breathing' },
                { id: 8, name: 'Deku', anime: 'My Hero Academia', emoji: '💚', trait: 'One For All' },
                { id: 9, name: 'Gojo', anime: 'Jujutsu Kaisen', emoji: '👁️', trait: 'Infinity' },
                { id: 10, name: 'Mikasa', anime: 'Attack on Titan', emoji: '⚔️', trait: 'Ackerman' },
                { id: 11, name: 'Natsu', anime: 'Fairy Tail', emoji: '🔥', trait: 'Dragon Slayer' },
                { id: 12, name: 'Gon', anime: 'Hunter x Hunter', emoji: '🎣', trait: 'Nen' },
                { id: 13, name: 'Light', anime: 'Death Note', emoji: '📓', trait: 'Kira' },
                { id: 14, name: 'Edward', anime: 'Fullmetal Alchemist', emoji: '⚙️', trait: 'Alchemy' },
                { id: 15, name: 'Meliodas', anime: 'Seven Deadly Sins', emoji: '⚔️', trait: 'Dragon Sin' }
            ],
            
            selectedCharacter: null,
            isMyTurn: false,
            gameStarted: false,
            
            // PeerJS
            peer: null,
            connection: null,
            isHost: false,
            peerId: null
        };

        // ============================================
        // FUNZIONI UI
        // ============================================
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showStatus(message, type = 'info') {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = `status-message ${type}`;
            el.classList.remove('hidden');
        }

        function hideStatus() {
            document.getElementById('statusMessage').classList.add('hidden');
        }

        function addChatMessage(type, sender, message) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `chat-message ${type}`;
            
            const time = new Date().toLocaleTimeString();
            
            if (type === 'system') {
                div.innerHTML = `<span class="sender">📢</span> ${message}`;
            } else if (type === 'me') {
                div.innerHTML = `<span class="sender">👤 Tu</span> <span class="time">${time}</span><br>${message}`;
            } else {
                div.innerHTML = `<span class="sender">👤 ${sender}</span> <span class="time">${time}</span><br>${message}`;
            }
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function updatePlayersList() {
            const container = document.getElementById('playersList');
            container.innerHTML = GameState.players.map(p => `
                <div class="player-badge ${p.id === GameState.myId ? 'active' : ''}">
                    ${p.name}
                    <span class="score">⭐ ${p.score || 0}</span>
                    ${p.id === GameState.myId ? ' (Tu)' : ''}
                    ${p.id === GameState.currentPlayerId ? ' 🎯' : ''}
                </div>
            `).join('');
            
            // Aggiorna indicatore turno
            const current = GameState.players.find(p => p.id === GameState.currentPlayerId);
            document.getElementById('turnIndicator').textContent = `🎯 Turno: ${current ? current.name : '-'}`;
            
            // Aggiorna stato turno personale
            GameState.isMyTurn = GameState.currentPlayerId === GameState.myId;
            
            // Mostra/nascondi controlli
            const controls = document.getElementById('gameControls');
            if (GameState.isMyTurn && GameState.gameStarted) {
                controls.style.display = 'block';
                if (GameState.selectedCharacter) {
                    document.getElementById('characterCard').classList.remove('hidden');
                }
            } else {
                controls.style.display = 'none';
            }
        }

        function showCharacter(character) {
            const card = document.getElementById('characterCard');
            document.getElementById('charName').textContent = `${character.emoji} ${character.name}`;
            document.getElementById('charDetails').textContent = `📺 ${character.anime} | ⚡ ${character.trait}`;
            card.classList.remove('hidden');
        }

        // ============================================
        // GESTIONE PARTITA
        // ============================================
        function getRandomCharacter() {
            return GameState.characters[Math.floor(Math.random() * GameState.characters.length)];
        }

        function startNewRound() {
            // Scegli un personaggio casuale
            GameState.selectedCharacter = getRandomCharacter();
            
            // Determina il prossimo giocatore (alterna)
            const currentIndex = GameState.players.findIndex(p => p.id === GameState.currentPlayerId);
            const nextIndex = (currentIndex + 1) % GameState.players.length;
            GameState.currentPlayerId = GameState.players[nextIndex].id;
            
            // Aggiorna UI
            updatePlayersList();
            
            // Messaggio
            const currentPlayer = GameState.players.find(p => p.id === GameState.currentPlayerId);
            addChatMessage('system', null, `🔄 Nuovo round! Tocca a ${currentPlayer.name}`);
            
            // Se sono io, mostra il personaggio
            if (GameState.currentPlayerId === GameState.myId) {
                showCharacter(GameState.selectedCharacter);
                showStatus('🎯 È il tuo turno! Fai domande e indovina il personaggio!', 'info');
                // Invia il personaggio all'altro giocatore (che risponderà alle domande)
                sendMessage({
                    type: 'character_assigned',
                    character: GameState.selectedCharacter
                });
            } else {
                document.getElementById('characterCard').classList.add('hidden');
                showStatus(`⏳ Turno di ${currentPlayer.name}`, 'info');
            }
            
            hideStatus();
        }

        function handleGuess(guesserId, guess) {
            const correct = guess.toLowerCase().trim() === GameState.selectedCharacter.name.toLowerCase().trim();
            const player = GameState.players.find(p => p.id === guesserId);
            
            if (correct) {
                // Assegna punto
                if (player) player.score = (player.score || 0) + 1;
                addChatMessage('success', null, `🎉 ${player.name} ha indovinato! Era ${GameState.selectedCharacter.name}!`);
                showStatus(`🎉 ${player.name} ha indovinato!`, 'success');
                
                // Invia risultato all'altro giocatore
                sendMessage({
                    type: 'guess_result',
                    guesserId: guesserId,
                    correct: true,
                    character: GameState.selectedCharacter,
                    players: GameState.players
                });
                
                setTimeout(() => {
                    startNewRound();
                }, 3000);
            } else {
                addChatMessage('guess', player ? player.name : 'Qualcuno', `❌ Ha indovinato: ${guess} (Non corretto)`);
                showStatus(`❌ Non è corretto! Riprova.`, 'error');
                
                sendMessage({
                    type: 'guess_result',
                    guesserId: guesserId,
                    correct: false,
                    guess: guess
                });
                
                setTimeout(() => hideStatus(), 2000);
            }
        }

        // ============================================
        // PEERJS - COMUNICAZIONE
        // ============================================
        function initPeer() {
            return new Promise((resolve) => {
                GameState.peer = new Peer();
                
                GameState.peer.on('open', (id) => {
                    GameState.peerId = id;
                    document.getElementById('myPeerId').textContent = id;
                    resolve(id);
                });
                
                GameState.peer.on('connection', (conn) => {
                    GameState.connection = conn;
                    setupConnection(conn);
                    addChatMessage('system', null, '🔗 Un amico si è connesso!');
                    document.getElementById('waitingSection').classList.add('hidden');
                    startGame();
                });
                
                GameState.peer.on('error', (err) => {
                    console.error('PeerJS error:', err);
                    showStatus('❌ Errore di connessione: ' + err.message, 'error');
                });
            });
        }

        function setupConnection(conn) {
            conn.on('data', (data) => {
                handleMessage(data);
            });
            
            conn.on('close', () => {
                addChatMessage('system', null, '🔌 Connessione persa!');
                showStatus('❌ Connessione persa!', 'error');
                document.getElementById('connectionStatus').className = 'connection-status disconnected';
            });
            
            document.getElementById('connectionStatus').className = 'connection-status connected';
        }

        function sendMessage(data) {
            if (GameState.connection && GameState.connection.open) {
                GameState.connection.send(data);
            }
        }

        function handleMessage(data) {
            console.log('📨 Ricevuto:', data);
            
            switch(data.type) {
                case 'player_joined':
                    GameState.players = data.players;
                    updatePlayersList();
                    addChatMessage('system', null, `👋 ${data.playerName} si è unito!`);
                    break;
                    
                case 'start_game':
                    GameState.gameStarted = true;
                    GameState.players = data.players;
                    GameState.currentPlayerId = data.currentPlayerId;
                    updatePlayersList();
                    addChatMessage('system', null, '🎮 La partita è iniziata!');
                    showScreen('gameScreen');
                    
                    if (GameState.currentPlayerId === GameState.myId) {
                        GameState.selectedCharacter = data.character;
                        showCharacter(GameState.selectedCharacter);
                        showStatus('🎯 È il tuo turno!', 'info');
                    } else {
                        showStatus(`⏳ Turno di ${GameState.players.find(p => p.id === GameState.currentPlayerId).name}`, 'info');
                    }
                    break;
                    
                case 'character_assigned':
                    GameState.selectedCharacter = data.character;
                    if (GameState.currentPlayerId !== GameState.myId) {
                        // L'altro giocatore ha il personaggio, io devo indovinare
                        addChatMessage('system', null, `🎭 Personaggio assegnato a ${GameState.players.find(p => p.id === GameState.currentPlayerId).name}`);
                    }
                    break;
                    
                case 'question':
                    const asker = GameState.players.find(p => p.id === data.playerId);
                    addChatMessage('question', asker ? asker.name : 'Qualcuno', `❓ ${data.question}`);
                    break;
                    
                case 'answer':
                    const answerer = GameState.players.find(p => p.id === data.playerId);
                    addChatMessage('answer', answerer ? answerer.name : 'Qualcuno', `💬 ${data.answer}`);
                    break;
                    
                case 'guess':
                    handleGuess(data.playerId, data.guess);
                    break;
                    
                case 'guess_result':
                    if (data.correct) {
                        GameState.players = data.players;
                        addChatMessage('success', null, `🎉 ${GameState.players.find(p => p.id === data.guesserId).name} ha indovinato! Era ${data.character.name}!`);
                        showStatus(`🎉 È stato indovinato!`, 'success');
                        updatePlayersList();
                        setTimeout(() => {
                            startNewRound();
                        }, 3000);
                    } else {
                        addChatMessage('guess', 'Qualcuno', `❌ Tentativo: ${data.guess} (Non corretto)`);
                        showStatus(`❌ Non è corretto!`, 'error');
                        setTimeout(() => hideStatus(), 2000);
                    }
                    break;
                    
                case 'new_round':
                    GameState.players = data.players;
                    GameState.currentPlayerId = data.currentPlayerId;
                    GameState.selectedCharacter = data.character;
                    updatePlayersList();
                    addChatMessage('system', null, `🔄 Nuovo round! Tocca a ${GameState.players.find(p => p.id === GameState.currentPlayerId).name}`);
                    
                    if (GameState.currentPlayerId === GameState.myId) {
                        showCharacter(GameState.selectedCharacter);
                        showStatus('🎯 È il tuo turno!', 'info');
                    } else {
                        document.getElementById('characterCard').classList.add('hidden');
                        showStatus(`⏳ Turno di ${GameState.players.find(p => p.id === GameState.currentPlayerId).name}`, 'info');
                    }
                    break;
                    
                case 'disconnect':
                    addChatMessage('system', null, `👋 ${data.playerName} ha lasciato la partita`);
                    showStatus('❌ L\'altro giocatore ha lasciato', 'error');
                    break;
            }
        }

        // ============================================
        // AZIONI UTENTE
        // ============================================
        async function createGame() {
            const name = document.getElementById('playerName').value.trim() || 'Giocatore1';
            GameState.myId = 'host_' + Date.now();
            GameState.isHost = true;
            GameState.players = [{ id: GameState.myId, name: name, score: 0 }];
            
            await initPeer();
            
            document.getElementById('waitingSection').classList.remove('hidden');
            document.getElementById('lobbyScreen').querySelector('.grid-2').style.display = 'none';
            document.getElementById('joinSection').classList.add('hidden');
            
            addChatMessage('system', null, `🏠 Stanza creata! ID: ${GameState.peerId}`);
            showStatus('📋 Copia l\'ID e condividilo con il tuo amico', 'info');
        }

        function showJoin() {
            document.getElementById('joinSection').classList.toggle('hidden');
        }

        async function joinGame() {
            const name = document.getElementById('playerName').value.trim() || 'Giocatore2';
            const remoteId = document.getElementById('peerIdInput').value.trim();
            
            if (!remoteId) {
                showStatus('❌ Inserisci l\'ID del tuo amico!', 'error');
                return;
            }
            
            GameState.myId = 'client_' + Date.now();
            GameState.isHost = false;
            GameState.players = [{ id: GameState.myId, name: name, score: 0 }];
            
            await initPeer();
            
            // Connetti all'host
            const conn = GameState.peer.connect(remoteId);
            GameState.connection = conn;
            setupConnection(conn);
            
            // Invia i dati del giocatore
            conn.on('open', () => {
                sendMessage({
                    type: 'player_joined',
                    playerName: name,
                    players: GameState.players
                });
                addChatMessage('system', null, '✅ Connesso alla partita!');
                showStatus('✅ Connesso! In attesa che inizi...', 'success');
            });
        }

        function startGame() {
            if (!GameState.isHost) return;
            
            // Scegli il primo giocatore
            GameState.currentPlayerId = GameState.players[0].id;
            GameState.gameStarted = true;
            GameState.selectedCharacter = getRandomCharacter();
            
            // Se l'host è il primo, mostra il personaggio
            if (GameState.currentPlayerId === GameState.myId) {
                showCharacter(GameState.selectedCharacter);
            }
            
            // Invia ai client
            sendMessage({
                type: 'start_game',
                players: GameState.players,
                currentPlayerId: GameState.currentPlayerId,
                character: GameState.selectedCharacter
            });
            
            showScreen('gameScreen');
            updatePlayersList();
            addChatMessage('system', null, '🎮 Partita iniziata!');
            showStatus('🎯 Partita iniziata!', 'success');
            
            setTimeout(() => hideStatus(), 2000);
        }

        function askQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;
            if (!GameState.isMyTurn || !GameState.gameStarted) {
                showStatus('⏳ Aspetta il tuo turno!', 'warning');
                setTimeout(() => hideStatus(), 2000);
                return;
            }
            
            addChatMessage('me', null, `❓ ${question}`);
            sendMessage({
                type: 'question',
                playerId: GameState.myId,
                question: question
            });
            
            input.value = '';
        }

        function answerQuestion(answer) {
            if (!GameState.gameStarted) return;
            if (GameState.currentPlayerId === GameState.myId) {
                // Se sono io di turno, non devo rispondere
                return;
            }
            
            sendMessage({
                type: 'answer',
                playerId: GameState.myId,
                answer: answer
            });
        }

        function makeGuess() {
            const input = document.getElementById('guessInput');
            const guess = input.value.trim();
            if (!guess) return;
            if (!GameState.isMyTurn || !GameState.gameStarted) {
                showStatus('⏳ Aspetta il tuo turno!', 'warning');
                setTimeout(() => hideStatus(), 2000);
                return;
            }
            
            addChatMessage('me', null, `🔍 Indovina: ${guess}`);
            sendMessage({
                type: 'guess',
                playerId: GameState.myId,
                guess: guess
            });
            
            input.value = '';
        }

        function copyPeerId() {
            const id = document.getElementById('myPeerId').textContent;
            navigator.clipboard.writeText(id).then(() => {
                showStatus('✅ ID copiato!', 'success');
                setTimeout(() => hideStatus(), 2000);
            }).catch(() => {
                // Fallback
                const textArea = document.createElement('textarea');
                textArea.value = id;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showStatus('✅ ID copiato!', 'success');
                setTimeout(() => hideStatus(), 2000);
            });
        }

        function disconnectGame() {
            if (GameState.connection) {
                sendMessage({
                    type: 'disconnect',
                    playerName: GameState.players.find(p => p.id === GameState.myId)?.name || 'Qualcuno'
                });
                GameState.connection.close();
            }
            if (GameState.peer) {
                GameState.peer.destroy();
            }
            
            // Reset state
            GameState.players = [];
            GameState.gameStarted = false;
            GameState.selectedCharacter = null;
            GameState.currentPlayerId = null;
            GameState.isMyTurn = false;
            
            document.getElementById('characterCard').classList.add('hidden');
            document.getElementById('chatBox').innerHTML = `
                <div class="chat-message system">🎮 Benvenuti in AniQuiz Multiplayer!</div>
                <div class="chat-message system">💡 Il giocatore di turno deve fare domande e indovinare</div>
            `;
            
            showScreen('lobbyScreen');
            document.getElementById('waitingSection').classList.add('hidden');
            document.getElementById('lobbyScreen').querySelector('.grid-2').style.display = 'grid';
            document.getElementById('joinSection').classList.add('hidden');
            document.getElementById('connectionStatus').className = 'connection-status disconnected';
        }

        // ============================================
        // RISPONDI ALLE DOMANDE (per il giocatore che ha il personaggio)
        // ============================================
        // Aggiungi un listener per rispondere automaticamente alle domande
        document.addEventListener('keydown', (e) => {
            // Se premo Invio nella chat delle domande
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active.id === 'questionInput') askQuestion();
                else if (active.id === 'guessInput') makeGuess();
            }
        });

        // Ascolta le domande e permette di rispondere cliccando su un pulsante
        // Aggiungiamo un sistema di risposta rapida
        let lastQuestion = '';

        // Modifica handleMessage per le domande
        const originalHandleMessage = handleMessage;
        handleMessage = function(data) {
            if (data.type === 'question' && GameState.currentPlayerId !== GameState.myId) {
                // Se l'altro giocatore ha fatto una domanda e io ho il personaggio
                lastQuestion = data.question;
                showStatus(`💬 Domanda: "${data.question}" - Rispondi nella chat`, 'info');
                
                // Aggiungi un campo di risposta rapida
                const chatBox = document.getElementById('chatBox');
                const responseDiv = document.createElement('div');
                responseDiv.id = 'quickResponse';
                responseDiv.style.cssText = `
                    margin: 10px 0;
                    display: flex;
                    gap: 10px;
                    align-items: center;
                `;
                responseDiv.innerHTML = `
                    <input type="text" id="quickAnswer" placeholder="Rispondi alla domanda..." style="flex:1; padding: 8px; border-radius: 8px; border: 2px solid #667eea;">
                    <button class="btn btn-primary" onclick="sendQuickAnswer()" style="width: auto; padding: 8px 20px; margin: 0;">Invia</button>
                `;
                chatBox.appendChild(responseDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
            
            originalHandleMessage(data);
        };

        function sendQuickAnswer() {
            const input = document.getElementById('quickAnswer');
            const answer = input.value.trim();
            if (!answer) return;
            
            answerQuestion(answer);
            addChatMessage('me', null, `💬 ${answer}`);
            input.value = '';
            
            const responseDiv = document.getElementById('quickResponse');
            if (responseDiv) responseDiv.remove();
            hideStatus();
        }

        // ============================================
        // INIT
        // ============================================
        console.log('🎮 AniQuiz Multiplayer caricato!');
        showScreen('lobbyScreen');
    </script>
</body>
</html>
