<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 MobShow - Anime Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-wrapper {
            max-width: 900px;
            width: 100%;
            background: rgba(20, 10, 40, 0.95);
            border-radius: 30px;
            padding: 30px;
            border: 2px solid #ff3366;
        }

        .logo {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff3366, #ff6b35, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .logo-sub {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .shortcuts-hint {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #ffd700;
            border-radius: 12px;
            padding: 12px 16px;
            margin: 10px 0;
            color: #ffd700;
            font-size: 0.85rem;
            text-align: center;
        }

        .shortcuts-hint kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 10px;
            border-radius: 6px;
            border: 1px solid #555;
            font-family: monospace;
            color: #fff;
        }

        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* SETUP */
        .setup-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 12px 16px;
            flex: 1 1 160px;
            border: 1px solid #333;
        }

        .player-card label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .player-card input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid #333;
            color: #fff;
            font-size: 1.1rem;
            padding: 4px 0;
            outline: none;
            font-weight: 600;
        }

        .player-card input:focus {
            border-bottom-color: #ff3366;
        }

        .player-card .remove-btn {
            background: none;
            border: none;
            color: #ff3366;
            cursor: pointer;
            font-size: 1.2rem;
            margin-top: 4px;
            opacity: 0.5;
        }

        .player-card .remove-btn:hover {
            opacity: 1;
        }

        .btn {
            background: linear-gradient(135deg, #ff3366, #ff6b35);
            border: none;
            color: #fff;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 14px 40px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 20px rgba(255, 51, 102, 0.3);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(255, 51, 102, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: none;
            border: 1px solid #333;
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }

        .btn-center {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* VIDEO */
        .video-container {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin: 15px 0;
            position: relative;
            aspect-ratio: 16/9;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* OVERLAY che cattura i tasti ma lascia passare il click */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
            pointer-events: none;
        }

        .video-overlay.active {
            pointer-events: auto;
        }

        /* Quando l'overlay è attivo, passa i click al video */
        .video-overlay.pass-through {
            pointer-events: none;
        }

        .video-container .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1.2rem;
            z-index: 5;
        }

        .video-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px 16px;
            margin: 10px 0;
            border: 1px solid #222;
            color: #aaa;
            font-size: 0.9rem;
        }

        .video-info strong {
            color: #fff;
        }

        /* PUNTEGGIO */
        .scores {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }

        .score-chip {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #333;
            font-weight: 600;
            color: #fff;
            min-width: 140px;
            justify-content: space-between;
            transition: 0.2s;
        }

        .score-chip.active-player {
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            background: rgba(255, 215, 0, 0.05);
        }

        .score-chip .name {
            color: #aaa;
            min-width: 60px;
        }

        .score-chip .pts {
            background: #ff3366;
            padding: 0 12px;
            border-radius: 20px;
            color: #fff;
            font-weight: 800;
            font-size: 1.1rem;
            min-width: 30px;
            text-align: center;
        }

        .score-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .score-controls button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #333;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .score-controls button:hover {
            background: rgba(255, 51, 102, 0.3);
            border-color: #ff3366;
        }

        .score-controls .points-input {
            width: 40px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 4px 4px;
            color: #fff;
            text-align: center;
            font-size: 0.8rem;
        }

        .score-controls .points-input:focus {
            border-color: #ff3366;
            outline: none;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .controls .btn {
            padding: 10px 24px;
            font-size: 0.9rem;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid #333;
        }

        .result-card.winner {
            border-color: #ffd700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
            transform: scale(1.05);
        }

        .result-card .r-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
        }

        .result-card .r-pts {
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffd700;
        }

        @media (max-width: 600px) {
            .game-wrapper {
                padding: 20px;
            }
            .logo {
                font-size: 1.8rem;
            }
            .player-card {
                flex: 1 1 100%;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
            .score-chip {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="logo">🎬 MOBSHOW</div>
        <div class="logo-sub">⚡ Anime Video Player</div>

        <!-- SETUP -->
        <div id="setupScreen" class="screen active">
            <div class="setup-grid" id="playerInputs"></div>
            <div style="text-align:center; margin: 6px 0;">
                <button class="btn btn-secondary" style="padding:8px 24px; font-size:0.9rem;" id="addPlayerBtn">➕ Aggiungi Giocatore</button>
            </div>

            <div class="btn-center">
                <button class="btn" id="startGameBtn">🚀 Avvia</button>
            </div>
        </div>

        <!-- GAME -->
        <div id="gameScreen" class="screen">
            <div class="shortcuts-hint">
                ⌨️ <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> ... = seleziona giocatore &nbsp;|&nbsp; 
                <kbd>+</kbd> / <kbd>-</kbd> = +1/-1 punto &nbsp;|&nbsp; 
                <kbd>Shift</kbd> + <kbd>+</kbd> = +5 punti &nbsp;|&nbsp; 
                <kbd>N</kbd> = prossimo video &nbsp;|&nbsp; 
                <kbd>E</kbd> = termina partita &nbsp;|&nbsp; 
                <kbd>Spazio</kbd> = play/pausa
            </div>

            <div class="video-container" id="videoContainer">
                <div class="loading">⏳ Caricamento video...</div>
                <iframe id="videoPlayer" src="" allowfullscreen></iframe>
                <div class="video-overlay active pass-through" id="videoOverlay"></div>
            </div>

            <div class="video-info" id="videoInfo">
                <strong>🎬</strong> Caricamento in corso...
            </div>

            <div class="scores" id="scoreBoard"></div>

            <div class="controls">
                <button class="btn btn-secondary" id="nextVideoBtn">⏭️ Prossimo Video</button>
                <button class="btn btn-secondary" id="endGameBtn">🏁 Termina Partita</button>
            </div>
        </div>

        <!-- RESULTS -->
        <div id="resultScreen" class="screen">
            <h2 style="text-align:center; color:#fff; margin-bottom:10px;">🏆 Classifica Finale</h2>
            <div class="result-grid" id="resultGrid"></div>
            <div class="btn-center">
                <button class="btn" id="restartBtn">🔄 Nuova Partita</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            //  🔑 QUI INSERISCI LA TUA API KEY
            // ============================================================
            const API_KEY = 'AIzaSyCXsFDpO4dYRiwlTPA4s5rbaIpCG4_7EB4';

            // ============================================================
            //  STATO
            // ============================================================
            const state = {
                players: [],
                selectedPlayerIndex: 0,
                currentVideoId: null,
                usedVideos: [],
                videos: [],
                gameOver: false
            };

            // ============================================================
            //  DOM REFS
            // ============================================================
            const $ = id => document.getElementById(id);
            const setupScreen = $('setupScreen');
            const gameScreen = $('gameScreen');
            const resultScreen = $('resultScreen');
            const playerInputs = $('playerInputs');
            const addPlayerBtn = $('addPlayerBtn');
            const startGameBtn = $('startGameBtn');
            const videoContainer = $('videoContainer');
            const videoPlayer = $('videoPlayer');
            const videoOverlay = $('videoOverlay');
            const videoInfo = $('videoInfo');
            const scoreBoard = $('scoreBoard');
            const nextVideoBtn = $('nextVideoBtn');
            const endGameBtn = $('endGameBtn');
            const resultGrid = $('resultGrid');
            const restartBtn = $('restartBtn');

            // ============================================================
            //  FUNZIONI UTILITY
            // ============================================================
            function shuffle(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function randomItem(arr) {
                return arr[Math.floor(Math.random() * arr.length)];
            }

            // ============================================================
            //  SETUP PLAYERS
            // ============================================================
            function renderPlayerInputs() {
                playerInputs.innerHTML = '';
                state.players.forEach((p, idx) => {
                    const div = document.createElement('div');
                    div.className = 'player-card';
                    div.innerHTML = `
                        <label>Giocatore ${idx+1}</label>
                        <input type="text" value="${p.name}" data-idx="${idx}" placeholder="Nome giocatore...">
                        <button class="remove-btn" data-idx="${idx}" ${state.players.length <= 2 ? 'disabled' : ''}>✕</button>
                    `;
                    playerInputs.appendChild(div);
                });
                playerInputs.querySelectorAll('input').forEach(inp => {
                    inp.addEventListener('input', (e) => {
                        const idx = parseInt(e.target.dataset.idx);
                        state.players[idx].name = e.target.value.trim() || `Giocatore ${idx+1}`;
                        updateScoreBoard();
                    });
                });
                playerInputs.querySelectorAll('.remove-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const idx = parseInt(e.target.dataset.idx);
                        if (state.players.length > 2) {
                            state.players.splice(idx, 1);
                            renderPlayerInputs();
                        }
                    });
                });
            }

            function initSetup() {
                state.players = [
                    { name: '', points: 0 },
                    { name: '', points: 0 }
                ];
                renderPlayerInputs();
            }

            addPlayerBtn.addEventListener('click', () => {
                if (state.players.length < 6) {
                    state.players.push({ name: '', points: 0 });
                    renderPlayerInputs();
                } else {
                    alert('Massimo 6 giocatori!');
                }
            });

            // ============================================================
            //  YOUTUBE API
            // ============================================================
            async function searchMobShowVideos() {
                const queries = [
                    'mobshow anime quiz',
                    'mobshow indovina anime',
                    'mobshow anime challenge',
                    'mobshow anime game'
                ];
                const query = randomItem(queries);
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=50&key=${API_KEY}`;

                try {
                    const response = await fetch(url);
                    const data = await response.json();
                    if (data.error) {
                        throw new Error(data.error.message);
                    }
                    return data.items || [];
                } catch (error) {
                    console.error('Errore API:', error);
                    throw error;
                }
            }

            function extractVideoId(video) {
                return video.id.videoId || video.id;
            }

            function getRandomVideo(videos, usedIds) {
                const available = videos.filter(v => !usedIds.includes(extractVideoId(v)));
                if (available.length === 0) return null;
                return randomItem(available);
            }

            // ============================================================
            //  AVVIO
            // ============================================================
            startGameBtn.addEventListener('click', async () => {
                const inputs = playerInputs.querySelectorAll('input');
                inputs.forEach((inp, i) => {
                    if (i < state.players.length) {
                        state.players[i].name = inp.value.trim() || `Giocatore ${i+1}`;
                    }
                });

                state.players.forEach(p => { p.points = 0; });
                state.usedVideos = [];
                state.gameOver = false;
                state.selectedPlayerIndex = 0;

                try {
                    const videos = await searchMobShowVideos();
                    if (!videos || videos.length === 0) {
                        alert('Nessun video trovato! Riprova con un\'altra API Key.');
                        return;
                    }
                    state.videos = videos;

                    setupScreen.classList.remove('active');
                    gameScreen.classList.add('active');
                    resultScreen.classList.remove('active');

                    loadVideo();
                    updateScoreBoard();
                } catch (error) {
                    alert(`Errore nel caricare i video: ${error.message}`);
                }
            });

            // ============================================================
            //  CARICA VIDEO
            // ============================================================
            function loadVideo() {
                if (state.gameOver) return;

                let video = getRandomVideo(state.videos, state.usedVideos);
                if (!video) {
                    state.usedVideos = [];
                    video = getRandomVideo(state.videos, state.usedVideos);
                    if (!video) {
                        alert('Nessun video disponibile!');
                        return;
                    }
                }

                state.currentVideoId = extractVideoId(video);
                state.usedVideos.push(state.currentVideoId);

                videoPlayer.src = `https://www.youtube.com/embed/${state.currentVideoId}?autoplay=1&rel=0`;
                videoPlayer.style.display = 'block';
                document.querySelector('.video-container .loading').style.display = 'none';
                videoInfo.innerHTML = `<strong>🎬</strong> ${video.snippet.title.substring(0, 100)}...`;
                
                // Attiva overlay con pass-through per i click
                videoOverlay.className = 'video-overlay active pass-through';
            }

            // ============================================================
            //  SCOREBOARD
            // ============================================================
            function updateScoreBoard() {
                scoreBoard.innerHTML = '';
                state.players.forEach((p, idx) => {
                    const chip = document.createElement('div');
                    chip.className = 'score-chip' + (idx === state.selectedPlayerIndex ? ' active-player' : '');
                    chip.innerHTML = `
                        <span class="name">${p.name || `Giocatore ${idx+1}`}</span>
                        <span class="pts">${p.points}</span>
                        <div class="score-controls">
                            <button class="minus-btn" data-idx="${idx}">−</button>
                            <input type="number" class="points-input" data-idx="${idx}" value="1" min="1" max="100">
                            <button class="plus-btn" data-idx="${idx}">+</button>
                        </div>
                    `;
                    scoreBoard.appendChild(chip);
                });

                // Eventi per i pulsanti
                scoreBoard.querySelectorAll('.plus-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const idx = parseInt(e.target.dataset.idx);
                        const input = scoreBoard.querySelector(`.points-input[data-idx="${idx}"]`);
                        const val = parseInt(input.value) || 1;
                        state.players[idx].points += val;
                        updateScoreBoard();
                    });
                });

                scoreBoard.querySelectorAll('.minus-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const idx = parseInt(e.target.dataset.idx);
                        const input = scoreBoard.querySelector(`.points-input[data-idx="${idx}"]`);
                        const val = parseInt(input.value) || 1;
                        state.players[idx].points = Math.max(0, state.players[idx].points - val);
                        updateScoreBoard();
                    });
                });

                scoreBoard.querySelectorAll('.points-input').forEach(inp => {
                    inp.addEventListener('change', (e) => {
                        const idx = parseInt(e.target.dataset.idx);
                        const val = parseInt(e.target.value);
                        if (isNaN(val) || val < 1) e.target.value = 1;
                    });
                });
            }

            // ============================================================
            //  SCORCIATOIE DA TASTIERA
            // ============================================================
            document.addEventListener('keydown', (e) => {
                // Se stiamo scrivendo in un input, lascia fare
                if (e.target.tagName === 'INPUT') return;

                // Se la partita non è iniziata o è finita
                if (!gameScreen.classList.contains('active') || state.gameOver) return;

                const key = e.key;

                // SPAZIO = play/pausa (lo lasciamo passare al video)
                if (key === ' ' || key === 'Space') {
                    // Non facciamo nulla, lasciamo che il player lo gestisca
                    return;
                }

                // Numeri 1-6 per selezionare giocatore
                if (key >= '1' && key <= '6') {
                    const idx = parseInt(key) - 1;
                    if (idx < state.players.length) {
                        state.selectedPlayerIndex = idx;
                        updateScoreBoard();
                        e.preventDefault();
                        e.stopPropagation();
                    }
                    return;
                }

                // + e - per punti
                if (key === '+' || key === '=') {
                    e.preventDefault();
                    e.stopPropagation();
                    const player = state.players[state.selectedPlayerIndex];
                    if (e.shiftKey) {
                        player.points += 5;
                    } else {
                        player.points += 1;
                    }
                    updateScoreBoard();
                    return;
                }

                if (key === '-' || key === '_') {
                    e.preventDefault();
                    e.stopPropagation();
                    const player = state.players[state.selectedPlayerIndex];
                    if (e.shiftKey) {
                        player.points = Math.max(0, player.points - 5);
                    } else {
                        player.points = Math.max(0, player.points - 1);
                    }
                    updateScoreBoard();
                    return;
                }

                // N = prossimo video
                if (key === 'n' || key === 'N') {
                    e.preventDefault();
                    e.stopPropagation();
                    loadVideo();
                    return;
                }

                // E = termina partita
                if (key === 'e' || key === 'E') {
                    e.preventDefault();
                    e.stopPropagation();
                    endGame();
                    return;
                }
            }, true);

            // ============================================================
            //  CONTROLLI
            // ============================================================
            nextVideoBtn.addEventListener('click', loadVideo);
            endGameBtn.addEventListener('click', endGame);

            // ============================================================
            //  FINE PARTITA
            // ============================================================
            function endGame() {
                state.gameOver = true;
                gameScreen.classList.remove('active');
                resultScreen.classList.add('active');

                const sorted = [...state.players].sort((a, b) => b.points - a.points);
                resultGrid.innerHTML = '';
                sorted.forEach((p, idx) => {
                    const card = document.createElement('div');
                    card.className = 'result-card' + (idx === 0 ? ' winner' : '');
                    card.innerHTML = `
                        <div class="r-name">${idx === 0 ? '🏆 ' : ''}${p.name || 'Giocatore'}</div>
                        <div class="r-pts">${p.points} pts</div>
                    `;
                    resultGrid.appendChild(card);
                });
            }

            // ============================================================
            //  RIAVVIO
            // ============================================================
            restartBtn.addEventListener('click', () => {
                resultScreen.classList.remove('active');
                setupScreen.classList.add('active');
                initSetup();
                state.gameOver = false;
                state.usedVideos = [];
                state.selectedPlayerIndex = 0;
            });

            // ============================================================
            //  INIT
            // ============================================================
            initSetup();
        })();
    </script>
</body>
</html>
