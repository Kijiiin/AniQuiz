<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏆 Anime Uwufufu – Torneo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 30px 25px 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b9d, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub {
            color: #8a8aa0;
            font-size: 1rem;
            margin-top: 4px;
        }

        /* ===== CONTROLLI ===== */
        .controls {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 60px;
            padding: 12px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px 24px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .controls label {
            color: #ccd;
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .controls select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f0f0f5;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }
        .controls select:hover {
            border-color: #a855f7;
        }
        .btn-start {
            background: linear-gradient(135deg, #ff6b9d, #a855f7);
            border: none;
            padding: 8px 28px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.25);
        }
        .btn-start:hover:not(:disabled) {
            transform: scale(1.04);
            box-shadow: 0 6px 30px rgba(168, 85, 247, 0.4);
        }
        .btn-start:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== STATUS BAR ===== */
        .status-bar {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 60px;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .status-bar .turno {
            color: #ddd;
            font-weight: 600;
            font-size: 1.05rem;
        }
        .status-bar .turno span {
            color: #a855f7;
        }
        .status-bar .progress {
            color: #aaa;
            font-size: 0.95rem;
        }
        .btn-reset {
            background: rgba(255, 70, 70, 0.12);
            border: 1px solid rgba(255, 70, 70, 0.25);
            color: #ff7a7a;
            padding: 6px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-reset:hover:not(:disabled) {
            background: rgba(255, 70, 70, 0.2);
            border-color: #ff7a7a;
        }
        .btn-reset:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== MATCH AREA ===== */
        .match-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            min-height: 380px;
        }
        .match-title {
            color: #ccd;
            font-size: 1.15rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 24px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .match-cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 30px;
            width: 100%;
        }
        .card {
            background: rgba(30, 30, 50, 0.75);
            backdrop-filter: blur(4px);
            border-radius: 28px;
            padding: 20px 20px 24px;
            width: 280px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.25s ease, box-shadow 0.3s, border-color 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            border-color: rgba(168, 85, 247, 0.3);
        }
        .card:active {
            transform: scale(0.97);
        }
        .card img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 20px;
            background: #1a1a2e;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .card .title {
            margin-top: 16px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #f0f0f5;
            line-height: 1.3;
            min-height: 2.8em;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card .sub-info {
            color: #99aabb;
            font-size: 0.85rem;
            margin-top: 4px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card .actions {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }
        .card .vote-btn {
            background: linear-gradient(135deg, #ff6b9d, #a855f7);
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
            cursor: pointer;
            transition: 0.25s;
            flex: 1;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.2);
        }
        .card .vote-btn:hover {
            transform: scale(1.04);
        }
        .card .vote-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        .card .anilist-link {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 14px;
            border-radius: 40px;
            color: #aab;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.25s;
            font-weight: 500;
            white-space: nowrap;
        }
        .card .anilist-link:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #a855f7;
            color: #fff;
        }
        .vs-badge {
            font-size: 2.4rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.12);
            padding: 0 10px;
            user-select: none;
        }

        /* ===== WINNER ===== */
        .winner-screen {
            text-align: center;
            padding: 10px 10px 0;
            animation: fadeIn 0.6s ease;
        }
        .winner-screen .trophy {
            font-size: 4.2rem;
            margin-bottom: 2px;
        }
        .winner-screen .winner-name {
            font-size: 2.4rem;
            font-weight: 800;
            color: #a855f7;
            text-shadow: 0 0 40px rgba(168, 85, 247, 0.2);
        }
        .winner-screen .winner-sub {
            color: #aab;
            margin-top: 6px;
            font-size: 1rem;
        }
        .winner-screen .winner-img {
            width: 200px;
            border-radius: 28px;
            margin: 16px auto;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(168, 85, 247, 0.2);
        }
        .btn-restart {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ddd;
            padding: 10px 32px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }
        .btn-restart:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: #a855f7;
            color: #fff;
        }

        /* ===== LOADING ===== */
        .loading {
            color: #aab;
            font-size: 1.3rem;
            text-align: center;
            padding: 50px 20px;
        }
        .loading .spinner {
            display: inline-block;
            width: 46px;
            height: 46px;
            border: 4px solid rgba(168, 85, 247, 0.08);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 850px) {
            .card {
                width: 220px;
                padding: 14px;
            }
            .card .title {
                font-size: 1rem;
                min-height: 2.4em;
            }
            .card .actions {
                flex-direction: column;
                gap: 8px;
            }
            .vs-badge {
                font-size: 1.8rem;
            }
        }
        @media (max-width: 600px) {
            .container {
                padding: 18px 12px;
            }
            .header h1 {
                font-size: 2.0rem;
            }
            .controls {
                border-radius: 30px;
                padding: 12px 16px;
            }
            .card {
                width: 170px;
                padding: 10px;
            }
            .card .title {
                font-size: 0.9rem;
                min-height: 2.2em;
            }
            .vs-badge {
                font-size: 1.2rem;
            }
            .status-bar {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                gap: 6px;
            }
            .winner-screen .winner-name {
                font-size: 1.7rem;
            }
            .winner-screen .winner-img {
                width: 150px;
            }
        }
        @media (max-width: 420px) {
            .card {
                width: 140px;
                padding: 8px;
            }
            .card .title {
                font-size: 0.8rem;
                min-height: 2em;
            }
            .card .vote-btn {
                font-size: 0.75rem;
                padding: 6px 10px;
            }
            .card .anilist-link {
                font-size: 0.7rem;
                padding: 6px 8px;
            }
            .vs-badge {
                font-size: 1.0rem;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <div class="header">
            <h1>⚔️ Anime Uwufufu</h1>
            <div class="sub">Scegli il tuo preferito in ogni scontro – torneo a eliminazione</div>
        </div>

        <!-- Selettore dimensione -->
        <div class="controls">
            <label for="sizeSelect">🏟️ Partecipanti:
                <select id="sizeSelect">
                    <option value="16">16</option>
                    <option value="32">32</option>
                    <option value="64">64</option>
                    <option value="128" selected>128</option>
                </select>
            </label>
            <button class="btn-start" id="startBtn">🚀 Avvia torneo</button>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="turno">🏁 <span id="turnoLabel">In attesa</span></div>
            <div class="progress" id="progressLabel">—</div>
            <button class="btn-reset" id="resetBtn">⟳ Ricomincia</button>
        </div>

        <!-- Match Area -->
        <div class="match-area" id="matchArea">
            <div style="color:#99aabb; text-align:center; padding:60px 20px; font-size:1.2rem;">
                <div style="font-size:4rem; margin-bottom:16px;">🎌</div>
                <p>Scegli il numero di partecipanti e clicca su <strong>"Avvia torneo"</strong> per iniziare!</p>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // 1. FETCH – multi‑categoria con esclusione NOT_YET_RELEASED, CANCELLED
        //    e durata episodi > 11 minuti (filtro lato client)
        // ================================================================

        const PER_PAGE = 30;

        function buildMultiQuery() {
            const sorts = [
                { name: 'popolari', sort: 'POPULARITY_DESC', page: 1 },
                { name: 'trending', sort: 'TRENDING_DESC', page: 1 },
                { name: 'votati', sort: 'SCORE_DESC', page: 1 },
                { name: 'recenti', sort: 'START_DATE_DESC', page: 1 },
                { name: 'casuali', sort: 'POPULARITY_DESC', page: Math.floor(Math.random() * 20) + 1 }
            ];

            let query = 'query {';
            sorts.forEach((s, i) => {
                const alias = `cat${i + 1}`;
                query += `
                    ${alias}: Page(page: ${s.page}, perPage: ${PER_PAGE}) {
                        pageInfo { hasNextPage }
                        media(
                            type: ANIME,
                            sort: ${s.sort},
                            isAdult: false,
                            status_not_in: [NOT_YET_RELEASED, CANCELLED]
                        ) {
                            id
                            title { romaji english native }
                            coverImage { large }
                            startDate { year }
                            genres
                            description
                            meanScore
                            episodes
                            format
                            status
                            episodeDuration   /* Aggiunto per il filtro durata */
                        }
                    }
                `;
            });
            query += '}';
            return query;
        }

        async function fetchMixedAnime() {
            const query = buildMultiQuery();
            const response = await fetch('https://graphql.anilist.co', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ query })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (data.errors) throw new Error(data.errors[0].message);

            const all = [];
            const categories = ['cat1', 'cat2', 'cat3', 'cat4', 'cat5'];
            categories.forEach(cat => {
                const media = data.data[cat]?.media || [];
                all.push(...media);
            });

            // Deduplica
            const uniqueMap = new Map();
            for (const a of all) {
                if (!uniqueMap.has(a.id)) {
                    uniqueMap.set(a.id, a);
                }
            }
            let unique = Array.from(uniqueMap.values());

            // --- FILTRO DURATA EPISODI: escludi quelli con episodeDuration <= 11 minuti ---
            // Se episodeDuration è null, lo teniamo (non sappiamo la durata)
            unique = unique.filter(a => {
                if (a.episodeDuration === null) return true;   // campo assente – teniamo
                return a.episodeDuration > 11;                 // durata > 11 minuti
            });

            console.log(`✅ Dopo filtro durata: ${unique.length} anime rimasti`);
            return unique;
        }

        // ================================================================
        // 2. TORNEO – bracket a eliminazione diretta
        // ================================================================

        class Tournament {
            constructor(participants) {
                this.participants = participants;
                this.rounds = [];
                this.currentRound = 0;
                this.currentMatch = 0;
                this.winner = null;
                this.finished = false;
                this._buildBracket();
            }

            _buildBracket() {
                let current = [...this.participants];
                while (current.length > 1) {
                    const round = [];
                    for (let i = 0; i < current.length; i += 2) {
                        if (i + 1 < current.length) {
                            round.push([current[i], current[i + 1]]);
                        } else {
                            round.push([current[i], null]); // bye
                        }
                    }
                    this.rounds.push(round);
                    current = new Array(round.length).fill(null);
                }
            }

            getCurrentMatch() {
                if (this.finished) return null;
                const round = this.rounds[this.currentRound];
                if (!round) return null;
                return round[this.currentMatch] || null;
            }

            vote(winner) {
                if (this.finished) return false;
                const round = this.rounds[this.currentRound];
                const match = round[this.currentMatch];
                if (!match) return false;

                round[this.currentMatch] = winner;
                this.currentMatch++;

                if (this.currentMatch >= round.length) {
                    const winners = round.filter(w => w !== null);
                    if (winners.length === 1) {
                        this.winner = winners[0];
                        this.finished = true;
                        return true;
                    }
                    const nextRound = [];
                    for (let i = 0; i < winners.length; i += 2) {
                        if (i + 1 < winners.length) {
                            nextRound.push([winners[i], winners[i + 1]]);
                        } else {
                            nextRound.push([winners[i], null]);
                        }
                    }
                    this.rounds.push(nextRound);
                    this.currentRound++;
                    this.currentMatch = 0;
                }
                return true;
            }

            getRoundName() {
                if (this.finished) return '🏆 Campione!';
                const round = this.rounds[this.currentRound];
                if (!round) return `Turno ${this.currentRound+1}`;
                const count = round.length * 2;
                const names = {
                    128: 'Primo turno (128→64)',
                    64: 'Secondo turno (64→32)',
                    32: 'Terzo turno (32→16)',
                    16: 'Ottavi di finale',
                    8: 'Quarti di finale',
                    4: 'Semifinali',
                    2: 'Finale'
                };
                return names[count] || `Turno ${this.currentRound+1}`;
            }

            getProgress() {
                if (this.finished) return '🏆 Torneo concluso!';
                const round = this.rounds[this.currentRound];
                if (!round) return '';
                return `Match ${this.currentMatch+1} di ${round.length}`;
            }
        }

        // ================================================================
        // 3. UI CONTROLLER
        // ================================================================

        const app = {
            tournament: null,
            size: 128,
            isLoading: false,

            elements: {
                matchArea: document.getElementById('matchArea'),
                turnoLabel: document.getElementById('turnoLabel'),
                progressLabel: document.getElementById('progressLabel'),
                resetBtn: document.getElementById('resetBtn'),
                startBtn: document.getElementById('startBtn'),
                sizeSelect: document.getElementById('sizeSelect'),
            },

            init() {
                this.elements.resetBtn.addEventListener('click', () => this.startTournament());
                this.elements.startBtn.addEventListener('click', () => this.startTournament());
                this.elements.sizeSelect.addEventListener('change', () => {
                    this.size = parseInt(this.elements.sizeSelect.value);
                });
                this.showWelcome();
            },

            showWelcome() {
                this.elements.matchArea.innerHTML = `
                    <div style="color:#99aabb; text-align:center; padding:60px 20px; font-size:1.2rem;">
                        <div style="font-size:4rem; margin-bottom:16px;">🎌</div>
                        <p>Scegli il numero di partecipanti e clicca su <strong>"Avvia torneo"</strong> per iniziare!</p>
                    </div>
                `;
                this.elements.turnoLabel.textContent = 'In attesa';
                this.elements.progressLabel.textContent = '—';
            },

            async startTournament() {
                if (this.isLoading) return;
                this.isLoading = true;
                this.elements.startBtn.disabled = true;
                this.elements.resetBtn.disabled = true;

                const size = this.size;
                this.elements.matchArea.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <div>⏳ Caricamento anime da Popolari, Trending, Votati, Recenti e Casuali…</div>
                        <div style="font-size:0.85rem; color:#666; margin-top:6px;">Esclusi: non ancora usciti, cancellati e durata episodi ≤ 11 min</div>
                    </div>
                `;
                this.elements.turnoLabel.textContent = 'Caricamento…';
                this.elements.progressLabel.textContent = '⏳';

                try {
                    const allAnime = await fetchMixedAnime();
                    if (!allAnime || allAnime.length < 2) {
                        throw new Error(`Trovati solo ${allAnime?.length || 0} anime dopo i filtri.`);
                    }

                    // Mescola e prendi i primi 'size'
                    const shuffled = allAnime.sort(() => 0.5 - Math.random());
                    const participants = shuffled.slice(0, Math.min(size, shuffled.length));

                    if (participants.length < 2) {
                        throw new Error('Non ci sono abbastanza anime per il torneo dopo i filtri.');
                    }

                    // Se il numero di partecipanti è minore di size, mostriamo un avviso in console
                    if (participants.length < size) {
                        console.warn(`⚠️ Richiesti ${size}, disponibili solo ${participants.length} dopo i filtri. Torneo ridotto.`);
                    }

                    this.tournament = new Tournament(participants);
                    this.renderMatch();
                } catch (err) {
                    console.error(err);
                    this.elements.matchArea.innerHTML = `
                        <div style="color:#ff8a8a; text-align:center; padding:40px;">
                            <div style="font-size:3rem;">😵</div>
                            <p style="font-size:1.2rem; margin-top:10px;">Errore nel caricamento.</p>
                            <p style="color:#99aabb; font-size:0.9rem;">${err.message}</p>
                            <button class="btn-restart" style="margin-top:20px;" onclick="app.startTournament()">⟳ Riprova</button>
                        </div>
                    `;
                    this.elements.turnoLabel.textContent = 'Errore';
                    this.elements.progressLabel.textContent = '❌';
                } finally {
                    this.isLoading = false;
                    this.elements.startBtn.disabled = false;
                    this.elements.resetBtn.disabled = false;
                }
            },

            renderMatch() {
                const tour = this.tournament;
                if (!tour || tour.finished) {
                    this.renderWinner();
                    return;
                }

                const match = tour.getCurrentMatch();
                if (!match) {
                    this.renderWinner();
                    return;
                }

                const [a, b] = match;
                if (!a || !b) {
                    // bye – passa automaticamente
                    tour.vote(a || b);
                    this.renderMatch();
                    return;
                }

                this.elements.turnoLabel.textContent = tour.getRoundName();
                this.elements.progressLabel.textContent = tour.getProgress();

                const cardHtml = (anime) => `
                    <div class="card" data-anime-id="${anime.id}">
                        <img src="${anime.coverImage?.large || ''}" alt="${anime.title?.romaji || 'Anime'}" loading="lazy"
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22280%22%3E%3Crect width=%22200%22 height=%22280%22 fill=%22%23222%22/%3E%3Ctext x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2220%22 dy=%22.3em%22%3E❓%3C/text%3E%3C/svg%3E'">
                        <div class="title">${anime.title?.romaji || anime.title?.english || 'Senza titolo'}</div>
                        <div class="sub-info">
                            ${anime.startDate?.year || '?'} · ${anime.genres?.slice(0,2).join(', ') || ''}
                            ${anime.meanScore ? `· ${anime.meanScore}%` : ''}
                            ${anime.episodeDuration ? `· ${anime.episodeDuration}min` : ''}
                            ${anime.status ? `· ${anime.status}` : ''}
                        </div>
                        <div class="actions">
                            <button class="vote-btn" data-anime-id="${anime.id}">⬆ Vota</button>
                            <a href="https://anilist.co/anime/${anime.id}" target="_blank" rel="noopener noreferrer" class="anilist-link" title="Apri su AniList">
                                📖 AniList
                            </a>
                        </div>
                    </div>
                `;

                this.elements.matchArea.innerHTML = `
                    <div class="match-title">⚔️ Scegli il tuo preferito</div>
                    <div class="match-cards">
                        ${cardHtml(a)}
                        <div class="vs-badge">⚡</div>
                        ${cardHtml(b)}
                    </div>
                `;

                const cards = this.elements.matchArea.querySelectorAll('.card');
                const btns = this.elements.matchArea.querySelectorAll('.vote-btn');

                const handleVote = (animeId) => {
                    const match = tour.getCurrentMatch();
                    const winner = match?.find(anime => anime.id === animeId);
                    if (winner) {
                        btns.forEach(b => b.disabled = true);
                        cards.forEach(c => c.style.cursor = 'default');
                        tour.vote(winner);
                        setTimeout(() => this.renderMatch(), 250);
                    }
                };

                // Click su tutta la carta
                cards.forEach(card => {
                    card.addEventListener('click', (e) => {
                        if (e.target.closest('.anilist-link') || e.target.closest('.vote-btn')) return;
                        const id = parseInt(card.dataset.animeId);
                        handleVote(id);
                    });
                });

                // Click sul bottone Vota
                btns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = parseInt(btn.dataset.animeId);
                        handleVote(id);
                    });
                });
            },

            renderWinner() {
                const tour = this.tournament;
                let winner = tour?.winner;

                // Fallback: se il torneo è finito ma winner è null, prova a prenderlo dall'ultimo round
                if (tour && tour.finished && !winner) {
                    const lastRound = tour.rounds[tour.rounds.length - 1];
                    if (lastRound && lastRound.length === 1 && lastRound[0] !== null) {
                        winner = lastRound[0];
                    }
                }

                if (!winner) {
                    this.elements.matchArea.innerHTML = `<div style="color:#aab; text-align:center; padding:40px;">Nessun vincitore determinato.</div>`;
                    return;
                }

                this.elements.turnoLabel.textContent = '🏆 Campione!';
                this.elements.progressLabel.textContent = '🎉 Complimenti!';

                this.elements.matchArea.innerHTML = `
                    <div class="winner-screen">
                        <div class="trophy">🏆</div>
                        <div class="winner-name">${winner.title?.romaji || winner.title?.english || 'Campione'}</div>
                        <div class="winner-sub">
                            ${winner.startDate?.year || ''} · ${winner.genres?.slice(0,3).join(', ') || ''}
                            ${winner.meanScore ? `· ${winner.meanScore}%` : ''}
                            ${winner.episodeDuration ? `· ${winner.episodeDuration}min` : ''}
                            ${winner.status ? `· ${winner.status}` : ''}
                        </div>
                        <img class="winner-img" src="${winner.coverImage?.large || ''}" alt="${winner.title?.romaji || 'Campione'}" loading="lazy" onerror="this.style.display='none'">
                        <br>
                        <div style="margin-top:16px;">
                            <a href="https://anilist.co/anime/${winner.id}" target="_blank" rel="noopener noreferrer" class="anilist-link" style="font-size:1.1rem; padding:10px 24px; color:#aab; text-decoration:none; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:40px; transition:0.25s;">
                                📖 Vedi su AniList
                            </a>
                        </div>
                        <br>
                        <button class="btn-restart" onclick="app.startTournament()">🔄 Nuovo torneo</button>
                    </div>
                `;
            }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>

</body>
</html>
