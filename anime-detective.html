<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Detective · AniList</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 20%, #0f0a1a, #06030a);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .game-wrapper {
            max-width: 800px;
            width: 100%;
            background: rgba(14, 10, 30, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 56px;
            padding: 26px 22px 32px;
            border: 2px solid #4a7ab5;
            box-shadow: 0 20px 50px #000000aa, 0 0 0 3px #1a3a6a inset;
        }
        h1 {
            text-align: center;
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #7ab8f5, #4a8fd8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px #4a8fd866;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }
        .scoreboard {
            background: #0a0618;
            border-radius: 60px;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            border: 1px solid #4a7ab5;
            box-shadow: inset 0 2px 10px #00000088;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 6px 14px;
        }
        .score-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            color: #c8dfff;
            background: #120e22;
            padding: 4px 16px 4px 12px;
            border-radius: 40px;
            border: 1px solid #4a7ab5;
            font-size: 1rem;
        }
        .score-item .num {
            background: #06040e;
            padding: 0 14px;
            border-radius: 30px;
            color: #7ab8f5;
            min-width: 28px;
            text-align: center;
        }
        .clues-area {
            background: #0a0618;
            border-radius: 48px;
            padding: 20px 18px 18px;
            border: 1px solid #4a7ab5;
            box-shadow: inset 0 -6px 0 #05030a, 0 10px 30px #00000077;
            margin-bottom: 16px;
            min-height: 200px;
        }
        .clue-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .clue-item {
            background: #120e22;
            border: 1px solid #2a3a5a;
            border-radius: 30px;
            padding: 12px 16px;
            color: #d8e8ff;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 14px;
            opacity: 0;
            animation: fadeIn 0.4s ease forwards;
        }
        .clue-item:nth-child(1) { animation-delay: 0.1s; }
        .clue-item:nth-child(2) { animation-delay: 0.3s; }
        .clue-item:nth-child(3) { animation-delay: 0.5s; }
        .clue-item:nth-child(4) { animation-delay: 0.7s; }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        .clue-item .icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        .clue-item .label {
            font-weight: 600;
            color: #7ab8f5;
            min-width: 70px;
        }
        .clue-item .value {
            color: #e8f0ff;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 14px 0 12px;
        }
        .option-btn {
            background: #120e22;
            border: 2px solid #2a3a5a;
            border-radius: 40px;
            padding: 16px 10px;
            font-weight: 600;
            font-size: 1.05rem;
            color: #d8e8ff;
            box-shadow: 0 6px 0 #05030a, 0 6px 16px #00000055;
            cursor: pointer;
            transition: all 0.08s linear;
            text-align: center;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .option-btn:active:not(:disabled) {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #05030a;
        }
        .option-btn:disabled {
            opacity: 0.4;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #05030a;
            pointer-events: none;
        }
        .option-btn.correct {
            background: #1a3a2a;
            border-color: #5ad87a;
            color: #b0ffc0;
            box-shadow: 0 0 30px #5ad87a44;
        }
        .option-btn.wrong {
            background: #3a1a1a;
            border-color: #d85a5a;
            color: #ffb0b0;
            box-shadow: 0 0 30px #d85a5a44;
        }
        .message-box {
            background: #0a0618;
            border-radius: 50px;
            padding: 14px 18px;
            margin: 10px 0 12px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: #c8dfff;
            border: 1px solid #4a7ab5;
            box-shadow: inset 0 2px 10px #00000077;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .message-box span {
            background: #120e22;
            padding: 4px 16px;
            border-radius: 40px;
            border: 1px solid #4a7ab5;
        }
        .reset-area {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .reset-btn {
            background: #120e22;
            border: 1px solid #4a7ab5;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #c8dfff;
            box-shadow: 0 6px 0 #05030a;
            cursor: pointer;
            transition: 0.06s linear;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .reset-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #05030a;
        }
        .reset-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #05030a;
        }
        .loading {
            text-align: center;
            color: #7ab8f5;
            font-size: 1.2rem;
            padding: 30px 0;
        }
        .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
            font-size: 2rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status-info {
            color: #d8a05a;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 4px;
            min-height: 24px;
        }
        .version-badge {
            color: #7ab8f5;
            font-size: 0.75rem;
            text-align: center;
            opacity: 0.5;
            margin-top: 2px;
        }
        @media (max-width: 550px) {
            .game-wrapper { padding: 14px; }
            .options-grid { gap: 8px; }
            .option-btn { font-size: 0.9rem; padding: 12px 8px; min-height: 46px; }
            h1 { font-size: 1.8rem; }
            .clue-item { font-size: 0.9rem; padding: 10px 12px; }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <h1>
            <span>🕵️</span> ANIME DETECTIVE <span>🕵️</span>
        </h1>
        <div class="scoreboard">
            <div class="score-item">⭐ Punteggio <span class="num" id="scoreDisplay">0</span></div>
            <div class="score-item">🎯 Indovinati <span class="num" id="correctDisplay">0</span></div>
            <div class="score-item">❌ Errori <span class="num" id="errorsDisplay">0</span></div>
        </div>

        <div class="clues-area" id="cluesArea">
            <div class="loading" id="loadingIndicator">
                <span class="spinner">🌀</span> Caricamento anime...
            </div>
            <div class="clue-container" id="clueContainer" style="display:none;">
                <div class="clue-item" id="clue1">
                    <span class="icon">📅</span>
                    <span class="label">Anno:</span>
                    <span class="value" id="yearValue">-</span>
                </div>
                <div class="clue-item" id="clue2">
                    <span class="icon">🎭</span>
                    <span class="label">Generi:</span>
                    <span class="value" id="genreValue">-</span>
                </div>
                <div class="clue-item" id="clue3">
                    <span class="icon">⭐</span>
                    <span class="label">Voto:</span>
                    <span class="value" id="scoreValue">-</span>
                </div>
                <div class="clue-item" id="clue4">
                    <span class="icon">📺</span>
                    <span class="label">Episodi:</span>
                    <span class="value" id="episodesValue">-</span>
                </div>
            </div>
            <div class="status-info" id="statusInfo"></div>
            <div class="version-badge">⚡ AniList API · Query semplice</div>
        </div>

        <div class="options-grid" id="optionsContainer">
            <button class="option-btn" data-index="0">-</button>
            <button class="option-btn" data-index="1">-</button>
            <button class="option-btn" data-index="2">-</button>
            <button class="option-btn" data-index="3">-</button>
        </div>

        <div class="message-box" id="messageBox">
            <span>💬</span> Caricamento in corso...
        </div>

        <div class="reset-area">
            <button class="reset-btn" id="resetBtn">🔄 Nuovo round</button>
            <button class="reset-btn" id="skipBtn">⏭️ Salta</button>
        </div>
    </div>
    <script>
        (function() {
            // ----- ANILIST API (DIRETTA, SENZA PROXY) -----
            const ANILIST_URL = 'https://graphql.anilist.co';

            // ----- STATO -----
            let state = {
                targetAnime: null,
                options: [],
                score: 0,
                correctCount: 0,
                errors: 0,
                isAnswered: false,
                isLoading: false,
                round: 0,
                animeCache: [],
                isCacheFilled: false
            };

            // DOM
            const loadingIndicator = document.getElementById('loadingIndicator');
            const clueContainer = document.getElementById('clueContainer');
            const yearValue = document.getElementById('yearValue');
            const genreValue = document.getElementById('genreValue');
            const scoreValue = document.getElementById('scoreValue');
            const episodesValue = document.getElementById('episodesValue');
            const optionsBtns = document.querySelectorAll('.option-btn');
            const messageBox = document.getElementById('messageBox');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const correctDisplay = document.getElementById('correctDisplay');
            const errorsDisplay = document.getElementById('errorsDisplay');
            const resetBtn = document.getElementById('resetBtn');
            const skipBtn = document.getElementById('skipBtn');
            const statusInfo = document.getElementById('statusInfo');

            // ----- FUNZIONI -----
            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            // ----- GET TITLE -----
            function getTitle(anime) {
                return anime.title?.english || anime.title?.romaji || anime.title?.native || 'Titolo sconosciuto';
            }

            // ----- QUERY ANILIST (SINGOLA, SEMPLICE) -----
            async function fetchAnimeBatch(page = 1) {
                const query = `
                    query ($page: Int) {
                        Page(page: $page, perPage: 50) {
                            pageInfo { hasNextPage }
                            media(
                                type: ANIME
                                sort: POPULARITY_DESC
                                isAdult: false
                                status_not: NOT_YET_RELEASED
                            ) {
                                id
                                title { romaji english native }
                                startDate { year }
                                genres
                                averageScore
                                episodes
                                status
                            }
                        }
                    }
                `;

                try {
                    const response = await fetch(ANILIST_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                        },
                        body: JSON.stringify({
                            query: query,
                            variables: { page: page }
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    if (data.errors) {
                        throw new Error(data.errors[0].message);
                    }

                    const media = data.data?.Page?.media || [];
                    console.log(`📦 Pagina ${page}: ${media.length} anime`);
                    return media;

                } catch (error) {
                    console.error('Errore fetch AniList:', error);
                    throw error;
                }
            }

            // ----- RIEMPIE LA CACHE (MULTIPLE PAGINE) -----
            async function fillCache() {
                if (state.isCacheFilled && state.animeCache.length > 30) {
                    return true;
                }

                statusInfo.textContent = '📡 Caricamento anime da AniList...';
                
                try {
                    // Prende 2 pagine casuali diverse
                    const page1 = Math.floor(Math.random() * 30) + 1;
                    let page2 = Math.floor(Math.random() * 30) + 1;
                    while (page2 === page1) {
                        page2 = Math.floor(Math.random() * 30) + 1;
                    }

                    const [results1, results2] = await Promise.all([
                        fetchAnimeBatch(page1),
                        fetchAnimeBatch(page2)
                    ]);

                    const allResults = [...results1, ...results2];
                    
                    // Rimuovi duplicati
                    const uniqueMap = new Map();
                    for (const anime of allResults) {
                        if (!uniqueMap.has(anime.id)) {
                            uniqueMap.set(anime.id, anime);
                        }
                    }

                    const uniqueAnime = Array.from(uniqueMap.values());
                    
                    // Filtra solo anime con dati completi e già usciti
                    const currentYear = new Date().getFullYear();
                    const filtered = uniqueAnime.filter(a => 
                        a.title &&
                        (a.title.romaji || a.title.english) &&
                        a.startDate &&
                        a.startDate.year &&
                        a.startDate.year <= currentYear &&
                        a.genres &&
                        a.genres.length > 0 &&
                        a.averageScore !== null &&
                        a.averageScore !== undefined &&
                        a.averageScore > 0 &&
                        a.episodes !== null &&
                        a.episodes !== undefined &&
                        a.episodes > 0
                    );

                    if (filtered.length < 10) {
                        throw new Error(`Solo ${filtered.length} anime validi trovati`);
                    }

                    state.animeCache = filtered;
                    state.isCacheFilled = true;
                    statusInfo.textContent = `✅ ${state.animeCache.length} anime in cache`;
                    return true;

                } catch (error) {
                    console.error('Errore fillCache:', error);
                    statusInfo.textContent = `⚠️ Errore: ${error.message}`;
                    
                    // Prova con una singola pagina di popolari come fallback
                    try {
                        statusInfo.textContent = '📡 Tentativo fallback...';
                        const fallbackResults = await fetchAnimeBatch(1);
                        const currentYear = new Date().getFullYear();
                        const filtered = fallbackResults.filter(a => 
                            a.title &&
                            (a.title.romaji || a.title.english) &&
                            a.startDate &&
                            a.startDate.year &&
                            a.startDate.year <= currentYear &&
                            a.genres &&
                            a.genres.length > 0 &&
                            a.averageScore !== null &&
                            a.averageScore !== undefined &&
                            a.averageScore > 0 &&
                            a.episodes !== null &&
                            a.episodes !== undefined &&
                            a.episodes > 0
                        );
                        if (filtered.length > 5) {
                            state.animeCache = filtered;
                            state.isCacheFilled = true;
                            statusInfo.textContent = `✅ ${state.animeCache.length} anime in cache (fallback)`;
                            return true;
                        }
                    } catch (e) {
                        console.error('Fallback fallito:', e);
                    }
                    
                    return false;
                }
            }

            // ----- OTTIENE ANIME CASUALI DALLA CACHE -----
            function getRandomAnime(count = 1) {
                if (state.animeCache.length === 0) return [];
                const shuffled = shuffleArray([...state.animeCache]);
                return shuffled.slice(0, Math.min(count, shuffled.length));
            }

            // ----- OTTIENE DISTRATTORI -----
            function getDistractors(targetId, count = 3) {
                if (state.animeCache.length === 0) return [];
                const filtered = state.animeCache.filter(a => a.id !== targetId);
                const shuffled = shuffleArray(filtered);
                return shuffled.slice(0, count);
            }

            // ----- NUOVO ROUND -----
            async function newRound() {
                if (state.isLoading) return;
                
                state.isLoading = true;
                state.isAnswered = false;
                resetBtn.disabled = true;
                skipBtn.disabled = true;
                optionsBtns.forEach(btn => btn.disabled = true);
                
                loadingIndicator.style.display = 'block';
                clueContainer.style.display = 'none';
                setMessage('🔄 Caricamento anime...', true);
                
                try {
                    // Se la cache è vuota, riempila
                    if (state.animeCache.length < 15) {
                        const success = await fillCache();
                        if (!success || state.animeCache.length === 0) {
                            throw new Error('Impossibile caricare gli anime. Riprova più tardi.');
                        }
                    }
                    
                    // Prendi target e distrattori
                    const target = getRandomAnime(1)[0];
                    if (!target) throw new Error('Nessun anime disponibile');
                    
                    let distractors = getDistractors(target.id, 3);
                    let options = [target, ...distractors];
                    
                    // Assicurati di avere 4 opzioni
                    while (options.length < 4) {
                        const extra = getRandomAnime(1);
                        if (extra.length > 0 && !options.some(o => o.id === extra[0].id)) {
                            options.push(extra[0]);
                        } else {
                            break;
                        }
                    }
                    options = shuffleArray(options).slice(0, 4);
                    
                    state.targetAnime = target;
                    state.options = options;
                    state.round++;
                    
                    // Mostra indizi
                    displayClues(target);
                    displayOptions(options);
                    
                    updateUI();
                    setMessage(`🔍 Round ${state.round}: Quale anime è?`, true);
                    
                    loadingIndicator.style.display = 'none';
                    clueContainer.style.display = 'block';
                    optionsBtns.forEach(btn => btn.disabled = false);
                    
                } catch (error) {
                    console.error('Errore newRound:', error);
                    setMessage(`⚠️ ${error.message}`, false);
                    loadingIndicator.textContent = `❌ ${error.message}`;
                }
                
                state.isLoading = false;
                resetBtn.disabled = false;
                skipBtn.disabled = false;
            }

            // ----- MOSTRA INDIZI -----
            function displayClues(anime) {
                yearValue.textContent = anime.startDate.year || 'N/D';
                genreValue.textContent = anime.genres ? anime.genres.slice(0, 4).join(', ') : 'N/D';
                scoreValue.textContent = anime.averageScore ? `${(anime.averageScore/10).toFixed(1)}/10` : 'N/D';
                episodesValue.textContent = anime.episodes || 'N/D';
            }

            // ----- MOSTRA OPZIONI -----
            function displayOptions(options) {
                optionsBtns.forEach((btn, i) => {
                    if (i < options.length) {
                        btn.textContent = getTitle(options[i]);
                        btn.dataset.id = options[i].id;
                        btn.className = 'option-btn';
                        btn.disabled = false;
                    } else {
                        btn.textContent = '-';
                        btn.dataset.id = '';
                        btn.className = 'option-btn';
                        btn.disabled = true;
                    }
                });
            }

            // ----- GESTISCI CLICK -----
            function handleOptionClick(index) {
                if (state.isAnswered || state.isLoading) return;
                if (index >= state.options.length) return;
                
                const selected = state.options[index];
                const isCorrect = selected.id === state.targetAnime.id;
                
                state.isAnswered = true;
                optionsBtns.forEach(btn => btn.disabled = true);
                
                optionsBtns.forEach((btn, i) => {
                    const id = parseInt(btn.dataset.id);
                    if (id === state.targetAnime.id) {
                        btn.classList.add('correct');
                    } else if (i === index && !isCorrect) {
                        btn.classList.add('wrong');
                    }
                });
                
                const targetTitle = getTitle(state.targetAnime);
                
                if (isCorrect) {
                    state.score += 10;
                    state.correctCount++;
                    setMessage(`✅ Esatto! Era "${targetTitle}". +10 punti!`, true);
                } else {
                    state.errors++;
                    state.score = Math.max(0, state.score - 3);
                    setMessage(`❌ Sbagliato! Era "${targetTitle}". -3 punti`, false);
                }
                
                updateUI();
                
                setTimeout(() => {
                    if (!state.isGameOver) {
                        newRound();
                    }
                }, 2500);
            }

            // ----- SALTA ROUND -----
            function skipRound() {
                if (state.isLoading || state.isAnswered) return;
                state.errors++;
                state.score = Math.max(0, state.score - 1);
                const targetTitle = getTitle(state.targetAnime);
                setMessage(`⏭️ Saltato! Era "${targetTitle}". -1 punto`, false);
                
                optionsBtns.forEach((btn) => {
                    const id = parseInt(btn.dataset.id);
                    if (id === state.targetAnime.id) {
                        btn.classList.add('correct');
                    }
                    btn.disabled = true;
                });
                state.isAnswered = true;
                updateUI();
                
                setTimeout(() => {
                    if (!state.isGameOver) {
                        newRound();
                    }
                }, 2000);
            }

            // ----- AGGIORNA UI -----
            function updateUI() {
                scoreDisplay.textContent = state.score;
                correctDisplay.textContent = state.correctCount;
                errorsDisplay.textContent = state.errors;
            }

            // ----- SET MESSAGE -----
            function setMessage(msg, isGood = true) {
                messageBox.innerHTML = `<span>${isGood ? '💡' : '⚠️'}</span> ${msg}`;
            }

            // ----- EVENTI -----
            optionsBtns.forEach((btn, i) => {
                btn.addEventListener('click', () => handleOptionClick(i));
            });

            resetBtn.addEventListener('click', () => {
                newRound();
            });

            skipBtn.addEventListener('click', skipRound);

            // ----- INIZIALIZZA -----
            (async function init() {
                await fillCache();
                await newRound();
            })();
        })();
    </script>
</body>
</html>
