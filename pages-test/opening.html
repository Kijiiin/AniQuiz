<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Anime Opening Quiz</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1e2f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f0f0f0;
            padding: 20px;
        }
        .container {
            background: rgba(30, 34, 56, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 30px;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 25px 50px -10px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.06);
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            text-align: center;
            color: #a0a6c7;
            font-size: 0.95rem;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 15px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            background: rgba(0,0,0,0.3);
            padding: 12px 20px;
            border-radius: 60px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .score {
            background: #4facfe;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 600;
            color: #fff;
            font-size: 1.1rem;
        }
        .question-counter { color: #b0b7d9; }
        .player-wrapper {
            width: 100%;
            padding: 10px 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Nascondiamo il video, ma lo teniamo per l'audio */
        #audioPlayer {
            display: none;
        }
        .audio-visual {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #4facfe, #1a1e2f);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.8rem;
            box-shadow: 0 0 40px rgba(79,172,254,0.3);
            transition: box-shadow 0.3s ease;
            margin: 0 auto 10px;
        }
        .audio-visual.playing {
            box-shadow: 0 0 80px rgba(245,87,108,0.5);
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        .now-playing {
            text-align: center;
            font-size: 0.95rem;
            color: #7a82aa;
            margin-top: 5px;
            min-height: 28px;
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .controls button {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 60px;
            color: #f0f0f0;
            font-size: 1.1rem;
            padding: 6px 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .controls button:hover:not(:disabled) {
            background: rgba(79,172,254,0.2);
            border-color: #4facfe;
            transform: scale(1.05);
        }
        .controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .controls .play-btn {
            min-width: 80px;
            justify-content: center;
        }
        .controls input[type="range"] {
            flex: 1;
            min-width: 80px;
            accent-color: #4facfe;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            -webkit-appearance: none;
            appearance: none;
        }
        .controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #4facfe;
            cursor: pointer;
        }
        .time-display {
            font-size: 0.8rem;
            color: #a0a6c7;
            min-width: 70px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 20px 0 10px;
        }
        .option-btn {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 16px 10px;
            color: #f0f0f0;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            text-align: center;
            word-break: break-word;
            line-height: 1.4;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .option-btn:hover:not(:disabled) {
            background: rgba(79,172,254,0.15);
            border-color: #4facfe;
            transform: scale(1.02);
        }
        .option-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .option-btn.correct {
            background: rgba(46,204,113,0.25);
            border-color: #2ecc71;
            box-shadow: 0 0 20px rgba(46,204,113,0.2);
        }
        .option-btn.wrong {
            background: rgba(231,76,60,0.25);
            border-color: #e74c3c;
            box-shadow: 0 0 20px rgba(231,76,60,0.2);
        }
        .next-btn {
            display: block;
            width: 100%;
            margin: 20px auto 0;
            padding: 18px 20px;
            background: linear-gradient(135deg, #f5576c, #4facfe);
            border: none;
            border-radius: 60px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 25px -5px rgba(245,87,108,0.4);
        }
        .next-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 12px 35px -5px rgba(79,172,254,0.5);
        }
        .next-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .feedback {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            margin: 10px 0 0;
            min-height: 30px;
            padding: 8px;
            border-radius: 40px;
            background: rgba(0,0,0,0.2);
        }
        .loader {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #4facfe;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        .error-msg {
            color: #f5576c;
            text-align: center;
            padding: 20px;
            background: rgba(245,87,108,0.1);
            border-radius: 30px;
            border: 1px solid rgba(245,87,108,0.2);
        }
        .start-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 30px auto;
            padding: 20px 30px;
            background: linear-gradient(135deg, #4facfe, #f5576c);
            border: none;
            border-radius: 60px;
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px -5px rgba(79,172,254,0.4);
        }
        .start-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 15px 40px -5px rgba(245,87,108,0.5);
        }
        .start-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        @media (max-width: 550px) {
            .container { padding: 20px 16px; }
            .options-grid { grid-template-columns: 1fr; gap: 10px; }
            .option-btn { min-height: 50px; padding: 14px; }
            .cover-image { width: 140px; height: 195px; }
            h1 { font-size: 1.8rem; }
            .controls { gap: 8px; }
            .controls button { font-size: 0.9rem; padding: 5px 12px; }
            .controls .play-btn { min-width: 60px; }
            .time-display { min-width: 60px; font-size: 0.7rem; }
            .start-btn { font-size: 1.2rem; padding: 16px 20px; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>🎵 Opening Quiz</h1>
    <div class="subtitle">Ascolta l'opening e indovina l'anime!</div>

    <div class="status-bar">
        <span class="question-counter" id="questionCounter">Domanda 1 / 10</span>
        <span class="score" id="scoreDisplay">🏆 0</span>
    </div>

    <div class="player-wrapper">
        <!-- Player audio (video nascosto) -->
        <video id="audioPlayer" preload="metadata"></video>

        <div class="audio-visual" id="audioVisual">🔊</div>
        <div class="now-playing" id="nowPlaying">🎶 Ascolta l'opening...</div>

        <div class="controls">
            <button id="seekBackBtn" title="Indietro 10s">⏪ -10</button>
            <button id="playPauseBtn" class="play-btn" disabled>▶️ Riproduci</button>
            <button id="seekForwardBtn" title="Avanti 10s">+10 ⏩</button>
            <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1" disabled>
            <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
        </div>
    </div>

    <div id="optionsContainer" class="options-grid"></div>
    <div id="feedback" class="feedback"></div>

    <button id="startBtn" class="start-btn">🎧 Inizia Quiz</button>
    <button id="nextBtn" class="next-btn" disabled>➡ Prossima domanda</button>
    <div id="loader" class="loader hidden"></div>
    <div id="errorMsg" class="error-msg hidden"></div>
</div>

<script>
    // ---------- CONFIG ----------
    const MAX_QUESTIONS = 10;
    const POOL_SIZE = 20;
    const GRAPHQL_URL = 'https://graphql.animethemes.moe/';

    // ---------- STATO ----------
    let currentQuestion = 0;
    let score = 0;
    let correctAnime = null;
    let currentOptions = [];
    let isAnswered = false;
    let isPlaying = false;
    let questionsQueue = [];
    let isLoading = false;

    // Elemento audio (video nascosto)
    const audio = document.getElementById('audioPlayer');
    let currentAudioUrl = null;

    // DOM refs
    const audioVisual = document.getElementById('audioVisual');
    const nowPlaying = document.getElementById('nowPlaying');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackDiv = document.getElementById('feedback');
    const nextBtn = document.getElementById('nextBtn');
    const startBtn = document.getElementById('startBtn');
    const loader = document.getElementById('loader');
    const errorMsg = document.getElementById('errorMsg');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const questionCounter = document.getElementById('questionCounter');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const seekBackBtn = document.getElementById('seekBackBtn');
    const seekForwardBtn = document.getElementById('seekForwardBtn');
    const progressBar = document.getElementById('progressBar');
    const timeDisplay = document.getElementById('timeDisplay');

    // ---------- UTILITY ----------
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function formatTime(seconds) {
        if (!seconds || isNaN(seconds)) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s.toString().padStart(2, '0')}`;
    }

    // ---------- API GRAPHQL ----------
    async function graphqlFetch(query, variables = {}) {
        const response = await fetch(GRAPHQL_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
            },
            body: JSON.stringify({ query, variables })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const json = await response.json();
        if (json.errors) {
            console.error('GraphQL errors:', json.errors);
            throw new Error(json.errors[0].message);
        }
        return json.data;
    }

    // ---------- OTTIENI PAGINA CASUALE ----------
    async function getRandomOpeningPool(count) {
        // 1. Ottieni il numero totale di temi OP
        const countQuery = `
            query {
                animethemePagination(first: 1, type: OP) {
                    paginatorInfo {
                        total
                        lastPage
                        perPage
                    }
                }
            }
        `;
        const countData = await graphqlFetch(countQuery);
        const lastPage = countData.animethemePagination.paginatorInfo.lastPage;

        if (!lastPage || lastPage === 0) {
            throw new Error('Nessun tema OP trovato.');
        }

        const randomPage = Math.floor(Math.random() * lastPage) + 1;

        // 2. Recupera i temi da quella pagina (con animethemeentries e videos)
        const fetchQuery = `
            query ($page: Int, $first: Int) {
                animethemePagination(page: $page, first: $first, type: OP) {
                    data {
                        id
                        type
                        sequence
                        anime {
                            id
                            title { romaji }
                        }
                        animethemeentries {
                            id
                            version
                            videos {
                                id
                                link
                                resolution
                            }
                        }
                    }
                }
            }
        `;
        const fetchData = await graphqlFetch(fetchQuery, { page: randomPage, first: count });
        const themes = fetchData.animethemePagination.data;

        // 3. Trasforma in oggetti utili
        const pool = [];
        for (const theme of themes) {
            if (!theme.anime) continue;
            if (!theme.animethemeentries || theme.animethemeentries.length === 0) continue;
            // Prendi la prima entry che ha video
            let videoLink = null;
            for (const entry of theme.animethemeentries) {
                if (entry.videos && entry.videos.length > 0) {
                    // Prendi il video con la risoluzione più alta
                    const sorted = entry.videos.sort((a, b) => (b.resolution || 0) - (a.resolution || 0));
                    videoLink = sorted[0].link;
                    break;
                }
            }
            if (!videoLink) continue;
            const name = theme.anime.title.romaji || 'Anime sconosciuto';
            pool.push({
                name: name,
                videoUrl: videoLink
            });
        }

        // Se la pool è troppo piccola, prova un'altra pagina
        if (pool.length < MAX_QUESTIONS + 3) {
            const extraPage = Math.floor(Math.random() * lastPage) + 1;
            const extraData = await graphqlFetch(fetchQuery, { page: extraPage, first: count });
            const extraThemes = extraData.animethemePagination.data;
            for (const theme of extraThemes) {
                if (!theme.anime) continue;
                if (!theme.animethemeentries || theme.animethemeentries.length === 0) continue;
                let videoLink = null;
                for (const entry of theme.animethemeentries) {
                    if (entry.videos && entry.videos.length > 0) {
                        const sorted = entry.videos.sort((a, b) => (b.resolution || 0) - (a.resolution || 0));
                        videoLink = sorted[0].link;
                        break;
                    }
                }
                if (!videoLink) continue;
                const name = theme.anime.title.romaji || 'Anime sconosciuto';
                if (!pool.some(p => p.name === name)) {
                    pool.push({
                        name: name,
                        videoUrl: videoLink
                    });
                }
            }
        }

        shuffleArray(pool);
        return pool;
    }

    // ---------- PREPARAZIONE DOMANDE ----------
    async function prepareQuestions() {
        let pool = await getRandomOpeningPool(POOL_SIZE);

        if (pool.length < MAX_QUESTIONS + 3) {
            throw new Error(`Pool troppo piccola (${pool.length}). Servono almeno ${MAX_QUESTIONS + 3} anime.`);
        }

        shuffleArray(pool);

        const corrects = pool.slice(0, MAX_QUESTIONS);
        questionsQueue = [];
        const usedCorrectNames = new Set();

        for (let i = 0; i < corrects.length; i++) {
            const correct = corrects[i];
            usedCorrectNames.add(correct.name);

            const available = pool.filter(item => item.name !== correct.name && !usedCorrectNames.has(item.name));
            shuffleArray(available);
            let distractors = available.slice(0, 3);
            if (distractors.length < 3) {
                const extra = pool.filter(item => item.name !== correct.name && !distractors.some(d => d.name === item.name));
                shuffleArray(extra);
                const needed = 3 - distractors.length;
                distractors = distractors.concat(extra.slice(0, needed));
            }

            const optionNames = [correct.name, ...distractors.map(d => d.name)];
            shuffleArray(optionNames);

            questionsQueue.push({
                anime: correct,
                options: optionNames
            });
        }

        shuffleArray(questionsQueue);

        currentQuestion = 0;
        score = 0;
        updateScoreAndCounter();
        loadQuestion();
    }

    // ---------- CARICA DOMANDA ----------
    function loadQuestion() {
        if (currentQuestion >= questionsQueue.length) {
            feedbackDiv.innerHTML = `🎉 Complimenti! Hai completato il quiz. Punteggio: ${score}/${questionsQueue.length}`;
            optionsContainer.innerHTML = '';
            nextBtn.disabled = true;
            audioVisual.className = 'audio-visual';
            nowPlaying.textContent = '🏁 Quiz finito!';
            audio.pause();
            audio.src = '';
            playPauseBtn.disabled = true;
            seekBackBtn.disabled = true;
            seekForwardBtn.disabled = true;
            progressBar.disabled = true;
            startBtn.classList.remove('hidden');
            return;
        }

        const q = questionsQueue[currentQuestion];
        correctAnime = q.anime;
        currentOptions = q.options;
        currentAudioUrl = q.anime.videoUrl;
        isAnswered = false;

        updateScoreAndCounter();
        feedbackDiv.innerHTML = '';
        nextBtn.disabled = true;

        // Carica l'audio (video nascosto)
        audio.src = currentAudioUrl;
        audio.load();
        audio.currentTime = 0;
        playPauseBtn.disabled = false;
        playPauseBtn.textContent = '▶️ Riproduci';
        seekBackBtn.disabled = false;
        seekForwardBtn.disabled = false;
        progressBar.disabled = false;
        progressBar.value = 0;
        timeDisplay.textContent = '0:00 / 0:00';

        audioVisual.className = 'audio-visual';
        audioVisual.textContent = '⏳';
        nowPlaying.textContent = '🎵 Caricamento audio...';

        // Eventi audio
        audio.onloadedmetadata = () => {
            nowPlaying.textContent = '🎵 Pronto per la riproduzione';
            audioVisual.textContent = '▶️';
        };

        audio.ontimeupdate = () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = percent;
                timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
            }
        };

        audio.onplay = () => {
            isPlaying = true;
            audioVisual.className = 'audio-visual playing';
            audioVisual.textContent = '🔊';
            nowPlaying.textContent = `🎵 Ascolta l'opening...`;
            playPauseBtn.textContent = '⏸️ Pausa';
        };

        audio.onpause = () => {
            isPlaying = false;
            audioVisual.className = 'audio-visual';
            audioVisual.textContent = '⏸️';
            playPauseBtn.textContent = '▶️ Riproduci';
        };

        audio.onended = () => {
            isPlaying = false;
            audioVisual.className = 'audio-visual';
            audioVisual.textContent = '⏹️';
            playPauseBtn.textContent = '▶️ Riproduci';
        };

        audio.onerror = (e) => {
            console.error('Errore audio:', e);
            feedbackDiv.innerHTML = '⚠️ Errore nel caricamento dell\'audio. Passa alla prossima domanda.';
            feedbackDiv.style.color = '#f39c12';
            if (!isAnswered) {
                nextBtn.disabled = false;
                nextBtn.textContent = '⏭️ Salta domanda';
            }
            audioVisual.className = 'audio-visual';
            audioVisual.textContent = '🚫';
            nowPlaying.textContent = '⛔ Audio non disponibile';
            playPauseBtn.disabled = true;
            seekBackBtn.disabled = true;
            seekForwardBtn.disabled = true;
            progressBar.disabled = true;
        };

        renderOptions(q.options);
    }

    // ---------- CONTROLLI ----------
    function togglePlayPause() {
        if (audio.paused) {
            audio.play().catch(e => console.warn('Autoplay bloccato:', e));
        } else {
            audio.pause();
        }
    }

    function seekBy(seconds) {
        audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + seconds));
    }

    // ---------- RENDER OPZIONI ----------
    function renderOptions(options) {
        optionsContainer.innerHTML = '';
        options.forEach((optionName, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = optionName;
            btn.dataset.index = index;
            btn.addEventListener('click', () => handleOptionClick(index));
            optionsContainer.appendChild(btn);
        });
    }

    // ---------- GESTIONE CLICK ----------
    function handleOptionClick(index) {
        if (isAnswered || isLoading) return;
        isAnswered = true;

        const selectedName = currentOptions[index];
        const isCorrect = selectedName === correctAnime.name;

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, i) => {
            btn.disabled = true;
            if (currentOptions[i] === correctAnime.name) {
                btn.classList.add('correct');
            } else if (i === index && !isCorrect) {
                btn.classList.add('wrong');
            }
        });

        if (isCorrect) {
            score++;
            feedbackDiv.innerHTML = '✅ Corretto! +1 punto';
            feedbackDiv.style.color = '#2ecc71';
        } else {
            feedbackDiv.innerHTML = `❌ Sbagliato! Era "${correctAnime.name}"`;
            feedbackDiv.style.color = '#e74c3c';
        }

        updateScoreAndCounter();
        nextBtn.disabled = false;
        nextBtn.textContent = '➡ Prossima domanda';
    }

    // ---------- PROSSIMA DOMANDA ----------
    function goToNextQuestion() {
        if (isLoading) return;
        audio.pause();
        currentQuestion++;
        if (currentQuestion < questionsQueue.length) {
            loadQuestion();
        } else {
            loadQuestion();
        }
    }

    // ---------- UI ----------
    function updateScoreAndCounter() {
        scoreDisplay.textContent = `🏆 ${score}`;
        const total = questionsQueue.length || MAX_QUESTIONS;
        questionCounter.textContent = `Domanda ${Math.min(currentQuestion + 1, total)} / ${total}`;
    }

    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.remove('hidden');
        loader.classList.add('hidden');
        nextBtn.disabled = true;
        playPauseBtn.disabled = true;
        seekBackBtn.disabled = true;
        seekForwardBtn.disabled = true;
        progressBar.disabled = true;
        startBtn.disabled = false;
        startBtn.textContent = '🎧 Inizia Quiz';
    }

    function hideError() {
        errorMsg.classList.add('hidden');
    }

    // ---------- AVVIA ----------
    async function startGame() {
        hideError();
        startBtn.disabled = true;
        startBtn.textContent = '⏳ Caricamento...';
        loader.classList.remove('hidden');
        nextBtn.disabled = true;
        optionsContainer.innerHTML = '';
        feedbackDiv.innerHTML = '';
        playPauseBtn.disabled = true;
        seekBackBtn.disabled = true;
        seekForwardBtn.disabled = true;
        progressBar.disabled = true;
        audio.pause();
        audio.src = '';

        try {
            await prepareQuestions();
            loader.classList.add('hidden');
            startBtn.classList.add('hidden');
            if (questionsQueue.length > 0) {
                loadQuestion();
            } else {
                showError('Nessuna domanda disponibile. Riprova più tardi.');
            }
        } catch (e) {
            loader.classList.add('hidden');
            showError(e.message || 'Errore durante il caricamento.');
        }
    }

    // ---------- EVENTI ----------
    nextBtn.addEventListener('click', goToNextQuestion);
    playPauseBtn.addEventListener('click', togglePlayPause);
    seekBackBtn.addEventListener('click', () => seekBy(-10));
    seekForwardBtn.addEventListener('click', () => seekBy(10));

    progressBar.addEventListener('input', (e) => {
        if (audio.duration) {
            const time = (e.target.value / 100) * audio.duration;
            audio.currentTime = time;
        }
    });

    startBtn.addEventListener('click', startGame);

    console.log('🎵 Anime Opening Quiz caricato! Premi "Inizia Quiz" per giocare.');
</script>
</body>
</html>
