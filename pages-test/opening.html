        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }
        .subtitle {
            text-align: center;
            color: #a0a6c7;
            font-size: 0.95rem;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 15px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            background: rgba(0,0,0,0.3);
            padding: 12px 20px;
            border-radius: 60px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .score {
            background: #4facfe;

            font-weight: 600;
            color: #fff;
            font-size: 1.1rem;
        }
        .question-counter { color: #b0b7d9; }
        .player-wrapper {
            position: relative;
            width: 100%;
            padding: 10px 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #youtube-player-container {
            width: 0;
            height: 0;
            opacity: 0;
            pointer-events: none;
            position: absolute;
        }
        .audio-visual {
            width: 120px;
            height: 120px;

            margin: 0 auto 10px;

        .audio-visual.playing {
            box-shadow: 0 0 80px rgba(245,87,108,0.5);

        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        .now-playing {
            text-align: center;
            font-size: 0.95rem;
            color: #7a82aa;
            margin-top: 5px;
            min-height: 28px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;

        .controls button {
            background: rgba(255,255,255,0.07);

        }

            display: block;

            padding: 20px 30px;

            border-radius: 60px;

            opacity: 0.6;

        }
        @media (max-width: 550px) {

            .option-btn { min-height: 50px; padding: 14px; }

            .controls { gap: 10px; flex-wrap: wrap; }
            .controls button { font-size: 1rem; padding: 6px 14px; }
            .controls .play-btn { min-width: 70px; }
            .start-btn { font-size: 1.2rem; padding: 16px 20px; }
        }
    </style>
</head>

        { id: 12, title: { romaji: "Mob Psycho 100" }, coverImage: { large: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx97941-mGJ6QQ3jIdOH.jpg" }, videoId: "2PZ4gSsiwN0" },
        { id: 13, title: { romaji: "Violet Evergarden" }, coverImage: { large: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx97679-P6wRoT8Mf9VX.jpg" }, videoId: "o2f5tD1KyrM" },
        { id: 14, title: { romaji: "Re:Zero" }, coverImage: { large: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx21385-c2snYbfT3MUB.jpg" }, videoId: "2M6D4I7i5GI" },
        { id: 15, title: { romaji: "Haikyuu!!" }, coverImage: { large: "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx20583-1M5h9nCJzBwR.jpg" }, videoId: "m1s6u-5quL0" }
    ];

    // ---------- STATO ----------
    let animeList = [];
    let currentQuestion = 0;
    let score = 0;
    let correctAnime = null;
    let currentOptions = [];
    let isAnswered = false;
    let isPlaying = false;
    let questionsQueue = [];
    let isLoading = false;
    let consecutive429 = 0;
    let usingFallback = false;

    // YouTube player
    let ytPlayer = null;
    let currentVideoId = null;
    let playerReady = false;
    let isPaused = false;
    let pendingVideoId = null;
    let playerErrorCount = 0;
    let playerReadyTimeout = null;

    // DOM refs
    const audioVisual = document.getElementById('audioVisual');
    const nowPlaying = document.getElementById('nowPlaying');
    const coverImage = document.getElementById('coverImage');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackDiv = document.getElementById('feedback');
    const nextBtn = document.getElementById('nextBtn');
    const startBtn = document.getElementById('startBtn');
    const loader = document.getElementById('loader');
    const errorMsg = document.getElementById('errorMsg');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const questionCounter = document.getElementById('questionCounter');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const seekBackBtn = document.getElementById('seekBackBtn');
    const seekForwardBtn = document.getElementById('seekForwardBtn');

    // ---------- FUNZIONI ----------
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function getAnimeTitle(anime) {
        return anime.title.romaji || anime.title.english || anime.title.native || 'Anime sconosciuto';
    }

    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    // ---------- CACHE ----------
    function getCache() {
        try {
            const raw = localStorage.getItem(CACHE_KEY);
            if (!raw) return {};
            const data = JSON.parse(raw);
            if (Date.now() - data.timestamp > CACHE_DURATION) {
                localStorage.removeItem(CACHE_KEY);
                return {};
            }
            return data.map || {};
        } catch { return {}; }
    }

    function setCache(map) {
        try {
            localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), map }));
        } catch {}
    }

    // ---------- API ----------
    async function fetchAnimeList() {
        const query = `
            query ($page: Int, $perPage: Int) {
                Page(page: $page, perPage: $perPage) {
                    media(sort: POPULARITY_DESC, type: ANIME, isAdult: false) {
                        id
                        title { romaji english native }
                        coverImage { large }
                    }
                }
            }
        `;
        const variables = { page: 1, perPage: 50 };
        try {
            const response = await fetch(ANILIST_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ query, variables })
            });
            const json = await response.json();
            if (json.errors) throw new Error(json.errors[0].message);
            return json.data.Page.media;
        } catch (e) {
            console.error('Errore Anilist:', e);
            return null;
        }
    }

    async function searchYouTubeOpening(anime, cache) {
        const title = getAnimeTitle(anime);
        if (cache[title]) return cache[title];

        const query = `${title} opening`;
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=5&key=${YOUTUBE_API_KEY}`;

        let retries = 0;
        let backoff = 3000;
        while (retries <= MAX_RETRIES) {
            try {
                const response = await fetch(url);
                if (response.status === 429) {
                    consecutive429++;
                    console.warn(`Rate limit per "${title}", attesa ${backoff}ms...`);
                    await sleep(backoff);
                    backoff *= 2;
                    retries++;
                    continue;
                }
                consecutive429 = 0;
                if (!response.ok) return null;
                const data = await response.json();
                if (data.items && data.items.length > 0) {
                    const video = data.items.find(item => {
                        const snippet = item.snippet || {};
                        const desc = snippet.description ? snippet.description.toLowerCase() : '';
                        const titleLower = snippet.title ? snippet.title.toLowerCase() : '';
                        return !desc.includes('trailer') && !desc.includes('amv') &&
                               !titleLower.includes('trailer') && !titleLower.includes('amv') &&
                               !titleLower.includes('preview') && !titleLower.includes('clip');
                    }) || data.items[0];
                    if (video.id && video.id.videoId) {
                        const videoId = video.id.videoId;
                        cache[title] = videoId;
                        return videoId;
                    }
                }
                return null;
            } catch (e) {
                console.warn(`Errore per "${title}":`, e);
                retries++;
                await sleep(backoff);
                backoff *= 2;
            }
        }
        return null;
    }

    // ---------- PREPARAZIONE DOMANDE ----------
    async function prepareQuestions() {
        let fetched = await fetchAnimeList();
        if (fetched && fetched.length >= 10) {
            animeList = fetched;
            shuffleArray(animeList);
        } else {
            animeList = [];
            usingFallback = true;
        }

        const cache = getCache();
        questionsQueue = [];
        const usedIndices = new Set();
        let attempts = 0;
        const maxAttempts = animeList.length > 0 ? animeList.length * 2 : FALLBACK_ANIME.length * 2;

        if (animeList.length > 0) {
            while (questionsQueue.length < MAX_QUESTIONS && attempts < maxAttempts && consecutive429 < CONSECUTIVE_429_LIMIT) {
                attempts++;
                const idx = Math.floor(Math.random() * animeList.length);
                if (usedIndices.has(idx)) continue;
                usedIndices.add(idx);

                const candidate = animeList[idx];
                const videoId = await searchYouTubeOpening(candidate, cache);
                await sleep(REQUEST_DELAY);

                if (!videoId) {
                    usedIndices.delete(idx);
                    continue;
                }

                const distractors = [];
                const available = animeList.filter((_, i) => !usedIndices.has(i) && i !== idx);
                shuffleArray(available);
                for (let i = 0; i < 3 && i < available.length; i++) {
                    distractors.push(available[i]);
                }
                if (distractors.length < 3) {
                    usedIndices.delete(idx);
                    continue;
                }

                const options = [candidate, ...distractors];
                shuffleArray(options);
                questionsQueue.push({
                    anime: candidate,
                    videoId: videoId,
                    options: options
                });
            }
        }

        if (questionsQueue.length < MAX_QUESTIONS || consecutive429 >= CONSECUTIVE_429_LIMIT) {
            console.warn('Passaggio al fallback.');
            usingFallback = true;
            const fallbackShuffled = shuffleArray([...FALLBACK_ANIME]);
            const fallbackUsed = new Set();
            for (const candidate of fallbackShuffled) {
                if (fallbackUsed.has(candidate.id)) continue;
                fallbackUsed.add(candidate.id);
                const others = FALLBACK_ANIME.filter(a => a.id !== candidate.id && !fallbackUsed.has(a.id));
                shuffleArray(others);
                const distractors = others.slice(0, 3);
                if (distractors.length < 3) continue;
                const options = [candidate, ...distractors];
                shuffleArray(options);
                questionsQueue.push({
                    anime: candidate,
                    videoId: candidate.videoId,
                    options: options
                });
                if (questionsQueue.length >= MAX_QUESTIONS) break;
            }
        }

        setCache(cache);

        if (questionsQueue.length === 0) {
            throw new Error('Impossibile preparare domande.');
        }

        if (questionsQueue.length > MAX_QUESTIONS) {
            questionsQueue = questionsQueue.slice(0, MAX_QUESTIONS);
        }

        currentQuestion = 0;
        score = 0;
        updateScoreAndCounter();
        loadQuestion();

        if (usingFallback) {
            feedbackDiv.innerHTML = 'ℹ️ Utilizzo una lista di backup per garantire il quiz (limite API YouTube raggiunto).';
            feedbackDiv.style.color = '#f39c12';
        }
    }

    // ---------- PLAYER ----------
    function onYouTubeIframeAPIReady() {
        // Aggiungiamo l'origin esplicitamente per evitare errori di postMessage
        ytPlayer = new YT.Player('youtube-player-container', {
            height: '0',
            width: '0',
            playerVars: {
                controls: 0,
                disablekb: 1,
                modestbranding: 1,
                rel: 0,
                showinfo: 0,
                loop: 0,
                autoplay: 0,
                mute: 0,
                origin: window.location.origin, // IMPORTANTE: imposta l'origine corretta
            },
            events: {
                onReady: onPlayerReady,
                onStateChange: onPlayerStateChange,
                onError: onPlayerError,
            }
        });

        // Timeout per il caricamento del player
        if (playerReadyTimeout) clearTimeout(playerReadyTimeout);
        playerReadyTimeout = setTimeout(() => {
            if (!playerReady) {
                console.warn('Player YouTube non pronto dopo 10 secondi.');
                nowPlaying.textContent = '⚠️ Player in ritardo, riprova tra poco.';
                // Non blocchiamo il gioco: possiamo abilitare il pulsante "Salta" se la domanda è già visualizzata
                if (!isAnswered && currentQuestion < questionsQueue.length) {
                    nextBtn.disabled = false;
                    nextBtn.textContent = '⏭️ Salta (player non caricato)';
                }
            }
        }, 10000);
    }

    function onPlayerReady(event) {
        playerReady = true;
        if (playerReadyTimeout) {
            clearTimeout(playerReadyTimeout);
            playerReadyTimeout = null;
        }
        if (pendingVideoId) {
            const vid = pendingVideoId;
            pendingVideoId = null;
            ytPlayer.loadVideoById(vid);
        } else if (currentVideoId) {
            ytPlayer.loadVideoById(currentVideoId);
        }
    }

    function onPlayerStateChange(event) {
        const state = event.data;
        if (state === YT.PlayerState.PLAYING) {
            isPlaying = true;
            isPaused = false;
            audioVisual.className = 'audio-visual playing';
            audioVisual.textContent = '🔊';
            nowPlaying.textContent = '🎵 Ascolta l\'opening...';
            playPauseBtn.textContent = '⏸️ Pausa';
            playPauseBtn.disabled = false;
            seekBackBtn.disabled = false;
            seekForwardBtn.disabled = false;
        } else if (state === YT.PlayerState.PAUSED) {
            isPlaying = false;
            isPaused = true;
            audioVisual.className = 'audio-visual';
            audioVisual.textContent = '⏸️';
            playPauseBtn.textContent = '▶️ Riproduci';
        } else if (state === YT.PlayerState.ENDED) {
            isPlaying = false;
            isPaused = true;
            audioVisual.className = 'audio-visual';
            audioVisual.textContent = '⏹️';
            playPauseBtn.textContent = '▶️ Riproduci';
        } else if (state === YT.PlayerState.UNSTARTED) {
            playPauseBtn.disabled = false;
            playPauseBtn.textContent = '▶️ Riproduci';
            nowPlaying.textContent = '🎵 Pronto per la riproduzione';
        }
    }

    function onPlayerError(event) {
        console.error('Errore YouTube:', event.data);
        playerErrorCount++;
        if (event.data === 150 || event.data === 101) {
            feedbackDiv.innerHTML = '⚠️ Questo video non è riproducibile. Passa alla prossima domanda.';
            feedbackDiv.style.color = '#f39c12';
            if (!isAnswered) {
                nextBtn.disabled = false;
                nextBtn.textContent = '⏭️ Salta domanda';
            }
            audioVisual.className = 'audio-visual';
            audioVisual.textContent = '🚫';
            nowPlaying.textContent = '⛔ Video non disponibile';
            playPauseBtn.disabled = true;
            seekBackBtn.disabled = true;
            seekForwardBtn.disabled = true;
        } else {
            if (playerErrorCount < 3) {
                setTimeout(() => {
                    if (ytPlayer && playerReady && currentVideoId) {
                        ytPlayer.loadVideoById(currentVideoId);
                    }
                }, 2000);
                feedbackDiv.innerHTML = '⏳ Errore temporaneo, riprovo...';
            } else {
                feedbackDiv.innerHTML = '❌ Errore persistente. Salta la domanda.';
                feedbackDiv.style.color = '#e74c3c';
                if (!isAnswered) {
                    nextBtn.disabled = false;
                    nextBtn.textContent = '⏭️ Salta domanda';
                }
            }
        }
    }

    // ---------- CARICA DOMANDA ----------
    function loadQuestion() {
        if (currentQuestion >= questionsQueue.length) {
            feedbackDiv.innerHTML = `🎉 Complimenti! Hai completato il quiz. Punteggio: ${score}/${questionsQueue.length}`;
            optionsContainer.innerHTML = '';
            nextBtn.disabled = true;
            audioVisual.className = 'audio-visual';
            nowPlaying.textContent = '🏁 Quiz finito!';
            coverImage.style.display = 'none';
            playPauseBtn.disabled = true;
            seekBackBtn.disabled = true;
            seekForwardBtn.disabled = true;
            if (ytPlayer) ytPlayer.stopVideo();
            startBtn.classList.remove('hidden');
            return;
        }

        const q = questionsQueue[currentQuestion];
        correctAnime = q.anime;
        currentOptions = q.options;
        currentVideoId = q.videoId;
        isAnswered = false;
        isPaused = false;
        playerErrorCount = 0;

        updateScoreAndCounter();
        feedbackDiv.innerHTML = '';
        nextBtn.disabled = true;
        coverImage.style.display = 'none';

        playPauseBtn.disabled = true;
        seekBackBtn.disabled = true;
        seekForwardBtn.disabled = true;
        playPauseBtn.textContent = '⏳ Caricamento...';

        if (ytPlayer && playerReady) {
            ytPlayer.loadVideoById(q.videoId);
            audioVisual.className = 'audio-visual';
            audioVisual.textContent = '⏳';
            nowPlaying.textContent = '🎵 Caricamento video...';
        } else {
            pendingVideoId = q.videoId;
            nowPlaying.textContent = '🎶 Attivazione player...';
        }

        renderOptions(q.options);
    }

    function renderOptions(options) {
        optionsContainer.innerHTML = '';
        options.forEach((anime, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = getAnimeTitle(anime);
            btn.dataset.index = index;
            btn.addEventListener('click', () => handleOptionClick(index));
            optionsContainer.appendChild(btn);
        });
    }

    function handleOptionClick(index) {
        if (isAnswered || isLoading) return;
        isAnswered = true;

        const selectedAnime = currentOptions[index];
        const isCorrect = selectedAnime.id === correctAnime.id;

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, i) => {
            btn.disabled = true;
            const anime = currentOptions[i];
            if (anime.id === correctAnime.id) {
                btn.classList.add('correct');
            } else if (i === index && !isCorrect) {
                btn.classList.add('wrong');
            }
        });

        if (isCorrect) {
            score++;
            feedbackDiv.innerHTML = '✅ Corretto! +1 punto';
            feedbackDiv.style.color = '#2ecc71';
        } else {
            feedbackDiv.innerHTML = `❌ Sbagliato! Era "${getAnimeTitle(correctAnime)}"`;
            feedbackDiv.style.color = '#e74c3c';
        }

        updateScoreAndCounter();

        if (correctAnime.coverImage && correctAnime.coverImage.large) {
            coverImage.src = correctAnime.coverImage.large;
            coverImage.style.display = 'block';
        }

        nextBtn.disabled = false;
        nextBtn.textContent = '➡ Prossima domanda';
    }

    function goToNextQuestion() {
        if (isLoading) return;
        currentQuestion++;
        if (currentQuestion < questionsQueue.length) {
            loadQuestion();
        } else {
            loadQuestion();
        }
    }

    // ---------- CONTROLLI ----------
    function togglePlayPause() {
        if (!ytPlayer || !playerReady) return;
        if (isPaused || !isPlaying) {
            ytPlayer.playVideo();
        } else {
            ytPlayer.pauseVideo();
        }
    }

    function seekBy(seconds) {
        if (!ytPlayer || !playerReady) return;
        const currentTime = ytPlayer.getCurrentTime();
        const newTime = Math.max(0, currentTime + seconds);
        ytPlayer.seekTo(newTime, true);
    }

    // ---------- UI ----------
    function updateScoreAndCounter() {
        scoreDisplay.textContent = `🏆 ${score}`;
        const total = questionsQueue.length || MAX_QUESTIONS;
        questionCounter.textContent = `Domanda ${Math.min(currentQuestion + 1, total)} / ${total}`;
    }

    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.remove('hidden');
        loader.classList.add('hidden');
        nextBtn.disabled = true;
        playPauseBtn.disabled = true;
        seekBackBtn.disabled = true;
        seekForwardBtn.disabled = true;
        startBtn.disabled = false;
        startBtn.textContent = '🎧 Inizia Quiz';
    }

    function hideError() {
        errorMsg.classList.add('hidden');
    }

    // ---------- START ----------
    async function startGame() {
        hideError();
        startBtn.disabled = true;
        startBtn.textContent = '⏳ Caricamento...';
        loader.classList.remove('hidden');
        nextBtn.disabled = true;
        optionsContainer.innerHTML = '';
        feedbackDiv.innerHTML = '';
        playPauseBtn.disabled = true;
        seekBackBtn.disabled = true;
        seekForwardBtn.disabled = true;
        consecutive429 = 0;
        usingFallback = false;

        try {
            await prepareQuestions();
            loader.classList.add('hidden');
            startBtn.classList.add('hidden');
            if (questionsQueue.length > 0) {
                loadQuestion();
            } else {
                showError('Nessuna domanda disponibile. Riprova più tardi.');
            }
        } catch (e) {
            loader.classList.add('hidden');
            showError(e.message || 'Errore durante il caricamento.');
        }
    }

    // ---------- EVENTI ----------
    nextBtn.addEventListener('click', goToNextQuestion);
    playPauseBtn.addEventListener('click', togglePlayPause);
    seekBackBtn.addEventListener('click', () => seekBy(-10));
    seekForwardBtn.addEventListener('click', () => seekBy(10));
    startBtn.addEventListener('click', startGame);

    // ---------- INIZIALIZZAZIONE PLAYER ----------
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
    if (typeof YT !== 'undefined' && YT.loaded) {
        onYouTubeIframeAPIReady();
    }

    // Fallback se l'API non si carica
    setTimeout(() => {
        if (!ytPlayer) {
            if (typeof YT !== 'undefined' && YT.Player) {
                onYouTubeIframeAPIReady();
            } else {
                console.warn('YouTube API non caricata. Verifica ad blocker.');
                nowPlaying.textContent = '⚠️ Player YouTube non caricato. Disabilita ad blocker.';
            }
        }
    }, 5000);
</script>
</body>
</html>
