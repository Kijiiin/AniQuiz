<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniQuiz - Indovina Chi Multiplayer</title>
    <!-- ... (TUTTO IL CSS RIMANE IDENTICO AL PRECEDENTE) ... -->
</head>
<body>
    <div class="container">
        <!-- ... (TUTTO L'HTML RIMANE IDENTICO) ... -->
    </div>

    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script>
        // ICE_SERVERS (rimangono uguali)
        const ICE_SERVERS = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' },
                { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
            ]
        };

        const GameState = {
            players: [],
            currentPlayerId: null,
            myId: null,
            myName: '',
            round: 1,
            boardCharacters: [],
            myCharacter: null,
            opponentCharacter: null,
            isMyTurn: false,
            gameStarted: false,
            ready: false,
            opponentReady: false,
            peer: null,
            connection: null,
            isHost: false,
            peerId: null,
            pingInterval: null,
            pongTimeout: null,
            intentionalDisconnect: false,
            charactersLoaded: false,
            connectionTimeout: null,
            forceOpenTimeout: null  // nuovo campo per timeout di forzatura
        };

        let toastTimeout = null;
        let debugVisible = false;
        let selectedCharacterId = null;

        // Tutte le funzioni di utilità (showToast, addLog, showScreen, etc.) rimangono ESATTAMENTE UGUALI
        // Le copio per completezza ma sono identiche a prima
        // ============================================
        // TOAST & DEBUG
        // ============================================
        function showToast(message, type = 'info', duration = 4000) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.remove('hidden');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.add('hidden'); }, duration);
        }

        function toggleDebug() {
            debugVisible = !debugVisible;
            document.getElementById('debugLog').style.display = debugVisible ? 'block' : 'none';
        }

        function addLog(message, type = 'info') {
            const container = document.getElementById('logEntries');
            if (!container) return;
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
            console.log(`[AniQuiz] ${message}`);
        }

        // ============================================
        // UI HELPERS (identiche)
        // ============================================
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showStatus(message, type = 'info') {
            const el = document.getElementById('statusMessage');
            if (!el) return;
            el.textContent = message;
            el.className = `status-message ${type}`;
            el.classList.remove('hidden');
        }

        function hideStatus() {
            const el = document.getElementById('statusMessage');
            if (el) el.classList.add('hidden');
        }

        function addChatMessage(type, sender, message) {
            const chatBox = document.getElementById('chatBox');
            if (!chatBox) return;
            const div = document.createElement('div');
            div.className = `chat-message ${type}`;
            const time = new Date().toLocaleTimeString();
            if (type === 'system') {
                div.innerHTML = `<span class="sender">📢</span> ${message}`;
            } else if (type === 'me') {
                div.innerHTML = `<span class="sender">👤 Tu</span> <span class="time">${time}</span><br>${message}`;
            } else {
                div.innerHTML = `<span class="sender">👤 ${sender}</span> <span class="time">${time}</span><br>${message}`;
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function updatePlayersList() {
            const container = document.getElementById('playersList');
            if (!container) return;
            container.innerHTML = GameState.players.map(p => `
                <div class="player-badge ${p.id === GameState.myId ? 'active' : ''}">
                    ${p.name} <span class="score">⭐ ${p.score || 0}</span>
                    ${p.id === GameState.myId ? ' (Tu)' : ''}
                    ${p.id === GameState.currentPlayerId ? ' 🎯' : ''}
                </div>
            `).join('');
            updateReadyButton();
            const current = GameState.players.find(p => p.id === GameState.currentPlayerId);
            const indicator = document.getElementById('turnIndicator');
            if (indicator) {
                if (GameState.currentPlayerId === GameState.myId) {
                    indicator.className = 'turn-indicator my-turn';
                    indicator.textContent = '🎯 Il tuo turno!';
                    GameState.isMyTurn = true;
                } else {
                    indicator.className = 'turn-indicator other-turn';
                    indicator.textContent = `🎯 Turno: ${current ? current.name : '-'}`;
                    GameState.isMyTurn = false;
                }
            }
            const controls = document.getElementById('gameControls');
            if (controls) controls.style.display = GameState.gameStarted ? 'block' : 'none';
            const roundInfo = document.getElementById('roundInfo');
            if (roundInfo) roundInfo.textContent = `🎯 Round ${GameState.round}`;
        }

        function updateCharacters() {
            if (GameState.myCharacter) {
                document.getElementById('myCharName').textContent = `${GameState.myCharacter.emoji || '🎭'} ${GameState.myCharacter.name}`;
                document.getElementById('myCharDetails').textContent = `📺 ${GameState.myCharacter.anime || 'Sconosciuto'}`;
                document.getElementById('myCharacterCard').classList.remove('hidden');
            }
            if (GameState.opponentCharacter) {
                document.getElementById('opponentCharName').textContent = `${GameState.opponentCharacter.emoji || '❓'} ${GameState.opponentCharacter.name}`;
                document.getElementById('opponentCharDetails').textContent = `📺 ${GameState.opponentCharacter.anime || 'Sconosciuto'}`;
                document.getElementById('opponentCharacterCard').classList.remove('hidden');
            }
        }

        function updateConnectionStatus(status, message) {
            const el = document.getElementById('connectionStatus');
            if (!el) return;
            el.className = `connection-status ${status}`;
            el.innerHTML = `<span class="dot"></span> ${message || status}`;
        }

        function updateReadyButton() {
            const readyBtn = document.getElementById('readyBtn');
            if (!readyBtn) return;
            if (GameState.gameStarted) { readyBtn.disabled = true; return; }
            let canBeReady = selectedCharacterId !== null;
            if (GameState.isHost) {
                const otherPlayers = GameState.players.filter(p => p.id !== GameState.myId);
                canBeReady = canBeReady && otherPlayers.length > 0;
            }
            readyBtn.disabled = !canBeReady;
        }

        // ============================================
        // SHARE
        // ============================================
        function copyPeerId() {
            const id = document.getElementById('myPeerId').textContent;
            if (navigator.clipboard) navigator.clipboard.writeText(id).then(() => showToast('✅ Codice copiato!', 'success'));
        }

        function shareViaWhatsApp() {
            const id = document.getElementById('myPeerId').textContent;
            window.open(`https://wa.me/?text=${encodeURIComponent('🎮 Unisciti ad AniQuiz! Codice: ' + id)}`, '_blank');
        }

        function shareViaTelegram() {
            const id = document.getElementById('myPeerId').textContent;
            window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent('🎮 Unisciti ad AniQuiz! Codice: ' + id)}`, '_blank');
        }

        // ============================================
        // ANILIST API (identica)
        // ============================================
        async function fetchAnimeCharacters() {
            try {
                const response = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ query: `query { Page(page: 1, perPage: 24) { characters(sort: FAVOURITES_DESC) { id name { first last } image { large } media(sort: POPULARITY_DESC, perPage: 1) { nodes { title { romaji } } } } } }` })
                });
                const data = await response.json();
                if (data.errors) throw new Error(data.errors[0].message);
                return data.data.Page.characters
                    .filter(c => c.image && c.image.large)
                    .map(c => ({
                        id: c.id,
                        name: (c.name.first || '') + (c.name.last ? ' ' + c.name.last : ''),
                        anime: c.media.nodes[0]?.title?.romaji || 'Sconosciuto',
                        image: c.image.large,
                        emoji: '🎭'
                    }));
            } catch (error) {
                addLog(`Errore Anilist: ${error.message}`, 'error');
                showToast('⚠️ Uso lista di fallback', 'warning', 3000);
                return [
                    { id: 1, name: 'Goku', anime: 'Dragon Ball', image: 'https://via.placeholder.com/150/FF6B6B/FFFFFF?text=Goku', emoji: '🐉' },
                    { id: 2, name: 'Naruto', anime: 'Naruto', image: 'https://via.placeholder.com/150/4ECDC4/FFFFFF?text=Naruto', emoji: '🍥' },
                    { id: 3, name: 'Luffy', anime: 'One Piece', image: 'https://via.placeholder.com/150/45B7D1/FFFFFF?text=Luffy', emoji: '🏴‍☠️' },
                    { id: 4, name: 'Saitama', anime: 'One Punch Man', image: 'https://via.placeholder.com/150/96CEB4/FFFFFF?text=Saitama', emoji: '👊' },
                    { id: 5, name: 'Eren', anime: 'Attack on Titan', image: 'https://via.placeholder.com/150/FFEAA7/333333?text=Eren', emoji: '⚔️' },
                    { id: 6, name: 'Ichigo', anime: 'Bleach', image: 'https://via.placeholder.com/150/DDA0DD/FFFFFF?text=Ichigo', emoji: '⚡' },
                    { id: 7, name: 'Tanjiro', anime: 'Demon Slayer', image: 'https://via.placeholder.com/150/98D8C8/333333?text=Tanjiro', emoji: '🔥' },
                    { id: 8, name: 'Deku', anime: 'My Hero Academia', image: 'https://via.placeholder.com/150/F7DC6F/333333?text=Deku', emoji: '💚' },
                    { id: 9, name: 'Gojo', anime: 'Jujutsu Kaisen', image: 'https://via.placeholder.com/150/BB8FCE/FFFFFF?text=Gojo', emoji: '👁️' },
                    { id: 10, name: 'Mikasa', anime: 'Attack on Titan', image: 'https://via.placeholder.com/150/85C1E9/333333?text=Mikasa', emoji: '⚔️' },
                    { id: 11, name: 'Levi', anime: 'Attack on Titan', image: 'https://via.placeholder.com/150/F8C471/333333?text=Levi', emoji: '⚔️' },
                    { id: 12, name: 'Kaneki', anime: 'Tokyo Ghoul', image: 'https://via.placeholder.com/150/82E0AA/333333?text=Kaneki', emoji: '🐱' }
                ];
            }
        }

        // ============================================
        // GESTIONE PERSONAGGI (identico)
        // ============================================
        function renderCharacterBoard(characters) {
            const board = document.getElementById('charBoard');
            if (!board) return;
            board.innerHTML = '';
            characters.forEach(c => {
                const card = document.createElement('div');
                card.className = 'char-card';
                card.dataset.id = c.id;
                card.innerHTML = `<img src="${c.image}" alt="${c.name}" onerror="this.style.display='none'"><div class="char-name">${c.name}</div><div class="char-anime">${c.anime}</div>`;
                card.addEventListener('click', () => selectCharacter(c.id));
                board.appendChild(card);
            });
            selectedCharacterId = null;
            document.getElementById('readyBtn').disabled = true;
            document.getElementById('selectionStatus').textContent = 'Seleziona un personaggio cliccando sulla card';
            updateReadyButton();
        }

        function selectCharacter(id) {
            if (GameState.ready) { showToast('Hai già confermato!', 'warning', 2000); return; }
            document.querySelectorAll('#charBoard .char-card').forEach(c => c.classList.remove('selected'));
            const card = document.querySelector(`#charBoard .char-card[data-id="${id}"]`);
            if (card) {
                card.classList.add('selected');
                selectedCharacterId = id;
                const char = GameState.boardCharacters.find(c => c.id === id);
                if (char) document.getElementById('selectionStatus').textContent = `Hai scelto: ${char.name}`;
                updateReadyButton();
            }
        }

        function pickRandomCharacter() {
            if (GameState.ready) return;
            if (GameState.boardCharacters.length === 0) return;
            selectCharacter(GameState.boardCharacters[Math.floor(Math.random() * GameState.boardCharacters.length)].id);
        }

        function confirmSelection() {
            if (!selectedCharacterId) { showToast('Seleziona un personaggio prima!', 'warning', 2000); return; }
            if (GameState.ready) { showToast('Hai già confermato!', 'warning', 2000); return; }
            if (GameState.isHost && GameState.players.filter(p => p.id !== GameState.myId).length === 0) {
                showToast('⏳ Aspetta che un amico si connetta!', 'warning', 3000); return;
            }
            const char = GameState.boardCharacters.find(c => c.id === selectedCharacterId);
            if (!char) return;
            GameState.myCharacter = { ...char };
            GameState.ready = true;
            document.getElementById('readyBtn').disabled = true;
            document.getElementById('readyBtn').textContent = '✅ In attesa...';
            document.getElementById('selectionStatus').textContent = `✅ Hai scelto ${char.name}! Attendi l'avversario...`;
            document.querySelectorAll('#charBoard .char-card').forEach(c => c.style.pointerEvents = 'none');
            sendMessage({ type: 'player_ready', playerId: GameState.myId });
            if (GameState.isHost && GameState.opponentReady) startGameAfterSelection();
        }

        function startGameAfterSelection() {
            if (!GameState.isHost) return;
            GameState.gameStarted = true;
            GameState.round = 1;
            GameState.currentPlayerId = GameState.players[0].id;
            sendMessage({ type: 'start_game', players: GameState.players, currentPlayerId: GameState.currentPlayerId, round: GameState.round });
            showScreen('gameScreen');
            updatePlayersList();
            updateCharacters();
            addChatMessage('system', null, '🎮 Partita iniziata!');
            showStatus('🎯 Partita iniziata!', 'success');
            showToast('🎮 Partita iniziata!', 'success', 3000);
            updateConnectionStatus('connected', 'In partita');
            setTimeout(() => hideStatus(), 2000);
        }

        // ============================================
        // PEERJS CORE
        // ============================================
        function generateRoomCode() {
            return String(Math.floor(1000 + Math.random() * 9000));
        }

        function createPeer(id) {
            return new Peer(id, { debug: 0, config: ICE_SERVERS });
        }

        function sendMessage(data) {
            if (GameState.connection && GameState.connection.open) {
                GameState.connection.send(data);
                addLog(`📤 Inviato: ${data.type}`, 'info');
            } else {
                addLog(`⚠️ Connessione chiusa, impossibile inviare`, 'error');
            }
        }

        function setupConnection(conn) {
            conn.on('data', (data) => {
                if (data.type === 'ping') { conn.send({ type: 'pong' }); return; }
                if (data.type === 'pong') {
                    if (GameState.pongTimeout) { clearTimeout(GameState.pongTimeout); GameState.pongTimeout = null; }
                    return;
                }
                addLog(`📨 Ricevuto: ${data.type}`, 'info');
                handleMessage(data);
            });
            conn.on('close', () => {
                addLog('🔌 Connessione chiusa', 'error');
                if (GameState.intentionalDisconnect) return;
                addChatMessage('system', null, '🔌 Connessione persa!');
                showToast('🔌 Connessione persa!', 'warning', 3000);
                updateConnectionStatus('disconnected', 'Disconnesso');
                GameState.gameStarted = false;
                stopPing();
            });
            conn.on('error', (err) => {
                addLog(`❌ Errore connessione: ${err.message}`, 'error');
            });
        }

        // ============================================
        // NUOVA FUNZIONE PER FORZARE L'APERTURA
        // ============================================
        function forceConnectionReady(conn, callback) {
            // Se è già aperta, chiama subito
            if (conn.open) {
                callback();
                return;
            }
            let eventFired = false;
            const onOpen = () => {
                if (!eventFired) {
                    eventFired = true;
                    clearTimeout(timeout);
                    clearTimeout(forceTimeout);
                    callback();
                }
            };
            const timeout = setTimeout(() => {
                // Dopo 500ms controlla di nuovo
                if (conn.open && !eventFired) {
                    onOpen();
                }
            }, 500);
            const forceTimeout = setTimeout(() => {
                // Dopo 5 secondi forza comunque
                if (!eventFired) {
                    addLog('⚠️ Forzatura connessione dopo timeout', 'warning');
                    eventFired = true;
                    callback();
                }
            }, 5000);
            conn.on('open', onOpen);
        }

        // ============================================
        // HOST
        // ============================================
        async function initHost() {
            const roomCode = generateRoomCode();
            addLog(`🏠 Host: avvio stanza ${roomCode}`, 'info');
            GameState.peer = createPeer(roomCode);

            GameState.peer.on('open', async (id) => {
                GameState.peerId = id;
                document.getElementById('myPeerId').textContent = id;
                addLog(`✅ Stanza ${id} aperta`, 'success');
                updateConnectionStatus('connected', 'Caricamento personaggi...');

                const chars = await fetchAnimeCharacters();
                GameState.boardCharacters = chars;
                GameState.charactersLoaded = true;
                addLog('🎭 Personaggi caricati', 'success');
                updateConnectionStatus('connected', 'In attesa di giocatori');
            });

            GameState.peer.on('connection', (conn) => {
                addLog(`📞 Nuova connessione da ${conn.peer}`, 'success');
                GameState.connection = conn;
                setupConnection(conn);
                clearTimeout(GameState.connectionTimeout);
                // Usa la forzatura
                forceConnectionReady(conn, () => {
                    addLog('✅ Connessione host considerata pronta', 'success');
                    onHostConnectionReady(conn);
                });
                // Timeout di sicurezza più lungo (20s)
                GameState.connectionTimeout = setTimeout(() => {
                    if (!conn.open) {
                        addLog('⏰ Timeout connessione host', 'error');
                        showToast('⚠️ Connessione lenta, riprova', 'warning', 4000);
                        conn.close();
                    }
                }, 20000);
            });

            GameState.peer.on('error', (err) => {
                addLog(`❌ Errore: ${err.message}`, 'error');
                if (err.type === 'unavailable-id') {
                    GameState.peer.destroy();
                    initHost();
                }
            });
        }

        function onHostConnectionReady(conn) {
            addLog('✅ Connessione host-client attiva', 'success');
            document.getElementById('waitingSection').classList.add('hidden');
            updateConnectionStatus('connected', 'Giocatore connesso!');
            showToast('🔗 Amico connesso!', 'success', 2000);
            startPing();

            sendMessage({ type: 'characters_board', characters: GameState.boardCharacters });
            showScreen('selectionScreen');
            renderCharacterBoard(GameState.boardCharacters);
            updateReadyButton();
        }

        // ============================================
        // CLIENT
        // ============================================
        function connectToHost(hostId) {
            addLog(`🔗 Client: connessione a ${hostId}`, 'info');
            GameState.peer = createPeer(); // ID casuale

            GameState.peer.on('open', (myId) => {
                GameState.peerId = myId;
                addLog(`👤 Mio ID: ${myId}`, 'info');
                const conn = GameState.peer.connect(hostId, { reliable: true, config: ICE_SERVERS });
                GameState.connection = conn;
                setupConnection(conn);
                clearTimeout(GameState.connectionTimeout);
                // Usa la forzatura
                forceConnectionReady(conn, () => {
                    addLog('✅ Connessione client considerata pronta', 'success');
                    onClientConnectionReady(conn);
                });
                GameState.connectionTimeout = setTimeout(() => {
                    if (!conn.open) {
                        addLog('⏰ Timeout connessione client', 'error');
                        showStatus('❌ Connessione fallita (timeout)', 'error');
                        updateConnectionStatus('disconnected', 'Timeout');
                        conn.close();
                    }
                }, 20000);
            });

            GameState.peer.on('error', (err) => {
                addLog(`❌ Errore client: ${err.message}`, 'error');
                showStatus('❌ Connessione fallita', 'error');
                updateConnectionStatus('disconnected', 'Errore');
            });
        }

        function onClientConnectionReady(conn) {
            addLog('✅ Connessione client-host attiva', 'success');
            updateConnectionStatus('connected', 'Connesso!');
            showToast('✅ Connesso! Ricezione personaggi...', 'success', 3000);
            startPing();

            sendMessage({ type: 'player_joined', playerId: GameState.myId, playerName: GameState.myName });
            document.getElementById('joinSection').classList.add('hidden');
            document.getElementById('lobbyScreen').querySelector('.grid-2').style.display = 'none';
            showScreen('loadingScreen');
        }

        // ============================================
        // PING
        // ============================================
        function startPing() {
            stopPing();
            GameState.pingInterval = setInterval(() => {
                if (GameState.connection && GameState.connection.open) {
                    sendMessage({ type: 'ping' });
                    GameState.pongTimeout = setTimeout(() => {
                        addLog('⏰ Ping timeout', 'error');
                        GameState.connection.close();
                        updateConnectionStatus('disconnected', 'Timeout');
                    }, 10000);
                }
            }, 5000);
        }

        function stopPing() {
            if (GameState.pingInterval) { clearInterval(GameState.pingInterval); GameState.pingInterval = null; }
            if (GameState.pongTimeout) { clearTimeout(GameState.pongTimeout); GameState.pongTimeout = null; }
        }

        // ============================================
        // GESTIONE MESSAGGI (identica)
        // ============================================
        function handleMessage(data) {
            switch(data.type) {
                case 'player_joined': {
                    const newPlayer = { id: data.playerId, name: data.playerName, score: 0 };
                    if (!GameState.players.find(p => p.id === data.playerId)) {
                        GameState.players.push(newPlayer);
                    }
                    updatePlayersList();
                    addChatMessage('system', null, `👋 ${data.playerName} si è unito!`);
                    if (GameState.isHost) {
                        sendMessage({ type: 'player_list', players: GameState.players });
                        if (GameState.boardCharacters.length > 0) {
                            sendMessage({ type: 'characters_board', characters: GameState.boardCharacters });
                        }
                        updateReadyButton();
                    }
                    break;
                }
                case 'player_list':
                    GameState.players = data.players;
                    updatePlayersList();
                    break;
                case 'characters_board':
                    addLog('🎉 Board ricevuta', 'success');
                    GameState.boardCharacters = data.characters;
                    GameState.charactersLoaded = true;
                    renderCharacterBoard(GameState.boardCharacters);
                    showScreen('selectionScreen');
                    showToast('📋 Scegli il tuo personaggio!', 'info', 3000);
                    break;
                case 'player_ready':
                    if (data.playerId !== GameState.myId) {
                        GameState.opponentReady = true;
                        document.getElementById('opponentStatus').textContent = "✅ L'avversario è pronto!";
                        if (GameState.isHost && GameState.ready) startGameAfterSelection();
                    }
                    break;
                case 'start_game':
                    GameState.gameStarted = true;
                    GameState.players = data.players;
                    GameState.currentPlayerId = data.currentPlayerId;
                    GameState.round = data.round || 1;
                    updatePlayersList();
                    updateCharacters();
                    showScreen('gameScreen');
                    updateConnectionStatus('connected', 'In partita');
                    break;
                case 'new_round':
                    GameState.round = data.round;
                    GameState.players = data.players;
                    GameState.currentPlayerId = data.currentPlayerId;
                    updatePlayersList();
                    break;
                case 'question':
                    const asker = GameState.players.find(p => p.id === data.playerId);
                    if (data.playerId === GameState.myId) {
                        addChatMessage('me', null, `❓ ${data.question}`);
                    } else {
                        addChatMessage('question', asker ? asker.name : '?', `❓ ${data.question}`);
                        if (GameState.gameStarted) showQuickResponse(data.question);
                    }
                    break;
                case 'answer':
                    const answerer = GameState.players.find(p => p.id === data.playerId);
                    if (data.playerId === GameState.myId) {
                        addChatMessage('me', null, `💬 ${data.answer}`);
                    } else {
                        addChatMessage('answer', answerer ? answerer.name : '?', `💬 ${data.answer}`);
                    }
                    removeQuickResponse();
                    break;
                case 'guess':
                    handleGuess(data.playerId, data.guess);
                    break;
                case 'guess_result':
                    if (data.correct) {
                        GameState.players = data.players;
                        if (data.guesserId === GameState.myId) GameState.opponentCharacter = data.character;
                        else GameState.myCharacter = data.character;
                        updateCharacters();
                        updatePlayersList();
                        if (GameState.isHost) {
                            setTimeout(() => {
                                const nextIndex = (GameState.players.findIndex(p => p.id === GameState.currentPlayerId) + 1) % GameState.players.length;
                                GameState.currentPlayerId = GameState.players[nextIndex].id;
                                GameState.round++;
                                sendMessage({ type: 'new_round', round: GameState.round, currentPlayerId: GameState.currentPlayerId, players: GameState.players });
                                updatePlayersList();
                            }, 3000);
                        }
                    } else {
                        if (data.guesserId === GameState.myId) addChatMessage('me', null, `❌ ${data.guess} (Non corretto)`);
                    }
                    break;
                case 'disconnect':
                    addChatMessage('system', null, `👋 ${data.playerName} ha lasciato`);
                    resetGameState();
                    showScreen('lobbyScreen');
                    break;
            }
        }

        function handleGuess(guesserId, guess) {
            const target = guesserId === GameState.myId ? GameState.opponentCharacter : GameState.myCharacter;
            if (!target) return;
            const correct = guess.toLowerCase().trim() === target.name.toLowerCase().trim();
            if (correct && GameState.players.find(p => p.id === guesserId)) {
                GameState.players.find(p => p.id === guesserId).score = (GameState.players.find(p => p.id === guesserId).score || 0) + 1;
            }
            sendMessage({ type: 'guess_result', guesserId, correct, guess, character: target, players: GameState.players });
        }

        // ============================================
        // RISPOSTA RAPIDA
        // ============================================
        function showQuickResponse(question) {
            removeQuickResponse();
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.id = 'quickResponse';
            div.className = 'quick-response';
            div.innerHTML = `<input type="text" id="quickAnswer" placeholder="Rispondi..."><button class="btn btn-primary" onclick="sendQuickAnswer()">Invia</button>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            document.getElementById('quickAnswer').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendQuickAnswer(); });
            document.getElementById('quickAnswer').focus();
        }

        function removeQuickResponse() {
            const el = document.getElementById('quickResponse');
            if (el) el.remove();
        }

        function sendQuickAnswer() {
            const input = document.getElementById('quickAnswer');
            if (!input) return;
            const answer = input.value.trim();
            if (!answer) return;
            sendMessage({ type: 'answer', playerId: GameState.myId, answer });
            addChatMessage('me', null, `💬 ${answer}`);
            removeQuickResponse();
            hideStatus();
        }

        // ============================================
        // RESET & DISCONNECT
        // ============================================
        function resetGameState() {
            stopPing();
            if (GameState.connectionTimeout) { clearTimeout(GameState.connectionTimeout); GameState.connectionTimeout = null; }
            if (GameState.forceOpenTimeout) { clearTimeout(GameState.forceOpenTimeout); GameState.forceOpenTimeout = null; }
            Object.assign(GameState, {
                players: [], currentPlayerId: null, gameStarted: false,
                myCharacter: null, opponentCharacter: null, ready: false, opponentReady: false,
                boardCharacters: [], charactersLoaded: false, intentionalDisconnect: false
            });
            selectedCharacterId = null;
            const chatBox = document.getElementById('chatBox');
            if (chatBox) chatBox.innerHTML = `<div class="chat-message system">🎮 Benvenuti in AniQuiz Indovina Chi!</div><div class="chat-message system">👀 Ognuno ha un personaggio. A turno fate domande!</div><div class="chat-message system">🔍 Quando sei sicuro, indovina il personaggio dell'avversario!</div>`;
            hideStatus();
            document.getElementById('waitingSection').classList.add('hidden');
            document.getElementById('lobbyScreen').querySelector('.grid-2').style.display = 'grid';
            document.getElementById('joinSection').classList.add('hidden');
            updateConnectionStatus('disconnected', 'Disconnesso');
            document.getElementById('readyBtn').disabled = true;
            document.getElementById('readyBtn').textContent = '✅ Pronto';
        }

        function disconnectGame() {
            GameState.intentionalDisconnect = true;
            stopPing();
            if (GameState.connectionTimeout) { clearTimeout(GameState.connectionTimeout); GameState.connectionTimeout = null; }
            if (GameState.forceOpenTimeout) { clearTimeout(GameState.forceOpenTimeout); GameState.forceOpenTimeout = null; }
            if (GameState.connection) {
                sendMessage({ type: 'disconnect', playerName: GameState.myName });
                GameState.connection.close();
            }
            if (GameState.peer) GameState.peer.destroy();
            resetGameState();
            showScreen('lobbyScreen');
            showToast('👋 Disconnesso', 'info', 2000);
        }

        // ============================================
        // AZIONI PRINCIPALI
        // ============================================
        async function createGame() {
            const name = document.getElementById('playerName').value.trim() || 'Giocatore1';
            GameState.myId = 'host_' + Date.now();
            GameState.isHost = true;
            GameState.myName = name;
            GameState.players = [{ id: GameState.myId, name, score: 0 }];
            try {
                await initHost();
                document.getElementById('waitingSection').classList.remove('hidden');
                document.getElementById('lobbyScreen').querySelector('.grid-2').style.display = 'none';
                document.getElementById('joinSection').classList.add('hidden');
            } catch (err) {
                addLog(`Errore creazione partita: ${err.message}`, 'error');
            }
        }

        function showJoin() {
            const section = document.getElementById('joinSection');
            section.classList.toggle('hidden');
            if (!section.classList.contains('hidden')) document.getElementById('peerIdInput').focus();
        }

        async function joinGame() {
            const name = document.getElementById('playerName').value.trim() || 'Giocatore2';
            const remoteId = document.getElementById('peerIdInput').value.trim();
            if (!remoteId || remoteId.length !== 4 || !/^\d{4}$/.test(remoteId)) {
                showStatus('❌ Codice non valido', 'error');
                return;
            }
            GameState.myId = 'client_' + Date.now();
            GameState.isHost = false;
            GameState.myName = name;
            GameState.players = [{ id: GameState.myId, name, score: 0 }];
            updateConnectionStatus('connecting', 'Connessione...');
            connectToHost(remoteId);
        }

        function askQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question || !GameState.gameStarted || !GameState.isMyTurn) return;
            addChatMessage('me', null, `❓ ${question}`);
            sendMessage({ type: 'question', playerId: GameState.myId, question });
            input.value = '';
        }

        function makeGuess() {
            const input = document.getElementById('guessInput');
            const guess = input.value.trim();
            if (!guess || !GameState.gameStarted || !GameState.isMyTurn) return;
            addChatMessage('me', null, `🔍 ${guess}`);
            sendMessage({ type: 'guess', playerId: GameState.myId, guess });
            input.value = '';
        }

        // ============================================
        // EVENTI GLOBALI
        // ============================================
        window.addEventListener('beforeunload', () => {
            if (GameState.connection && GameState.connection.open) {
                try { GameState.connection.send({ type: 'disconnect', playerName: GameState.myName }); } catch (e) {}
            }
            stopPing();
            if (GameState.peer) GameState.peer.destroy();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active.id === 'questionInput') askQuestion();
                else if (active.id === 'guessInput') makeGuess();
                else if (active.id === 'peerIdInput') joinGame();
                else if (active.id === 'quickAnswer') sendQuickAnswer();
            }
        });

        (function checkAutoJoin() {
            const params = new URLSearchParams(window.location.search);
            const joinId = params.get('join');
            if (joinId) {
                document.getElementById('peerIdInput').value = joinId;
                document.getElementById('playerName').value = 'Giocatore2';
                setTimeout(joinGame, 500);
            }
        })();

        addLog('🎮 AniQuiz Indovina Chi caricato!', 'success');
        showScreen('lobbyScreen');
    </script>
</body>
</html>
