<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎌 Anime Connection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.8rem;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
        }

        header p {
            color: #aaa;
            font-size: 1.1rem;
            margin-top: 5px;
        }

        .hidden {
            display: none !important;
        }

        .menu {
            text-align: center;
            padding: 30px 20px;
        }

        .menu h2 {
            margin-bottom: 25px;
            font-size: 1.8rem;
            color: #fff;
        }

        .btn-mode {
            display: block;
            width: 100%;
            max-width: 450px;
            margin: 15px auto;
            padding: 25px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            color: #fff;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-mode:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-mode .sub {
            display: block;
            font-size: 0.85rem;
            font-weight: 400;
            color: #aaa;
            margin-top: 8px;
        }

        .btn-mode .badge {
            display: inline-block;
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-top: 5px;
        }

        .game {
            animation: fadeIn 0.5s ease;
        }

        .round-info {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 10px;
        }

        .round-info span {
            color: #ccc;
        }

        .round-info strong {
            color: #fff;
            font-size: 1.2rem;
        }

        .round-info .score-display strong {
            color: #ffd93d;
        }

        .anime-container {
            display: flex;
            align-items: stretch;
            gap: 15px;
            margin: 25px 0;
        }

        .anime-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s;
        }

        .anime-card .loading {
            color: #666;
            font-size: 0.9rem;
        }

        .anime-card .anime-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .anime-card .anime-details {
            font-size: 0.85rem;
            color: #aaa;
            line-height: 1.6;
        }

        .anime-card .anime-details span {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: 12px;
            margin: 2px 3px;
        }

        .connection-symbol {
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            padding: 0 10px;
            color: #ffd93d;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        .question {
            text-align: center;
            margin: 25px 0 20px;
        }

        .question h3 {
            font-size: 1.4rem;
            color: #fff;
            font-weight: 600;
        }

        .question .mode-label {
            display: inline-block;
            background: rgba(77, 150, 255, 0.15);
            color: #4d96ff;
            padding: 3px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            border: 1px solid rgba(77, 150, 255, 0.2);
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }

        .option-btn {
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-btn:hover:not(.disabled) {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .option-btn .letter {
            display: inline-block;
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .option-btn.correct {
            background: rgba(107, 203, 119, 0.2);
            border-color: #6bcb77;
        }

        .option-btn.correct .letter {
            background: #6bcb77;
            color: #fff;
        }

        .option-btn.wrong {
            background: rgba(255, 107, 107, 0.2);
            border-color: #ff6b6b;
        }

        .option-btn.wrong .letter {
            background: #ff6b6b;
            color: #fff;
        }

        .option-btn.reveal-correct {
            background: rgba(107, 203, 119, 0.15);
            border-color: #6bcb77;
            opacity: 0.7;
        }

        .option-btn.reveal-correct .letter {
            background: #6bcb77;
            color: #fff;
        }

        .option-btn.disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .option-btn.disabled:hover {
            transform: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeIn 0.5s ease;
        }

        .result .result-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .result .result-title.correct {
            color: #6bcb77;
        }

        .result .result-title.wrong {
            color: #ff6b6b;
        }

        .result .explanation {
            color: #ccc;
            line-height: 1.6;
            margin-top: 5px;
        }

        .result .explanation .detail {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 12px;
            border-radius: 12px;
            margin: 2px 3px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .actions {
            text-align: center;
            margin-top: 20px;
        }

        .btn-continue {
            padding: 14px 40px;
            background: linear-gradient(45deg, #4d96ff, #6bcb77);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(77, 150, 255, 0.3);
        }

        .btn-continue:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(77, 150, 255, 0.4);
        }

        .final {
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.5s ease;
        }

        .final h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .final .final-score {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            margin: 20px auto;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .final .final-score p {
            font-size: 1.2rem;
            margin: 8px 0;
            color: #ccc;
        }

        .final .final-score strong {
            font-size: 2.5rem;
            color: #ffd93d;
        }

        .final .final-score .message {
            font-size: 1.3rem;
            font-weight: 600;
            margin-top: 15px;
        }

        .btn-restart {
            padding: 14px 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-restart:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        .error-message {
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(255, 107, 107, 0.2);
        }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #ffd93d;
            animation: spin 0.8s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .cache-info {
            color: #888;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            header h1 {
                font-size: 2rem;
            }
            .anime-container {
                flex-direction: column;
                gap: 10px;
            }
            .connection-symbol {
                transform: rotate(90deg);
                padding: 5px 0;
            }
            .options {
                grid-template-columns: 1fr;
            }
            .option-btn {
                padding: 14px 16px;
                font-size: 0.95rem;
            }
            .btn-mode {
                font-size: 1.1rem;
                padding: 20px;
            }
            .round-info {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.6rem;
            }
            .container {
                padding: 10px;
            }
            .option-btn {
                font-size: 0.85rem;
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🎌 Anime Connection</h1>
            <p>🔗 Trova le connessioni nascoste tra due anime!</p>
        </header>

        <div id="menu" class="menu">
            <h2>📋 Scegli la modalità</h2>
            <button onclick="startGame('certe')" class="btn-mode">
                🔒 Connessioni Certe
                <span class="sub">Studio, Autore, Compositore, Doppiatore</span>
                <span class="badge">🎯 Precisione 100%</span>
            </button>
            <button onclick="startGame('creative')" class="btn-mode">
                🎨 Connessioni Creative
                <span class="sub">Combinazioni dinamiche di metadati</span>
                <span class="badge">✨ Sempre diverse</span>
            </button>
        </div>

        <div id="game" class="game hidden">
            <div class="round-info">
                <span>🎯 Round: <strong id="roundDisplay">1</strong>/10</span>
                <span class="score-display">⭐ Punteggio: <strong id="scoreDisplay">0</strong></span>
                <span id="modeDisplay" style="font-size:0.85rem;color:#888;"></span>
            </div>

            <div class="anime-container">
                <div class="anime-card" id="animeA">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>Caricamento anime...</p>
                    </div>
                </div>
                <div class="connection-symbol">🔗</div>
                <div class="anime-card" id="animeB">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>Caricamento anime...</p>
                    </div>
                </div>
            </div>

            <div class="question">
                <div id="modeLabel" class="mode-label">🔍</div>
                <h3 id="questionText">Qual è la connessione?</h3>
            </div>

            <div class="options" id="optionsContainer"></div>

            <div id="resultContainer" class="result hidden">
                <div class="result-title" id="resultTitle">✅ Corretto!</div>
                <div class="explanation" id="resultExplanation"></div>
            </div>

            <div class="actions">
                <button id="continueBtn" class="btn-continue hidden" onclick="nextRound()">
                    ➡️ Prossimo Round
                </button>
            </div>
        </div>

        <div id="final" class="final hidden">
            <h2>🏆 Partita Terminata!</h2>
            <div class="final-score">
                <p>📊 Punteggio finale</p>
                <strong id="finalScore">0</strong>
                <span style="font-size:1.5rem;color:#888;"> / 10</span>
                <p class="message" id="finalMessage"></p>
            </div>
            <button onclick="resetGame()" class="btn-restart">🔄 Gioca Ancora</button>
        </div>
    </div>

    <script>
        // ============================================================
        // ANIME CONNECTION - VERSIONE FUNZIONANTE CON QUERY TESTATA
        // ============================================================

        const state = {
            mode: 'certe',
            round: 0,
            maxRounds: 10,
            score: 0,
            animeA: null,
            animeB: null,
            connection: null,
            options: [],
            correctIndex: -1,
            answered: false,
            loading: false,
            usedAnimeIds: [],
            animeCache: []
        };

        // DOM refs
        const menu = document.getElementById('menu');
        const game = document.getElementById('game');
        const final = document.getElementById('final');
        const roundDisplay = document.getElementById('roundDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const modeDisplay = document.getElementById('modeDisplay');
        const modeLabel = document.getElementById('modeLabel');
        const animeACard = document.getElementById('animeA');
        const animeBCard = document.getElementById('animeB');
        const optionsContainer = document.getElementById('optionsContainer');
        const resultContainer = document.getElementById('resultContainer');
        const resultTitle = document.getElementById('resultTitle');
        const resultExplanation = document.getElementById('resultExplanation');
        const continueBtn = document.getElementById('continueBtn');
        const finalScore = document.getElementById('finalScore');
        const finalMessage = document.getElementById('finalMessage');

        // ---------- API ANILIST ----------
        const ANILIST_API = 'https://graphql.anilist.co';

        // ---------- QUERY GRAFICA CORRETTA (TESTATA) ----------
        function getPageQuery(page) {
            return `
            query ($page: Int) {
              Page(page: $page, perPage: 50) {
                pageInfo {
                  total
                  lastPage
                }
                media(type: ANIME, format: TV) {
                  id
                  title {
                    romaji
                    english
                  }
                  episodes
                  duration
                  startDate {
                    year
                  }
                  averageScore
                  genres
                  status
                  studios(isMain: true) {
                    nodes {
                      name
                    }
                  }
                  staff(perPage: 5) {
                    nodes {
                      name {
                        full
                      }
                      primaryOccupations
                    }
                  }
                  characters(perPage: 2) {
                    nodes {
                      voiceActors(language: JAPANESE, perPage: 1) {
                        nodes {
                          name {
                            full
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
            `;
        }

        // ---------- FETCH PAGINA ----------
        async function fetchRandomAnimePage() {
            // Pagina casuale tra 1 e 200
            const randomPage = Math.floor(Math.random() * 200) + 1;

            try {
                const response = await fetch(ANILIST_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({
                        query: getPageQuery(randomPage),
                        variables: { page: randomPage }
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Response error:', response.status, errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText.substring(0, 100)}`);
                }

                const data = await response.json();

                if (data.errors) {
                    console.error('GraphQL errors:', data.errors);
                    throw new Error(data.errors[0].message);
                }

                const mediaList = data.data?.Page?.media || [];

                if (mediaList.length === 0) {
                    throw new Error('Pagina vuota');
                }

                // Filtra NOT_YET_RELEASED e quelli senza titolo
                const filtered = mediaList.filter(m => {
                    if (m.status === 'NOT_YET_RELEASED') return false;
                    if (!m.title?.romaji && !m.title?.english) return false;
                    return true;
                });

                if (filtered.length === 0) {
                    throw new Error('Nessun anime valido dopo il filtro');
                }

                const parsed = filtered.map(m => parseAnime(m));

                // Filtra quelli senza dati utili per le connessioni
                const valid = parsed.filter(a =>
                    a.title !== 'Sconosciuto' &&
                    (a.studio || a.author || a.composer || a.seiyuu.length > 0 || a.genres.length > 0)
                );

                if (valid.length === 0) {
                    throw new Error('Nessun anime con dati utili');
                }

                // Shuffle per varietà
                for (let i = valid.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [valid[i], valid[j]] = [valid[j], valid[i]];
                }

                console.log(`✅ Caricati ${valid.length} anime validi dalla pagina ${randomPage}`);

                return {
                    anime: valid,
                    page: randomPage
                };

            } catch (error) {
                console.error('Errore fetch pagina:', error.message);
                throw error;
            }
        }

        // ---------- PARSER ----------
        function parseAnime(media) {
            const title = media.title?.romaji || media.title?.english || 'Sconosciuto';
            const studio = media.studios?.nodes?.[0]?.name || null;
            const year = media.startDate?.year || null;
            const decade = year ? `${Math.floor(year / 10) * 10}s` : null;
            const genres = media.genres || [];
            const episodes = media.episodes || null;
            const duration = media.duration || null;
            const score = media.averageScore ? media.averageScore / 10 : null;
            const status = media.status || null;

            let author = null;
            let composer = null;
            const staff = media.staff?.nodes || [];
            for (const s of staff) {
                const occ = s.primaryOccupations || [];
                if (occ.some(o => o.includes('Mangaka') || o.includes('Author') || o.includes('Story'))) {
                    author = s.name?.full || null;
                }
                if (occ.some(o => o.includes('Composer') || o.includes('Music'))) {
                    composer = s.name?.full || null;
                }
            }

            const seiyuu = [];
            const chars = media.characters?.nodes || [];
            for (const ch of chars) {
                const vas = ch.voiceActors?.nodes || [];
                for (const va of vas) {
                    if (va.name?.full) seiyuu.push(va.name.full);
                }
            }

            return {
                id: media.id,
                title,
                studio,
                year,
                decade,
                genres,
                episodes,
                duration,
                score,
                author,
                composer,
                seiyuu: [...new Set(seiyuu)].slice(0, 3),
                status
            };
        }

        // ---------- CARICA CACHE ----------
        async function loadAnimeCache() {
            if (state.animeCache.length >= 30) {
                return;
            }

            const maxAttempts = 10;
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                try {
                    const result = await fetchRandomAnimePage();
                    state.animeCache = result.anime;

                    const cacheInfo = document.querySelector('.cache-info');
                    if (cacheInfo) {
                        cacheInfo.textContent = `📚 ${state.animeCache.length} anime caricati`;
                    }

                    if (state.animeCache.length >= 10) {
                        return;
                    }

                } catch (error) {
                    console.warn(`Tentativo ${attempt + 1} fallito:`, error.message);
                    await new Promise(r => setTimeout(r, 1000 + attempt * 500));
                }
            }

            // Fallback: pagina 1 con query hardcoded
            try {
                console.log('🔄 Tentativo fallback...');
                const response = await fetch(ANILIST_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({
                        query: getPageQuery(1),
                        variables: { page: 1 }
                    })
                });
                const data = await response.json();
                const mediaList = data.data?.Page?.media || [];
                const filtered = mediaList.filter(m => m.status !== 'NOT_YET_RELEASED' && (m.title?.romaji || m.title?.english));
                state.animeCache = filtered.map(m => parseAnime(m)).filter(a =>
                    a.title !== 'Sconosciuto' &&
                    (a.studio || a.author || a.composer || a.seiyuu.length > 0 || a.genres.length > 0)
                );
                console.log(`✅ Fallback: caricati ${state.animeCache.length} anime`);
            } catch (e) {
                console.error('Fallback fallito:', e);
                state.animeCache = [];
            }
        }

        // ---------- VERIFICA CONNESSIONE ----------
        function checkHasConnection(a, b, mode) {
            if (mode === 'certe') {
                if (a.studio && b.studio && a.studio === b.studio) return true;
                if (a.author && b.author && a.author === b.author) return true;
                if (a.composer && b.composer && a.composer === b.composer) return true;
                const commonSeiyuu = a.seiyuu.filter(s => b.seiyuu.includes(s));
                if (commonSeiyuu.length > 0) return true;
                return false;
            }

            if (mode === 'creative') {
                const commonGenres = a.genres.filter(g => b.genres.includes(g));
                if (commonGenres.length > 0 && a.decade && b.decade && a.decade === b.decade) return true;
                if (a.studio && b.studio && a.studio === b.studio && commonGenres.length > 0) return true;
                if (a.studio && b.studio && a.studio === b.studio && a.decade && b.decade && a.decade === b.decade)
                return true;
                if (commonGenres.length >= 2 && a.score && b.score && a.score > 7 && b.score > 7) return true;
                if (a.episodes && b.episodes && Math.abs(a.episodes - b.episodes) <= 5) return true;
                return false;
            }

            return false;
        }

        // ---------- PRENDI 2 ANIME CASUALI ----------
        function getTwoRandomFromCache() {
            let available = state.animeCache.filter(a =>
                !state.usedAnimeIds.includes(a.id) &&
                (a.studio || a.author || a.composer || a.seiyuu.length > 0 || a.genres.length > 0)
            );

            if (available.length < 10) {
                state.usedAnimeIds = [];
                available = state.animeCache.filter(a =>
                    (a.studio || a.author || a.composer || a.seiyuu.length > 0 || a.genres.length > 0)
                );
            }

            if (available.length < 2) {
                return null;
            }

            // Shuffle
            const shuffled = [...available];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            // Cerca coppia con connessione (massimo 30 tentativi)
            for (let i = 0; i < Math.min(shuffled.length - 1, 30); i++) {
                for (let j = i + 1; j < Math.min(i + 15, shuffled.length); j++) {
                    const a = shuffled[i];
                    const b = shuffled[j];
                    if (checkHasConnection(a, b, state.mode)) {
                        state.usedAnimeIds.push(a.id);
                        state.usedAnimeIds.push(b.id);
                        return { animeA: a, animeB: b };
                    }
                }
            }

            // Se nessuna connessione, prendi i primi 2
            if (shuffled.length >= 2) {
                const a = shuffled[0];
                const b = shuffled[1];
                state.usedAnimeIds.push(a.id);
                state.usedAnimeIds.push(b.id);
                return { animeA: a, animeB: b };
            }

            return null;
        }

        // ---------- TROVA CONNESSIONE ----------
        function findConnection(a, b, mode) {
            const connections = [];

            if (mode === 'certe') {
                if (a.studio && b.studio && a.studio === b.studio) {
                    connections.push({
                        type: 'studio',
                        label: `Stesso studio: ${a.studio}`,
                        description: `Entrambi sono prodotti da **${a.studio}**`,
                        priority: 10
                    });
                }
                if (a.author && b.author && a.author === b.author) {
                    connections.push({
                        type: 'author',
                        label: `Stesso autore: ${a.author}`,
                        description: `Entrambi sono scritti da **${a.author}**`,
                        priority: 9
                    });
                }
                if (a.composer && b.composer && a.composer === b.composer) {
                    connections.push({
                        type: 'composer',
                        label: `Stesso compositore: ${a.composer}`,
                        description: `La musica di entrambi è composta da **${a.composer}**`,
                        priority: 8
                    });
                }
                const commonSeiyuu = a.seiyuu.filter(s => b.seiyuu.includes(s));
                if (commonSeiyuu.length > 0) {
                    connections.push({
                        type: 'seiyuu',
                        label: `Stesso doppiatore: ${commonSeiyuu[0]}`,
                        description: `Entrambi hanno **${commonSeiyuu[0]}** come doppiatore`,
                        priority: 7
                    });
                }
            }

            if (mode === 'creative') {
                const commonGenres = a.genres.filter(g => b.genres.includes(g));

                if (commonGenres.length > 0 && a.decade && b.decade && a.decade === b.decade) {
                    connections.push({
                        type: 'genre_decade',
                        label: `${commonGenres[0]} degli anni ${a.decade}`,
                        description: `Entrambi sono **${commonGenres[0]}** degli anni **${a.decade}**`,
                        priority: 6
                    });
                }
                if (a.studio && b.studio && a.studio === b.studio && commonGenres.length > 0) {
                    connections.push({
                        type: 'studio_genre',
                        label: `${a.studio} + ${commonGenres[0]}`,
                        description: `Entrambi sono **${commonGenres[0]}** prodotti da **${a.studio}**`,
                        priority: 6
                    });
                }
                if (a.studio && b.studio && a.studio === b.studio && a.decade && b.decade && a.decade === b.decade) {
                    connections.push({
                        type: 'studio_decade',
                        label: `${a.studio} degli anni ${a.decade}`,
                        description: `Entrambi sono prodotti da **${a.studio}** negli anni **${a.decade}**`,
                        priority: 5
                    });
                }
                if (commonGenres.length >= 2 && a.score && b.score && a.score > 7 && b.score > 7) {
                    connections.push({
                        type: 'high_score_genre',
                        label: `${commonGenres.slice(0, 2).join(' + ')} con punteggio > 7`,
                        description: `Entrambi hanno i generi **${commonGenres.slice(0, 2).join('** e **')}** con punteggio superiore a 7`,
                        priority: 4
                    });
                }
                if (a.episodes && b.episodes && Math.abs(a.episodes - b.episodes) <= 5) {
                    connections.push({
                        type: 'similar_episodes',
                        label: `~${a.episodes} episodi`,
                        description: `Entrambi hanno circa **${a.episodes}** episodi (${b.episodes})`,
                        priority: 3
                    });
                }
            }

            connections.sort((a, b) => b.priority - a.priority);
            return connections.length > 0 ? connections[0] : null;
        }

        // ---------- GENERA OPZIONI FALSE ----------
        function generateFalseOptions(a, b, correctConn, mode) {
            const falseOptions = [];
            const usedLabels = new Set([correctConn.label]);

            const pool = [];

            if (mode === 'certe') {
                if (a.studio && !usedLabels.has(`Stesso studio: ${a.studio}`)) {
                    pool.push({ label: `Stesso studio: ${a.studio}`, description: `Entrambi sono prodotti da **${a.studio}**` });
                }
                if (a.author && !usedLabels.has(`Stesso autore: ${a.author}`)) {
                    pool.push({ label: `Stesso autore: ${a.author}`, description: `Entrambi sono scritti da **${a.author}**` });
                }
                if (a.composer && !usedLabels.has(`Stesso compositore: ${a.composer}`)) {
                    pool.push({ label: `Stesso compositore: ${a.composer}`,
                    description: `La musica di entrambi è composta da **${a.composer}**` });
                }
                if (a.seiyuu.length > 0 && !usedLabels.has(`Stesso doppiatore: ${a.seiyuu[0]}`)) {
                    pool.push({ label: `Stesso doppiatore: ${a.seiyuu[0]}`,
                    description: `Entrambi hanno **${a.seiyuu[0]}** come doppiatore` });
                }
            }

            if (mode === 'creative') {
                const commonGenres = a.genres.filter(g => b.genres.includes(g));
                if (commonGenres.length > 0 && a.decade) {
                    const label = `${commonGenres[0]} degli anni ${a.decade}`;
                    if (!usedLabels.has(label)) {
                        pool.push({ label, description: `Entrambi sono **${commonGenres[0]}** degli anni **${a.decade}**` });
                    }
                }
                if (a.studio && commonGenres.length > 0) {
                    const label = `${a.studio} + ${commonGenres[0]}`;
                    if (!usedLabels.has(label)) {
                        pool.push({ label, description: `Entrambi sono **${commonGenres[0]}** prodotti da **${a.studio}**` });
                    }
                }
                if (a.studio && a.decade) {
                    const label = `${a.studio} degli anni ${a.decade}`;
                    if (!usedLabels.has(label)) {
                        pool.push({ label, description: `Entrambi sono prodotti da **${a.studio}** negli anni **${a.decade}**` });
                    }
                }
                if (a.episodes) {
                    const label = `~${a.episodes} episodi`;
                    if (!usedLabels.has(label)) {
                        pool.push({ label, description: `Entrambi hanno circa **${a.episodes}** episodi` });
                    }
                }
            }

            shuffleArray(pool);
            for (const item of pool) {
                if (falseOptions.length >= 3) break;
                if (!usedLabels.has(item.label)) {
                    falseOptions.push(item);
                    usedLabels.add(item.label);
                }
            }

            while (falseOptions.length < 3) {
                const label = `Connessione ${falseOptions.length + 1}`;
                falseOptions.push({
                    label: label,
                    description: `**${label}** (placeholder)`
                });
            }

            return falseOptions;
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ---------- GIOCO ----------
        async function startGame(mode) {
            state.mode = mode;
            state.round = 0;
            state.score = 0;
            state.usedAnimeIds = [];
            state.animeCache = [];

            menu.classList.add('hidden');
            game.classList.remove('hidden');
            final.classList.add('hidden');

            modeDisplay.textContent = mode === 'certe' ? '🔒 Certe' : '🎨 Creative';
            modeLabel.textContent = mode === 'certe' ? '🔒 Connessione Certa' : '🎨 Connessione Creativa';

            const roundInfo = document.querySelector('.round-info');
            if (!document.querySelector('.cache-info')) {
                const cacheInfo = document.createElement('span');
                cacheInfo.className = 'cache-info';
                cacheInfo.textContent = '📚 Caricamento...';
                roundInfo.appendChild(cacheInfo);
            }

            await loadAnimeCache();
            await loadRound();
        }

        async function loadRound() {
            if (state.round >= state.maxRounds) {
                showFinal();
                return;
            }

            state.answered = false;
            state.loading = true;

            roundDisplay.textContent = state.round + 1;
            scoreDisplay.textContent = state.score;
            resultContainer.classList.add('hidden');
            continueBtn.classList.add('hidden');
            optionsContainer.innerHTML = '';

            animeACard.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Caricando anime...</p>
                </div>
            `;
            animeBCard.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Caricando anime...</p>
                </div>
            `;

            try {
                if (state.animeCache.length < 15) {
                    await loadAnimeCache();
                }

                let pair = getTwoRandomFromCache();

                if (!pair) {
                    state.animeCache = [];
                    await loadAnimeCache();
                    pair = getTwoRandomFromCache();
                }

                if (!pair) {
                    throw new Error('Impossibile trovare una coppia valida');
                }

                state.animeA = pair.animeA;
                state.animeB = pair.animeB;

                const connection = findConnection(pair.animeA, pair.animeB, state.mode);
                if (!connection) {
                    await loadRound();
                    return;
                }

                state.connection = connection;

                renderAnimeCard(animeACard, pair.animeA);
                renderAnimeCard(animeBCard, pair.animeB);

                const falseOptions = generateFalseOptions(pair.animeA, pair.animeB, connection, state.mode);
                const allOptions = [
                    { label: connection.label, description: connection.description, correct: true },
                    ...falseOptions.map(o => ({ ...o, correct: false }))
                ];

                shuffleArray(allOptions);
                state.options = allOptions;
                state.correctIndex = allOptions.findIndex(o => o.correct === true);

                renderOptions(allOptions);
                state.loading = false;

            } catch (error) {
                console.error('Errore:', error);
                animeACard.innerHTML =
                `<div class="error-message">❌ ${error.message || 'Errore nel caricamento'}</div>`;
                animeBCard.innerHTML = `<div class="error-message">❌ Riprovo...</div>`;
                state.loading = false;
                setTimeout(() => loadRound(), 1500);
            }
        }

        function renderAnimeCard(card, anime) {
            const genresStr = anime.genres.slice(0, 3).map(g => `<span>${g}</span>`).join(' ');
            const statusMap = {
                'FINISHED': '✅ Completato',
                'RELEASING': '🔄 In corso',
                'CANCELLED': '❌ Cancellato',
                'HIATUS': '⏸️ In pausa'
            };
            const statusText = anime.status ? statusMap[anime.status] || anime.status : '';

            card.innerHTML = `
                <div class="anime-title">${anime.title}</div>
                <div class="anime-details">
                    ${anime.studio ? `<span>🏢 ${anime.studio}</span>` : ''}
                    ${anime.year ? `<span>📅 ${anime.year}</span>` : ''}
                    ${anime.episodes ? `<span>📺 ${anime.episodes} ep</span>` : ''}
                    ${anime.score ? `<span>⭐ ${anime.score.toFixed(1)}</span>` : ''}
                    ${statusText ? `<span>${statusText}</span>` : ''}
                    ${genresStr ? `<div style="margin-top:8px;">${genresStr}</div>` : ''}
                </div>
            `;
        }

        function renderOptions(options) {
            const letters = ['A', 'B', 'C', 'D'];
            optionsContainer.innerHTML = '';
            options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="letter">${letters[index]}</span> ${opt.label}`;
                btn.dataset.index = index;
                btn.onclick = () => handleOptionClick(index);
                optionsContainer.appendChild(btn);
            });
        }

        function handleOptionClick(index) {
            if (state.answered || state.loading) return;

            state.answered = true;
            const isCorrect = index === state.correctIndex;
            const buttons = optionsContainer.querySelectorAll('.option-btn');

            buttons.forEach(btn => btn.classList.add('disabled'));

            if (isCorrect) {
                buttons[index].classList.add('correct');
                state.score++;
                scoreDisplay.textContent = state.score;
            } else {
                buttons[index].classList.add('wrong');
                buttons[state.correctIndex].classList.add('reveal-correct');
            }

            const correctOpt = state.options[state.correctIndex];
            resultTitle.textContent = isCorrect ? '✅ Corretto! 🎉' : '❌ Sbagliato!';
            resultTitle.className = `result-title ${isCorrect ? 'correct' : 'wrong'}`;

            resultExplanation.innerHTML = `
                <p><strong>🔗 Connessione:</strong> ${correctOpt.description}</p>
                <p style="margin-top:8px;font-size:0.9rem;color:#888;">
                    ${state.mode === 'certe' ? '📌 Connessione certa basata su dati ufficiali' : '🎨 Connessione creativa basata su metadati'}
                </p>
                <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;">
                    <span class="detail">${state.animeA.title}</span>
                    <span class="detail">🔗</span>
                    <span class="detail">${state.animeB.title}</span>
                </div>
            `;

            resultContainer.classList.remove('hidden');
            continueBtn.textContent = state.round < state.maxRounds - 1 ? '➡️ Prossimo Round' : '🏆 Vedi Risultato Finale';
            continueBtn.classList.remove('hidden');
        }

        function nextRound() {
            state.round++;
            loadRound();
        }

        function showFinal() {
            game.classList.add('hidden');
            final.classList.remove('hidden');
            finalScore.textContent = state.score;

            const pct = (state.score / state.maxRounds) * 100;
            let msg = '';
            if (pct === 100) msg = '🌟 PERFETTO! Sei un vero maestro!';
            else if (pct >= 80) msg = '🎉 Ottimo lavoro! Conosci bene gli anime!';
            else if (pct >= 60) msg = '👏 Buon punteggio! Continua così!';
            else if (pct >= 40) msg = '📚 Non male! Rivedi qualche anime!';
            else msg = '💪 Dai, riprova! Ogni partita è un\'occasione per imparare!';
            finalMessage.textContent = msg;
        }

        function resetGame() {
            final.classList.add('hidden');
            menu.classList.remove('hidden');
            state.usedAnimeIds = [];
            state.round = 0;
            state.score = 0;
            state.animeCache = [];
        }
    </script>
