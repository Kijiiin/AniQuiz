<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taboo Multiplayer</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; }
        body {
            min-height:100vh; display:flex; justify-content:center; align-items:center;
            background:linear-gradient(145deg, #1a1e2c, #2d3349);
            padding:20px;
        }
        .container {
            max-width:800px; width:100%; background:#f8f4e9; border-radius:48px;
            padding:30px 25px 35px; box-shadow:0 20px 40px rgba(0,0,0,0.6), 0 0 0 2px #ffd966 inset;
        }
        h1 { font-size:2.2rem; text-align:center; color:#2d1b3d; display:flex; align-items:center; justify-content:center; gap:12px; }
        h1 small { font-size:0.9rem; background:#e2d9c5; padding:4px 14px; border-radius:40px; color:#3d2c4a; }
        .login { background:#eaddd0; padding:20px; border-radius:40px; margin:16px 0; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:center; }
        .login input { padding:12px 18px; border-radius:60px; border:2px solid #b3a68e; font-size:1rem; flex:1; min-width:150px; }
        .login button { padding:12px 28px; border:none; border-radius:60px; background:#5b8c5a; color:white; font-weight:700; cursor:pointer; box-shadow:0 4px 0 #2d5a2c; transition:0.08s; }
        .login button:active { transform:translateY(4px); box-shadow:none; }
        .login .status { font-weight:500; color:#2d1b3d; }

        .timer-area { display:flex; justify-content:space-between; align-items:center; background:#2d1b3d; padding:10px 20px; border-radius:60px; margin:12px 0 20px; color:#ffd966; font-weight:bold; flex-wrap:wrap; gap:8px; }
        .timer { font-size:2.2rem; background:#1f122b; padding:0 18px; border-radius:40px; color:#f7f0d9; letter-spacing:2px; }
        .score-box { display:flex; gap:12px; flex-wrap:wrap; font-size:0.95rem; }
        .score-box span { background:#1f122b; padding:4px 14px; border-radius:40px; color:#f7f0d9; }
        .foul-badge { background:#8b2e2e; color:#ffbaba; }

        .card { background:white; border-radius:32px; padding:28px 20px 22px; box-shadow:inset 0 -6px 0 #cfc3ab, 0 12px 24px rgba(0,0,0,0.2); margin-bottom:16px; text-align:center; }
        .main-word { font-size:3.8rem; font-weight:800; color:#1f122b; text-transform:uppercase; line-height:1.2; margin-bottom:12px; }
        .forbidden-label { font-size:0.8rem; text-transform:uppercase; letter-spacing:3px; color:#a0856b; margin-bottom:4px; }
        .forbidden-words { display:flex; flex-wrap:wrap; justify-content:center; gap:8px 14px; font-size:1.2rem; font-weight:600; color:#b33a3a; background:#fcf5e8; padding:10px; border-radius:60px; border:2px dashed #d6c5ae; }
        .forbidden-words span { background:#ffe9e0; padding:4px 16px; border-radius:40px; }

        .describer-info { background:#eaddd0; border-radius:40px; padding:8px 16px; margin:12px 0; text-align:center; font-size:0.95rem; color:#2d1b3d; }
        .describer-info strong { background:#2d1b3d; color:#ffd966; padding:2px 16px; border-radius:30px; }

        .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin:14px 0 8px; }
        .btn { border:none; padding:12px 20px; border-radius:60px; font-weight:700; font-size:1rem; cursor:pointer; box-shadow:0 4px 0 #b3a68e; transition:0.08s; flex:1 1 auto; min-width:100px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
        .btn:active { transform:translateY(4px); box-shadow:none; }
        .btn:disabled { opacity:0.5; transform:translateY(2px); box-shadow:0 2px 0 #b3a68e; pointer-events:none; }
        .btn-primary { background:#5b8c5a; color:white; box-shadow:0 4px 0 #2d5a2c; }
        .btn-danger { background:#c45a5a; color:white; box-shadow:0 4px 0 #8f3a3a; }
        .btn-foul { background:#d35400; color:white; box-shadow:0 4px 0 #8a3700; }
        .btn-gold { background:#ffb347; color:#1f122b; box-shadow:0 4px 0 #c47d2a; }
        .btn-purple { background:#6c3a8a; color:white; box-shadow:0 4px 0 #3d1f4f; }
        .btn-outline { background:transparent; box-shadow:inset 0 0 0 2px #1f122b; }

        .players-list { background:#f0ebe0; border-radius:30px; padding:12px 16px; margin:12px 0; display:flex; flex-wrap:wrap; gap:10px 20px; font-size:0.9rem; }
        .players-list .player { display:flex; align-items:center; gap:6px; }
        .players-list .player .name { font-weight:600; color:#1f122b; }
        .players-list .player .score { background:#2d1b3d; color:#ffd966; padding:0 10px; border-radius:30px; font-size:0.8rem; }
        .players-list .player.describer { background:#ffd966; padding:2px 12px; border-radius:30px; }

        .status { text-align:center; margin-top:16px; font-weight:500; color:#4d3e2f; }
        .reset-area { display:flex; justify-content:center; margin-top:12px; }
        .reset-area .btn { background:#3d2c4a; color:#f7f0d9; box-shadow:0 4px 0 #1f122b; padding:10px 32px; }

        @media (max-width:550px) {
            .container { padding:20px 14px; }
            .main-word { font-size:2.8rem; }
            .timer { font-size:1.8rem; }
            .score-box { font-size:0.8rem; gap:6px; }
            .btn { padding:10px 14px; font-size:0.9rem; min-width:70px; }
            .login input { font-size:0.9rem; padding:10px 14px; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>🎭 TABOO <small>multiplayer</small></h1>

    <!-- Schermata di login -->
    <div class="login" id="loginScreen">
        <input type="text" id="playerNameInput" placeholder="Il tuo nome" value="Giocatore" />
        <input type="text" id="roomInput" placeholder="Stanza (es. party)" value="default" />
        <button id="connectBtn">🔗 Entra</button>
        <span class="status" id="connectionStatus">⏳ Connessione...</span>
    </div>

    <!-- Gioco (inizialmente nascosto) -->
    <div id="gameArea" style="display:none;">
        <div class="timer-area">
            <div class="timer" id="timerDisplay">⏱️ 60</div>
            <div class="score-box">
                <span>✅ <span id="correctCount">0</span></span>
                <span>⏭️ <span id="skipCount">0</span></span>
                <span class="foul-badge">🚨 <span id="foulCount">0</span></span>
            </div>
        </div>

        <div class="card">
            <div class="main-word" id="wordDisplay">🃏</div>
            <div class="forbidden-label">🚫 parole proibite</div>
            <div class="forbidden-words" id="forbiddenDisplay">
                <span>—</span><span>—</span><span>—</span><span>—</span>
            </div>
        </div>

        <div class="describer-info" id="describerInfo">
            🗣️ <strong>Nessun descrittore</strong> – premi "Nuovo turno" per iniziare!
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="correctBtn">✅ Indovinata!</button>
            <button class="btn btn-danger" id="skipBtn">⏭️ Salta</button>
            <button class="btn btn-foul" id="foulBtn">🚨 Fallo!</button>
            <button class="btn btn-gold" id="newTurnBtn">🔄 Nuovo turno</button>
        </div>

        <div class="players-list" id="playersList"></div>

        <div class="status" id="statusMessage">Attendi l'inizio del gioco...</div>

        <div class="reset-area">
            <button class="btn" id="resetBtn">🔄 Ricomincia partita</button>
        </div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    //  CONFIGURAZIONE
    // --------------------------------------------------------------
    const WS_URL = 'wss://taboo-aniquiz.onrender.com'; // SOSTITUISCI CON IL TUO URL

    // --------------------------------------------------------------
    //  STATO DEL CLIENT
    // --------------------------------------------------------------
    let ws = null;
    let myPlayerId = null;
    let myName = '';
    let roomId = 'default';
    let gameState = null;
    let connected = false;

    // Elementi DOM
    const loginScreen = document.getElementById('loginScreen');
    const gameArea = document.getElementById('gameArea');
    const playerNameInput = document.getElementById('playerNameInput');
    const roomInput = document.getElementById('roomInput');
    const connectBtn = document.getElementById('connectBtn');
    const connectionStatus = document.getElementById('connectionStatus');

    const timerDisplay = document.getElementById('timerDisplay');
    const correctCount = document.getElementById('correctCount');
    const skipCount = document.getElementById('skipCount');
    const foulCount = document.getElementById('foulCount');
    const wordDisplay = document.getElementById('wordDisplay');
    const forbiddenDisplay = document.getElementById('forbiddenDisplay');
    const describerInfo = document.getElementById('describerInfo');
    const playersList = document.getElementById('playersList');
    const statusMessage = document.getElementById('statusMessage');

    const correctBtn = document.getElementById('correctBtn');
    const skipBtn = document.getElementById('skipBtn');
    const foulBtn = document.getElementById('foulBtn');
    const newTurnBtn = document.getElementById('newTurnBtn');
    const resetBtn = document.getElementById('resetBtn');

    // --------------------------------------------------------------
    //  FUNZIONI DI CONNESSIONE
    // --------------------------------------------------------------
    function connect() {
        const name = playerNameInput.value.trim() || 'Anonimo';
        const room = roomInput.value.trim() || 'default';
        myName = name;
        roomId = room;

        if (ws) {
            ws.close();
        }

        connectionStatus.textContent = '⏳ Connessione in corso...';
        ws = new WebSocket(WS_URL);

        ws.onopen = () => {
            connectionStatus.textContent = '✅ Connesso, invio dati...';
            ws.send(JSON.stringify({
                type: 'connect',
                playerName: myName,
                room: roomId
            }));
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                handleServerMessage(data);
            } catch (e) {
                console.error('Errore parsing messaggio:', e);
            }
        };

        ws.onclose = () => {
            connectionStatus.textContent = '❌ Disconnesso';
            connected = false;
            gameArea.style.display = 'none';
            loginScreen.style.display = 'flex';
        };

        ws.onerror = (err) => {
            console.error('WebSocket error:', err);
            connectionStatus.textContent = '❌ Errore di connessione';
        };
    }

    function disconnect() {
        if (ws) {
            ws.send(JSON.stringify({ type: 'leave' }));
            ws.close();
        }
    }

    // --------------------------------------------------------------
    //  GESTIONE MESSAGGI DAL SERVER
    // --------------------------------------------------------------
    function handleServerMessage(data) {
        switch (data.type) {
            case 'connected': {
                myPlayerId = data.playerId;
                connected = true;
                loginScreen.style.display = 'none';
                gameArea.style.display = 'block';
                connectionStatus.textContent = `✅ Connesso come ${data.playerName} (${data.playerId})`;
                statusMessage.textContent = 'Connesso! In attesa dello stato...';
                break;
            }
            case 'state': {
                gameState = data.state;
                updateUI();
                break;
            }
            case 'playerJoined':
            case 'playerLeft':
            case 'players':
                // Già gestito tramite state
                break;
            default:
                console.log('Messaggio non gestito:', data);
        }
    }

    // --------------------------------------------------------------
    //  AGGIORNAMENTO UI
    // --------------------------------------------------------------
    function updateUI() {
        if (!gameState) return;

        const { cards, currentIndex, scores, currentDescriber, timeLeft, isPlaying, finished, players } = gameState;

        // Timer
        timerDisplay.textContent = `⏱️ ${timeLeft}`;

        // Carta
        if (finished || currentIndex >= cards.length) {
            wordDisplay.textContent = '🏁 FINE!';
            forbiddenDisplay.innerHTML = '<span>—</span><span>—</span><span>—</span><span>—</span>';
            statusMessage.textContent = '🎉 Partita terminata! Premi "Nuovo turno" per ricominciare.';
        } else if (cards.length > 0 && currentIndex < cards.length) {
            const card = cards[currentIndex];
            wordDisplay.textContent = card.word;
            forbiddenDisplay.innerHTML = card.forbidden.map(w => `<span>${w}</span>`).join('');
        } else {
            wordDisplay.textContent = '🃏';
            forbiddenDisplay.innerHTML = '<span>—</span><span>—</span><span>—</span><span>—</span>';
        }

        // Descrittore
        if (currentDescriber && players && players[currentDescriber]) {
            const name = players[currentDescriber].name;
            describerInfo.innerHTML = `🗣️ <strong>${name}</strong> è il descrittore!`;
        } else if (finished) {
            describerInfo.innerHTML = '🏁 Partita finita! Premi "Nuovo turno" per ricominciare.';
        } else {
            describerInfo.innerHTML = '⏳ Nessun descrittore – premi "Nuovo turno" per iniziare!';
        }

        // Punteggi del giocatore locale
        if (myPlayerId && scores[myPlayerId]) {
            const s = scores[myPlayerId];
            correctCount.textContent = s.correct || 0;
            skipCount.textContent = s.skip || 0;
            foulCount.textContent = s.foul || 0;
        } else {
            correctCount.textContent = '0';
            skipCount.textContent = '0';
            foulCount.textContent = '0';
        }

        // Lista giocatori
        if (players) {
            let html = '';
            for (const pid in players) {
                const p = players[pid];
                const s = scores[pid] || { correct: 0, skip: 0, foul: 0 };
                const isDesc = (pid === currentDescriber);
                const isMe = (pid === myPlayerId);
                html += `<div class="player ${isDesc ? 'describer' : ''}">
                            <span class="name">${isMe ? '⭐ ' : ''}${p.name}</span>
                            <span class="score">✅${s.correct||0} ⏭${s.skip||0} 🚨${s.foul||0}</span>
                            ${isDesc ? ' 👑' : ''}
                        </div>`;
            }
            playersList.innerHTML = html || '<span>Nessun giocatore</span>';
        }

        // Abilita/disabilita pulsanti in base allo stato
        const isMyTurn = (currentDescriber === myPlayerId);
        const isActive = isPlaying && !finished && currentIndex < cards.length;

        // Pulsanti di gioco
        correctBtn.disabled = !isActive || !isMyTurn;
        skipBtn.disabled = !isActive || !isMyTurn;
        foulBtn.disabled = !isActive || !isMyTurn || isMyTurn; // solo controllori possono fare fallo
        newTurnBtn.disabled = isActive; // se è attivo, non puoi iniziare un nuovo turno

        // Reset sempre abilitato
        resetBtn.disabled = false;

        // Messaggio di stato
        if (!isActive && !finished) {
            statusMessage.textContent = '⏳ In attesa che qualcuno inizi il turno...';
        } else if (finished) {
            statusMessage.textContent = '🏁 Partita finita! Premi "Nuovo turno" per ricominciare.';
        } else if (isActive && isMyTurn) {
            statusMessage.textContent = '🎤 Sei il descrittore! Parla e usa i pulsanti per segnare.';
        } else if (isActive && !isMyTurn && currentDescriber) {
            statusMessage.textContent = '👀 Sei un controllore – ascolta e premi "Fallo!" se senti una proibita.';
        } else if (isActive && !currentDescriber) {
            statusMessage.textContent = '⏳ Nessun descrittore... premi "Nuovo turno" per iniziare.';
        }
    }

    // --------------------------------------------------------------
    //  INVIO AZIONI
    // --------------------------------------------------------------
    function sendAction(action, data = {}) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            alert('Non connesso al server!');
            return;
        }
        ws.send(JSON.stringify({
            type: 'action',
            action: action,
            data: data
        }));
    }

    // --------------------------------------------------------------
    //  EVENTI PULSANTI
    // --------------------------------------------------------------
    connectBtn.addEventListener('click', connect);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && loginScreen.style.display !== 'none') {
            connect();
        }
    });

    correctBtn.addEventListener('click', () => sendAction('correct'));
    skipBtn.addEventListener('click', () => sendAction('skip'));
    foulBtn.addEventListener('click', () => sendAction('foul'));
    newTurnBtn.addEventListener('click', () => sendAction('newTurn'));
    resetBtn.addEventListener('click', () => {
        if (confirm('Reset totale della partita? Tutti i punteggi verranno azzerati.')) {
            sendAction('reset');
        }
    });

    // --------------------------------------------------------------
    //  CHIUSURA PULITA
    // --------------------------------------------------------------
    window.addEventListener('beforeunload', () => {
        disconnect();
    });

    // --------------------------------------------------------------
    //  AVVIO – tentativo connessione automatico (opzionale)
    // --------------------------------------------------------------
    // connect(); // Decommenta per connetterti subito
</script>
</body>
</html>
