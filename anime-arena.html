<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime Battle – Proiettili Multiplayer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f0e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color: #eee;
            padding: 20px;
        }
        .game-wrapper {
            background: #1a1a2e;
            border-radius: 24px;
            padding: 24px;
            border: 1px solid #2a2a4a;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            max-width: 900px;
            width: 100%;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .top-bar .title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .top-bar .status {
            font-size: 14px;
            background: #12121f;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #2a2a4a;
        }
        .top-bar .status .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .dot.online { background: #4ade80; box-shadow: 0 0 12px rgba(74, 222, 128, 0.4); }
        .dot.offline { background: #f87171; }
        .dot.connecting { background: #fbbf24; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

        .canvas-container {
            background: #12121f;
            border-radius: 16px;
            border: 1px solid #2a2a4a;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 800 / 500;
            background: #1a1a2e;
            cursor: crosshair;
        }
        .controls-info {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #8888aa;
            flex-wrap: wrap;
            gap: 6px;
        }
        .controls-info kbd {
            background: #0a0a14;
            padding: 2px 10px;
            border-radius: 6px;
            border: 1px solid #2a2a4a;
            font-family: monospace;
            color: #ddd;
        }
        .players-list {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .player-tag {
            background: #12121f;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 4px 14px 4px 10px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .player-tag .hp-bar { width: 40px; height: 6px; background: #2a2a4a; border-radius: 4px; overflow: hidden; }
        .player-tag .hp-fill { height: 100%; background: #4ade80; transition: width 0.2s; }
        .player-tag .hp-fill.low { background: #f87171; }
        .player-tag .you { color: #f7971e; font-weight: bold; }
        .log-area {
            margin-top: 12px;
            background: #0a0a14;
            border-radius: 12px;
            padding: 8px 14px;
            max-height: 80px;
            overflow-y: auto;
            font-size: 12px;
            color: #7777aa;
            border: 1px solid #1a1a2e;
            font-family: 'Fira Code', monospace;
            line-height: 1.6;
        }
        .log-area .log-entry .highlight { color: #f7971e; }
        .log-area .log-entry .success { color: #4ade80; }
        .log-area .log-entry .error { color: #f87171; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0a0a14; }
        ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 10px; }

        .connection-panel {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 12px;
        }
        .connection-panel input {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid #2a2a4a;
            background: #12121f;
            color: #eee;
            font-size: 14px;
            flex: 1;
            min-width: 120px;
        }
        .connection-panel input:focus { border-color: #f7971e; outline: none; }
        .connection-panel button {
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            background: #2a2a4a;
            color: #ccc;
            transition: all 0.2s;
        }
        .connection-panel button:hover { transform: scale(1.03); filter: brightness(1.2); }
        .connection-panel button.primary { background: linear-gradient(135deg, #f7971e, #ffd200); color: #1a1a2e; }
        .connection-panel button.danger { background: #e74c3c; color: #fff; }
        .connection-panel button.success { background: #4ade80; color: #1a1a2e; }
        .connection-panel button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- Barra superiore -->
    <div class="top-bar">
        <span class="title">⚔️ Anime Battle – Proiettili</span>
        <span class="status">
            <span class="dot offline" id="statusDot"></span>
            <span id="statusText">Disconnesso</span>
            &nbsp;|&nbsp; Stanza: <span id="roomName">—</span>
            &nbsp;|&nbsp; 👥 <span id="playerCount">0</span>
        </span>
    </div>

    <!-- Pannello connessione -->
    <div class="connection-panel" id="connectionPanel">
        <input type="text" id="playerNameInput" placeholder="Nome" value="Naruto" />
        <input type="text" id="roomInput" placeholder="Stanza" value="anime-arena" />
        <input type="text" id="serverUrlInput" placeholder="Server URL" 
               value="wss://anime-multiplayer-server.onrender.com" />
        <button class="primary" id="connectBtn">🔗 Connetti</button>
        <button class="success" id="readyBtn" disabled>✅ Pronto</button>
        <button class="danger" id="leaveBtn" disabled>✕ Esci</button>
    </div>

    <!-- Canvas -->
    <div class="canvas-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <!-- Controlli -->
    <div class="controls-info">
        <span><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> muovi</span>
        <span><kbd>␣</kbd> (Spazio) spara proiettile</span>
        <span id="myHealthDisplay">❤️ 100</span>
    </div>

    <!-- Lista giocatori -->
    <div class="players-list" id="playersList"></div>

    <!-- Log -->
    <div class="log-area" id="logArea">
        <div class="log-entry"><span class="highlight">⚔️ Benvenuto!</span> Spara proiettili ai nemici!</div>
    </div>
</div>

<!-- Libreria multiplayer -->
<script src="multiplayer.js"></script>

<!-- Gioco con proiettili -->
<script>
    // -------- Riferimenti DOM --------
    const $ = id => document.getElementById(id);
    const canvas = $('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusDot = $('statusDot');
    const statusText = $('statusText');
    const roomName = $('roomName');
    const playerCount = $('playerCount');
    const playersList = $('playersList');
    const logArea = $('logArea');
    const myHealthDisplay = $('myHealthDisplay');

    const playerNameInput = $('playerNameInput');
    const roomInput = $('roomInput');
    const serverUrlInput = $('serverUrlInput');
    const connectBtn = $('connectBtn');
    const readyBtn = $('readyBtn');
    const leaveBtn = $('leaveBtn');

    // -------- Funzioni di salvataggio --------
    function loadSavedSettings() {
        const savedName = localStorage.getItem('animeBattle_playerName');
        const savedRoom = localStorage.getItem('animeBattle_room');
        const savedServer = localStorage.getItem('animeBattle_server');
        if (savedName) playerNameInput.value = savedName;
        if (savedRoom) roomInput.value = savedRoom;
        if (savedServer) serverUrlInput.value = savedServer;
    }

    function saveSettings() {
        localStorage.setItem('animeBattle_playerName', playerNameInput.value.trim());
        localStorage.setItem('animeBattle_room', roomInput.value.trim());
        localStorage.setItem('animeBattle_server', serverUrlInput.value.trim());
    }

    // -------- Stato gioco --------
    const GAME = {
        me: { id: null, name: '', x: 400, y: 250, hp: 100, maxHp: 100, direction: 0 },
        players: {},
        projectiles: [], // { x, y, vx, vy, ownerId, life, damage }
        connected: false,
        ready: false,
        room: '',
        keys: { w: false, a: false, s: false, d: false, space: false },
        speed: 3,
        attackCooldown: 0,
        attackCooldownTime: 20, // frame tra un proiettile e l'altro
        projSpeed: 6,
        projLife: 80, // frame di vita
        projDamage: 20,
    };

    let gameRunning = false;

    // -------- Helper: Log --------
    function addLog(message, type = '') {
        const time = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span class="time">[${time}]</span> <span class="${type}">${message}</span>`;
        logArea.appendChild(entry);
        logArea.scrollTop = logArea.scrollHeight;
        if (logArea.children.length > 100) logArea.removeChild(logArea.firstChild);
    }

    // -------- Helper: Connessione --------
    function updateConnectionStatus(status, roomId = null) {
        const states = {
            'connected': { dot: 'online', text: 'Connesso' },
            'connecting': { dot: 'connecting', text: 'Connessione...' },
            'disconnected': { dot: 'offline', text: 'Disconnesso' },
            'error': { dot: 'offline', text: 'Errore' },
        };
        const s = states[status] || states.disconnected;
        statusDot.className = `dot ${s.dot}`;
        statusText.textContent = s.text;
        roomName.textContent = roomId || '—';

        GAME.connected = status === 'connected';
        connectBtn.textContent = GAME.connected ? '🔗 Riconnetti' : '🔗 Connetti';
        readyBtn.disabled = !GAME.connected;
        leaveBtn.disabled = !GAME.connected;

        if (status === 'connected') {
            addLog(`Connesso alla stanza <span class="highlight">${roomId}</span>`, 'success');
            gameRunning = true;
        } else {
            gameRunning = false;
        }
    }

    // -------- Render giocatori UI --------
    function renderPlayersUI() {
        const ids = Object.keys(GAME.players);
        playerCount.textContent = ids.length;
        playersList.innerHTML = '';
        for (const id of ids) {
            const p = GAME.players[id];
            const isMe = id === GAME.me.id;
            const hpPercent = Math.max(0, (p.hp / p.maxHp) * 100);
            const hpClass = hpPercent < 30 ? 'low' : '';
            const tag = document.createElement('div');
            tag.className = 'player-tag';
            tag.innerHTML = `
                <span>${isMe ? '👤 ' : ''}${p.name}</span>
                <div class="hp-bar"><div class="hp-fill ${hpClass}" style="width:${hpPercent}%"></div></div>
                ${isMe ? '<span class="you">(tu)</span>' : ''}
            `;
            playersList.appendChild(tag);
        }
    }

    // -------- Inizializza giocatore --------
    function initLocalPlayer(name) {
        GAME.me.name = name || 'Anonimo';
        GAME.me.x = 150 + Math.random() * 500;
        GAME.me.y = 100 + Math.random() * 300;
        GAME.me.hp = GAME.me.maxHp = 100;
        GAME.me.direction = 0;
    }

    // -------- Spara un proiettile --------
    function fireProjectile() {
        if (!GAME.connected) return;
        if (GAME.attackCooldown > 0) return;
        if (GAME.me.hp <= 0) return;

        const angle = [0, Math.PI / 2, Math.PI, -Math.PI / 2][GAME.me.direction] || 0;
        const vx = Math.cos(angle) * GAME.projSpeed;
        const vy = Math.sin(angle) * GAME.projSpeed;

        const proj = {
            x: GAME.me.x + Math.cos(angle) * 30,
            y: GAME.me.y + Math.sin(angle) * 30,
            vx: vx,
            vy: vy,
            ownerId: GAME.me.id,
            life: GAME.projLife,
            damage: GAME.projDamage,
            radius: 10,
        };

        GAME.projectiles.push(proj);
        GAME.attackCooldown = GAME.attackCooldownTime;

        // Invia azione a tutti
        Multiplayer.sendAction('fire', {
            x: proj.x,
            y: proj.y,
            vx: vx,
            vy: vy,
            ownerId: GAME.me.id,
            life: GAME.projLife,
            damage: GAME.projDamage,
        });

        addLog(`🔫 Hai sparato un proiettile!`, 'highlight');
    }

    // -------- Invia stato --------
    function sendMyState() {
        if (!GAME.connected) return;
        Multiplayer.sendState({
            playerId: GAME.me.id,
            name: GAME.me.name,
            x: GAME.me.x,
            y: GAME.me.y,
            hp: GAME.me.hp,
            maxHp: GAME.me.maxHp,
            direction: GAME.me.direction,
        });
    }

    // -------- Gestione danno --------
    function takeDamage(attackerId, damage) {
        if (attackerId === GAME.me.id) return;
        const target = GAME.players[GAME.me.id];
        if (!target) return;
        const newHp = Math.max(0, GAME.me.hp - damage);
        GAME.me.hp = newHp;
        myHealthDisplay.textContent = `❤️ ${newHp}`;
        const attackerName = GAME.players[attackerId]?.name || 'Qualcuno';
        addLog(`💥 ${attackerName} ti ha colpito! (-${damage} HP)`, 'error');
        if (newHp <= 0) {
            addLog(`💀 Sei stato sconfitto!`, 'error');
            setTimeout(() => {
                GAME.me.hp = GAME.me.maxHp;
                GAME.me.x = 100 + Math.random() * 600;
                GAME.me.y = 100 + Math.random() * 300;
                myHealthDisplay.textContent = `❤️ ${GAME.me.hp}`;
                addLog(`🔄 Sei resuscitato!`, 'success');
                sendMyState();
            }, 2000);
        }
        sendMyState();
    }

    // -------- Eventi multiplayer --------
    function setupMultiplayerEvents() {
        Multiplayer.on('connected', (data) => {
            GAME.me.id = data.playerId;
            GAME.room = data.room;
            GAME.players = data.players || {};
            initLocalPlayer(data.playerName);
            GAME.players[GAME.me.id] = {
                id: GAME.me.id,
                name: GAME.me.name,
                x: GAME.me.x,
                y: GAME.me.y,
                hp: GAME.me.hp,
                maxHp: GAME.me.maxHp,
                direction: 0,
            };
            renderPlayersUI();
            updateConnectionStatus('connected', data.room);
            addLog(`👋 Benvenuto <span class="highlight">${data.playerName}</span>!`, 'success');
            gameRunning = true;
            setTimeout(() => sendMyState(), 100);
        });

        Multiplayer.on('disconnected', () => {
            updateConnectionStatus('disconnected');
            GAME.players = {};
            GAME.projectiles = [];
            renderPlayersUI();
            gameRunning = false;
            addLog('Connessione persa', 'error');
        });

        Multiplayer.on('players', (newPlayers) => {
            const currentIds = Object.keys(GAME.players);
            for (const id of Object.keys(newPlayers)) {
                if (id !== GAME.me.id) {
                    if (!GAME.players[id]) {
                        GAME.players[id] = newPlayers[id];
                        addLog(`👤 <span class="highlight">${newPlayers[id].name}</span> è entrato in arena`, 'success');
                    } else {
                        Object.assign(GAME.players[id], newPlayers[id]);
                    }
                }
            }
            for (const id of currentIds) {
                if (id !== GAME.me.id && !newPlayers[id]) {
                    const name = GAME.players[id]?.name || 'Qualcuno';
                    delete GAME.players[id];
                    addLog(`👋 ${name} ha lasciato l'arena`);
                }
            }
            renderPlayersUI();
        });

        Multiplayer.on('playerJoined', (player) => {
            if (player.id !== GAME.me.id) {
                GAME.players[player.id] = player;
                renderPlayersUI();
                addLog(`👤 <span class="highlight">${player.name}</span> si è unito`, 'success');
            }
        });

        Multiplayer.on('playerLeft', (playerId) => {
            const name = GAME.players[playerId]?.name || 'Qualcuno';
            delete GAME.players[playerId];
            renderPlayersUI();
            addLog(`👋 ${name} ha lasciato l'arena`);
        });

        Multiplayer.on('state', (state) => {
            if (state.playerId && state.playerId !== GAME.me.id) {
                const p = GAME.players[state.playerId];
                if (p) {
                    p.x = state.x || p.x;
                    p.y = state.y || p.y;
                    p.hp = state.hp !== undefined ? state.hp : p.hp;
                    p.maxHp = state.maxHp || p.maxHp;
                    p.direction = state.direction || 0;
                    renderPlayersUI();
                }
            }
        });

        Multiplayer.on('action', (playerId, action, data) => {
            if (playerId === GAME.me.id) return;
            if (action === 'fire') {
                // Crea un proiettile anche su questo client
                const proj = {
                    x: data.x,
                    y: data.y,
                    vx: data.vx,
                    vy: data.vy,
                    ownerId: data.ownerId,
                    life: data.life || GAME.projLife,
                    damage: data.damage || GAME.projDamage,
                    radius: 10,
                };
                GAME.projectiles.push(proj);
                const attacker = GAME.players[playerId];
                if (attacker) {
                    addLog(`🔫 <span class="highlight">${attacker.name}</span> ha sparato un proiettile!`);
                }
            }
        });

        Multiplayer.on('ready', (playerId, ready) => {
            if (GAME.players[playerId]) {
                GAME.players[playerId].ready = ready;
                renderPlayersUI();
                const name = GAME.players[playerId].name;
                addLog(`${name} ${ready ? '✅ è pronto' : '⏳ non è più pronto'}`);
            }
        });

        Multiplayer.on('error', (err) => {
            addLog(`❌ ${err}`, 'error');
            updateConnectionStatus('error');
        });
    }

    // -------- Connessione --------
    function initMultiplayer() {
        const serverUrl = serverUrlInput.value.trim() || 'wss://anime-multiplayer-server.onrender.com';
        window.MP_SERVER = serverUrl;
        Multiplayer.init({ server: serverUrl, autoConnect: false, debug: true });
        setupMultiplayerEvents();
        updateConnectionStatus('disconnected');
    }

    function connectToServer() {
        saveSettings();
        const name = playerNameInput.value.trim() || 'Anonimo';
        const room = roomInput.value.trim() || 'anime-arena';
        const serverUrl = serverUrlInput.value.trim() || 'wss://anime-multiplayer-server.onrender.com';

        if (!name) { addLog('⚠️ Inserisci un nome', 'error'); return; }
        if (!room) { addLog('⚠️ Inserisci una stanza', 'error'); return; }

        window.MP_SERVER = serverUrl;
        if (GAME.connected) {
            Multiplayer.leave();
            setTimeout(() => {
                Multiplayer.init({ server: serverUrl, autoConnect: false, debug: true });
                Multiplayer.connect({ playerName: name, room: room });
            }, 300);
            addLog(`🔄 Riconnessione come <span class="highlight">${name}</span>...`);
            updateConnectionStatus('connecting', room);
            return;
        }

        Multiplayer.init({ server: serverUrl, autoConnect: false, debug: true });
        Multiplayer.connect({ playerName: name, room: room });
        addLog(`🔗 Connessione a ${room} come <span class="highlight">${name}</span>...`);
        updateConnectionStatus('connecting', room);
    }

    function leaveServer() {
        if (!GAME.connected) return;
        Multiplayer.leave();
        GAME.players = {};
        GAME.projectiles = [];
        renderPlayersUI();
        updateConnectionStatus('disconnected');
        addLog('👋 Hai lasciato la stanza');
        gameRunning = false;
    }

    // -------- Game Loop --------
    function update() {
        if (!gameRunning || !GAME.connected) return;

        // Movimento
        let dx = 0, dy = 0;
        if (GAME.keys.w) dy = -GAME.speed;
        if (GAME.keys.s) dy = GAME.speed;
        if (GAME.keys.a) dx = -GAME.speed;
        if (GAME.keys.d) dx = GAME.speed;
        if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }

        const newX = Math.max(20, Math.min(780, GAME.me.x + dx));
        const newY = Math.max(20, Math.min(480, GAME.me.y + dy));
        if (newX !== GAME.me.x || newY !== GAME.me.y) {
            GAME.me.x = newX;
            GAME.me.y = newY;
            if (GAME.players[GAME.me.id]) {
                GAME.players[GAME.me.id].x = GAME.me.x;
                GAME.players[GAME.me.id].y = GAME.me.y;
            }
            if (dx > 0) GAME.me.direction = 1;
            else if (dx < 0) GAME.me.direction = 3;
            else if (dy < 0) GAME.me.direction = 2;
            else if (dy > 0) GAME.me.direction = 0;
            sendMyState();
        }

        // Cooldown attacco
        if (GAME.attackCooldown > 0) GAME.attackCooldown--;

        // Attacco (spazio)
        if (GAME.keys.space) {
            fireProjectile();
            GAME.keys.space = false;
        }

        // Aggiorna proiettili
        for (let i = GAME.projectiles.length - 1; i >= 0; i--) {
            const p = GAME.projectiles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;

            // Fuori mappa o vita esaurita
            if (p.life <= 0 || p.x < 0 || p.x > 800 || p.y < 0 || p.y > 500) {
                GAME.projectiles.splice(i, 1);
                continue;
            }

            // Collisione con giocatori (tranne il proprietario)
            let hit = false;
            for (const id of Object.keys(GAME.players)) {
                if (id === p.ownerId) continue;
                const player = GAME.players[id];
                const dx = p.x - player.x;
                const dy = p.y - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < p.radius + 20) {
                    // Colpito!
                    if (id === GAME.me.id) {
                        takeDamage(p.ownerId, p.damage);
                    } else {
                        // Se colpisce un altro giocatore, lo notifichiamo
                        // (il danno verrà gestito da quel client)
                        // Ma possiamo già togliere il proiettile
                        const owner = GAME.players[p.ownerId];
                        if (owner) {
                            addLog(`💥 <span class="highlight">${owner.name}</span> ha colpito ${player.name}!`, 'error');
                        }
                    }
                    hit = true;
                    break;
                }
            }
            if (hit) {
                GAME.projectiles.splice(i, 1);
            }
        }

        // Aggiorna health display
        myHealthDisplay.textContent = `❤️ ${GAME.me.hp}`;
    }

    function draw() {
        ctx.clearRect(0, 0, 800, 500);

        // Sfondo
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, 800, 500);

        // Griglia
        ctx.strokeStyle = '#2a2a4a';
        ctx.lineWidth = 1;
        for (let i = 0; i < 800; i += 40) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, 500);
            ctx.stroke();
        }
        for (let i = 0; i < 500; i += 40) {
            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(800, i);
            ctx.stroke();
        }

        // ---- Disegna proiettili ----
        for (const p of GAME.projectiles) {
            // Glow esterno
            const grad = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, 28);
            grad.addColorStop(0, 'rgba(255, 200, 50, 1)');
            grad.addColorStop(0.3, 'rgba(255, 150, 0, 0.8)');
            grad.addColorStop(1, 'rgba(255, 100, 0, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 28, 0, Math.PI * 2);
            ctx.fill();

            // Nucleo
            ctx.shadowColor = '#ff8800';
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#ffaa33';
            ctx.beginPath();
            ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Centro bianco
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(p.x - 2, p.y - 2, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // ---- Disegna giocatori ----
        for (const id of Object.keys(GAME.players)) {
            const p = GAME.players[id];
            if (!p) continue;
            const isMe = id === GAME.me.id;
            const x = p.x || 0;
            const y = p.y || 0;
            const hpPercent = Math.max(0, (p.hp / p.maxHp) * 100);

            ctx.shadowColor = isMe ? '#f7971e' : '#4ade80';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.fillStyle = isMe ? '#f7971e' : '#4ade80';
            ctx.fill();
            ctx.shadowBlur = 0;

            // Nome
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText(p.name, x, y - 34);

            // Barra HP
            const barWidth = 40;
            const barX = x - barWidth / 2;
            const barY = y - 28;
            ctx.fillStyle = '#2a2a4a';
            ctx.fillRect(barX, barY, barWidth, 6);
            ctx.fillStyle = hpPercent < 30 ? '#f87171' : '#4ade80';
            ctx.fillRect(barX, barY, barWidth * (hpPercent / 100), 6);

            if (isMe) {
                ctx.fillStyle = '#f7971e';
                ctx.font = '12px Segoe UI';
                ctx.fillText('⬇️ tu', x, y + 42);
            }

            // Freccia direzione
            const dir = p.direction || 0;
            const angles = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
            const angle = angles[dir] || 0;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + Math.cos(angle) * 22, y + Math.sin(angle) * 22);
            ctx.lineTo(x + Math.cos(angle + 0.5) * 28, y + Math.sin(angle + 0.5) * 28);
            ctx.moveTo(x + Math.cos(angle) * 22, y + Math.sin(angle) * 22);
            ctx.lineTo(x + Math.cos(angle - 0.5) * 28, y + Math.sin(angle - 0.5) * 28);
            ctx.stroke();
        }

        // Legenda
        ctx.fillStyle = '#8888aa';
        ctx.font = '12px Segoe UI';
        ctx.textAlign = 'left';
        ctx.fillText('WASD muovi | Spazio spara proiettili', 10, 490);
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // -------- Eventi tastiera --------
    document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
            GAME.keys[key] = true;
            e.preventDefault();
        }
        if (key === ' ' || e.key === 'Space') {
            GAME.keys.space = true;
            e.preventDefault();
        }
    });

    document.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
            GAME.keys[key] = false;
            e.preventDefault();
        }
        if (key === ' ' || e.key === 'Space') {
            GAME.keys.space = false;
            e.preventDefault();
        }
    });

    canvas.addEventListener('click', () => {
        if (GAME.connected) {
            GAME.keys.space = true;
            setTimeout(() => { GAME.keys.space = false; }, 50);
        }
    });

    // -------- UI --------
    connectBtn.addEventListener('click', connectToServer);
    leaveBtn.addEventListener('click', leaveServer);
    readyBtn.addEventListener('click', () => {
        if (!GAME.connected) return;
        GAME.ready = !GAME.ready;
        Multiplayer.setReady(GAME.ready);
        readyBtn.textContent = GAME.ready ? '⏳ Non pronto' : '✅ Pronto';
        readyBtn.className = GAME.ready ? 'danger' : 'success';
        addLog(`📌 Ti sei ${GAME.ready ? 'dichiarato PRONTO' : 'rimesso in attesa'}`);
    });

    [playerNameInput, roomInput, serverUrlInput].forEach(el => {
        el.addEventListener('keydown', (e) => { if (e.key === 'Enter') connectBtn.click(); });
    });

    // -------- Avvio --------
    loadSavedSettings();
    initMultiplayer();
    initLocalPlayer('Naruto');
    gameRunning = false;
    requestAnimationFrame(gameLoop);
    addLog('🎮 Gioco con proiettili! Premere Spazio per sparare.', 'highlight');
    console.log('⚔️ Anime Battle – Proiettili Multiplayer');
</script>
</body>
</html>
